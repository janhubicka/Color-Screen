name: Agent DG009 soft strip publisher

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/dg009-soft-strip-publish-20260824'
    runs-on: ubuntu-latest
    env:
      PATCH_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scr-detect-soft-strips
          fetch-depth: 0
      - name: Apply measured patch
        shell: bash
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/dg009-soft-strip.patch
          git apply --check /tmp/dg009-soft-strip.patch
          git apply /tmp/dg009-soft-strip.patch
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' doc/scr-detect-geometry-tracking.md src/libcolorscreen/scr-detect-geometry.C | sort)"
      - name: Commit and publish
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add src/libcolorscreen/scr-detect-geometry.C doc/scr-detect-geometry-tracking.md
          git commit -m "detect: use soft color evidence for missing Dufay strips" \
            -m "Improve unsharpened Dufay-like flood-fill continuity without globally relaxing the detector color-class map. Keep hard connected-component strip confirmation as the first path. When the hard strip is absent and legacy preclassification sharpening is disabled, compare the expected normalized dye fraction at three points along the geometry-predicted strip against corresponding samples on both neighboring rows. Require the strip dye to exceed the stronger neighbor by min_patch_contrast, and require the destination square patch to pass the existing fast geometric component confirmation before growing the flood frontier. Fall through to the historical slow image-domain path when the soft observation is insufficient.\n\nDo not use this fallback while any legacy detector unsharp mask is active, preserving historical 2/3 behavior and cost. Do not change classify_adjusted_color() or min_ratio globally: NGS00428 experiments show min_ratio=0.8 reaches similar fast-only coverage but expands the entire component graph and has a larger false-positive/performance surface.\n\nOn full-resolution NGS00428 with detector sharpening disabled, Tile05 fast-only screen coverage improves from 79.01% / 1,726,273 patches to 84.00% / 1,835,339 patches. Tile01, which contains a genuine raster-free corner, changes only from 62.99% to 63.58%. With historical 2/3 sharpening, Tile01 remains exactly 93.46% / 2,040,920 patches.\n\nDocument the color-map purity experiment and the new DG-026 strip continuity step in the geometry tracker.\n\nValidation: optimized O2 libcolorscreen/CLI build; synthetic discovery unit group passes for Finlay and Dufay; Ofast -march=native -Wall -Wextra compile of scr-detect-geometry.C; full-resolution Tile01/Tile05 0/0 fast-only benchmarks and Tile01 2/3 control; no added trailing whitespace."
          git push origin HEAD:agent/scr-detect-soft-strips
