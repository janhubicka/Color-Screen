name: Validate focus multistart patch

on:
  pull_request:
    branches:
      - agent/tmp-focus-multistart-validation-base-20260827

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out validation base
        uses: actions/checkout@v4
        with:
          ref: agent/tmp-focus-multistart-validation-base-20260827
          fetch-depth: 0

      - name: Reconstruct and apply patch
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cat agent/focus-multistart.part-* >/tmp/focus.patch
          cp agent/focus-multistart-testfix.patch /tmp/focus-testfix.patch
          cp agent/focus-multistart-candidate-color.patch /tmp/focus-candidate-color.patch
          cp agent/focus-multistart-all-basins.patch /tmp/focus-all-basins.patch
          echo '2d1dfef543d30209bb9589513f73023bdd67dfae25263a9fbdc1f0f94b13301a  /tmp/focus.patch' | sha256sum -c -
          echo '6a13d363b53870f63deca59c0a8f893290ba56fceb68e90ba75e73a52fa1ddf2  /tmp/focus-testfix.patch' | sha256sum -c -
          git checkout --detach a86ac611846419ace3934ac8f46752b5e8abb4a8
          git apply --check /tmp/focus.patch
          git apply /tmp/focus.patch
          git apply --check /tmp/focus-testfix.patch
          git apply /tmp/focus-testfix.patch
          git apply --check /tmp/focus-candidate-color.patch
          git apply /tmp/focus-candidate-color.patch
          git apply --check /tmp/focus-all-basins.patch
          git apply /tmp/focus-all-basins.patch
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/libcolorscreen/focus-analysis.C')
          s = p.read_text()
          anchor = '''/* Coupled physical sigma/defocus fitting is poorly conditioned from a single
             start, especially at the exact (0,0) boundary.  Use the cheap one-dimensional
          '''
          helper = '''/* At the exact physical (sigma,defocus) origin both transfer coordinates have
             weak first-order simplex information.  The one-dimensional fits are useful
             not only as direct joint seeds but also as coordinate-continuation anchors:
             fit one axis, hold it fixed while fitting the other, then release both.  */
          static bool
          cold_physical_focus_start_p (const render_parameters &rparam)
          {
            const coord_t sigma = rparam.sharpen.scanner_mtf.sigma;
            const coord_t defocus = rparam.sharpen.scanner_mtf.defocus;
            constexpr coord_t epsilon = (coord_t)1e-8;
            return my_isfinite (sigma) && my_isfinite (defocus) && sigma >= 0
                   && defocus >= 0 && sigma <= epsilon && defocus <= epsilon;
          }

          '''
          if s.count(anchor) != 1:
              raise SystemExit(f'focus helper anchor count {s.count(anchor)}')
          s = s.replace(anchor, helper + anchor, 1)

          staged_anchor = '  int first = 0, second = 1;\n'
          staged = '''  /* A cold origin needs a little more continuation than simply releasing both
             variables at an axis optimum.  Cross-fit the other coordinate while the
             first one stays fixed, then let the coupled simplex polish that staged
             point.  Try both orders because sigma and defocus have different transfer
             shapes even when they produce similar carrier attenuation.  */
            if (cold_physical_focus_start_p (rparam))
              for (int which = 0; which < 2; which++)
                if (scalar[which].success)
                  {
                    render_parameters staged = scalar[which].rparam;
                    finetune_parameters cross = fparams;
                    cross.flags &= ~coupled;
                    cross.flags |= scalar_flags[1 - which];
                    if (scalar_flags[1 - which] == finetune_scanner_mtf_sigma)
                      cross.interpolate_scanner_mtf_defocus = false;
                    finetune_result fit = finetune (staged, param, img, locations,
                                                   &starts, cross, progress);
                    if (!fit.success || !my_isfinite (fit.badness)
                        || !freeze_focus_from_fit (&staged, cross.flags, fit))
                      continue;
                    consider_joint_fit (staged, param, img, locations, starts, fparams,
                                        progress, &best, best_seed_kind,
                                        scalar[which].kind);
                  }

          '''
          if s.count(staged_anchor) != 1:
              raise SystemExit(f'focus staged anchor count {s.count(staged_anchor)}')
          s = s.replace(staged_anchor, staged + staged_anchor, 1)
          old_comment = '''  /* Release both coordinates from the better scalar basin first.  Usually one
             of these already captures the process-screen attenuation and this avoids
             paying for two equally poor coupled searches.  If it does not beat the
             loaded start, try the other basin as a fallback.  */
          '''
          new_comment = '''  /* Release both coordinates from every successful scalar basin.  Scalar and
             coupled residuals live in different parameter spaces, so a scalar basin
             that ranks second can still become the best released solution.  */
          '''
          if s.count(old_comment) != 1:
              raise SystemExit(f'focus scalar comment count {s.count(old_comment)}')
          p.write_text(s.replace(old_comment, new_comment, 1))

          p = Path('src/libcolorscreen/focus-analysis-unittests.C')
          s = p.read_text()
          replacements = [
              ('"(cold sigma %.6f defocus %.6f seed %d; "',
               '"(cold badness %.9g sigma %.6f defocus %.6f seed %d; "'),
              ('"warm sigma %.6f defocus %.6f seed %d)\\n",',
               '"warm badness %.9g sigma %.6f defocus %.6f seed %d)\\n",'),
              ('(double)cold.joint_screen_mtf, (double)warm.joint_screen_mtf,\n',
               '(double)cold.joint_screen_mtf, (double)warm.joint_screen_mtf,\n'
               '               (double)cold.joint_fit.badness,\n'),
              ('cold.joint_seed_kind,\n',
               'cold.joint_seed_kind,\n'
               '               (double)warm.joint_fit.badness,\n'),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'diagnostic anchor count {s.count(old)} for {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check

      - name: Build and run focused tests
        shell: bash
        run: |
          set -euxo pipefail
          CXXFLAGS='-O2 -g' CFLAGS='-O2 -g' ./configure
          make -C src/libcolorscreen -j$(nproc) focus-analysis-unittests
          ./src/libcolorscreen/focus-analysis-unittests
          make -C src/colorscreen -j$(nproc) colorscreen
          ./src/colorscreen/colorscreen --help >/tmp/colorscreen-help.txt 2>&1 || true
          grep -q 'analyze-focus-areas' /tmp/colorscreen-help.txt
          grep -q 'sigma-defocus' /tmp/colorscreen-help.txt

      - name: Package portable CLI
        shell: bash
        run: |
          set -euxo pipefail
          B=/tmp/focus-cli
          mkdir -p "$B/lib"
          cp src/colorscreen/.libs/colorscreen "$B/colorscreen.bin"
          cp -L src/libcolorscreen/.libs/libcolorscreen.so.2.0.0 "$B/lib/"
          ln -s libcolorscreen.so.2.0.0 "$B/lib/libcolorscreen.so.2"
          ln -s libcolorscreen.so.2.0.0 "$B/lib/libcolorscreen.so"
          for exe in src/colorscreen/.libs/colorscreen src/libcolorscreen/.libs/libcolorscreen.so.2.0.0; do
            ldd "$exe" | awk '/=> \/.*\(/ {print $3} /^\// {print $1}' | while read -r lib; do
              test -f "$lib" && cp -L -n "$lib" "$B/lib/" || true
            done
          done
          cat >"$B/colorscreen" <<'EOF'
          #!/bin/sh
          HERE=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          export LD_LIBRARY_PATH="$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/colorscreen.bin" "$@"
          EOF
          sed -i 's/^          //' "$B/colorscreen"
          chmod +x "$B/colorscreen" "$B/colorscreen.bin"
          "$B/colorscreen" --help >/tmp/bundle-help.txt 2>&1 || true
          grep -q 'analyze-focus-areas' /tmp/bundle-help.txt

      - name: Upload portable CLI
        uses: actions/upload-artifact@v4
        with:
          name: focus-multistart-cli
          path: /tmp/focus-cli
          retention-days: 3
