name: Validate and publish focus multistart patch

on:
  pull_request:
    branches:
      - agent/tmp-focus-multistart-validation-base-20260827

permissions:
  contents: write
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tmp-focus-multistart-validation-base-20260827
          fetch-depth: 0

      - name: Reconstruct and apply patch
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cat agent/focus-multistart.part-* >/tmp/focus.patch
          cp agent/focus-multistart-testfix.patch /tmp/focus-testfix.patch
          cp agent/focus-multistart-candidate-color.patch /tmp/focus-candidate-color.patch
          cp agent/focus-multistart-all-basins.patch /tmp/focus-all-basins.patch
          git fetch origin main
          test "$(git rev-parse origin/main)" = a86ac611846419ace3934ac8f46752b5e8abb4a8
          git checkout --detach a86ac611846419ace3934ac8f46752b5e8abb4a8
          git apply /tmp/focus.patch
          git apply /tmp/focus-testfix.patch
          git apply /tmp/focus-candidate-color.patch
          git apply /tmp/focus-all-basins.patch
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/libcolorscreen/focus-analysis.C')
          s = p.read_text()
          anchor = '#include "include/focus-analysis.h"\n'
          if s.count(anchor) != 1:
              raise SystemExit('focus include anchor mismatch')
          s = s.replace(anchor, anchor + '#include "finetune-int.h"\n', 1)

          struct_anchor = '''    coord_t badness = std::numeric_limits<coord_t>::max ();\n    render_parameters rparam;\n'''
          if s.count(struct_anchor) != 1:
              raise SystemExit('scalar struct anchor mismatch')
          s = s.replace(struct_anchor,
                        '''    coord_t badness = std::numeric_limits<coord_t>::max ();\n    render_parameters rparam;\n    finetune_result fit;\n''', 1)

          new = '''  auto consider_scalar_seed = [&] (int which,
                                                     const render_parameters &seed) {
              finetune_parameters one = fparams;
              one.flags &= ~coupled;
              one.flags |= scalar_flags[which];
              finetune_result fit
                  = finetune (seed, param, img, locations, &starts, one, progress);
              if (!fit.success || !my_isfinite (fit.badness))
                return;
              render_parameters frozen = seed;
              if (!freeze_focus_from_fit (&frozen, one.flags, fit))
                return;
              if (!scalar[which].success || fit.badness < scalar[which].badness)
                {
                  scalar[which].success = true;
                  scalar[which].badness = fit.badness;
                  scalar[which].rparam = std::move (frozen);
                  scalar[which].fit = std::move (fit);
                  scalar[which].kind = which + 1;
                }
            };
            for (int which = 0; which < 2; which++)
              consider_scalar_seed (which, rparam);

            /* Physical defocus is even at exact focus, so a simplex initialized
               at zero has no first-order direction.  Seed nonzero defocus starts
               from the same optics-derived useful range as adaptive focusing.  */
            constexpr coord_t cold_epsilon = (coord_t)1e-8;
            if (my_isfinite (rparam.sharpen.scanner_mtf.defocus)
                && rparam.sharpen.scanner_mtf.defocus >= 0
                && rparam.sharpen.scanner_mtf.defocus <= cold_epsilon)
              {
                mtf_parameters focus_mtf = rparam.sharpen.scanner_mtf;
                if (!(fparams.flags & finetune_bw) && img.has_rgb ())
                  focus_mtf.wavelength = 550;
                const coord_t frequency = process_screen_frequency (param, img);
                coord_t useful_limit = 0;
                if (frequency > 0
                    && finetune_useful_defocus_limit (
                        focus_mtf, frequency, (coord_t)0.05, (coord_t)20,
                        &useful_limit)
                    && useful_limit > cold_epsilon)
                  {
                    static constexpr coord_t fractions[]
                        = { (coord_t)0.125, (coord_t)0.25, (coord_t)0.5 };
                    for (coord_t fraction : fractions)
                      {
                        render_parameters seed = rparam;
                        seed.sharpen.scanner_mtf.defocus
                            = useful_limit * fraction;
                        consider_scalar_seed (1, seed);
                      }
                  }
              }

            /* A scalar prefit is already a fully evaluated feasible point of the
               coupled parameter space.  Retain it as a candidate before asking
               the released simplex to improve it; a failed release must not
               discard a better seed solution.  */
            for (int which = 0; which < 2; which++)
              if (scalar[which].success
                  && (!best.success || scalar[which].fit.badness < best.badness))
                {
                  best = scalar[which].fit;
                  if (best_seed_kind)
                    *best_seed_kind = scalar[which].kind;
                }

          '''
          start = s.find('  for (int which = 0; which < 2; which++)\n')
          end = s.find('  /* Release both coordinates', start)
          if start < 0 or end < 0:
              raise SystemExit(f'scalar-loop markers {start} {end}')
          s = s[:start] + new + s[end:]
          old_comment = '''  /* Release both coordinates from the better scalar basin first.  Usually one
             of these already captures the process-screen attenuation and this avoids
             paying for two equally poor coupled searches.  If it does not beat the
             loaded start, try the other basin as a fallback.  */
          '''
          new_comment = '''  /* Release both coordinates from every successful scalar basin.  Scalar and
             coupled residuals come from different parameter spaces, so scalar rank
             must not prune a basin before the released all-area comparison.  */
          '''
          if old_comment in s:
              s = s.replace(old_comment, new_comment, 1)
          p.write_text(s)

          p = Path('src/libcolorscreen/focus-analysis-unittests.C')
          s = p.read_text()
          replacements = [
              ('"(cold sigma %.6f defocus %.6f seed %d; "',
               '"(cold badness %.9g sigma %.6f defocus %.6f seed %d; "'),
              ('"warm sigma %.6f defocus %.6f seed %d)\\n",',
               '"warm badness %.9g sigma %.6f defocus %.6f seed %d)\\n",'),
              ('(double)cold.joint_screen_mtf, (double)warm.joint_screen_mtf,\n',
               '(double)cold.joint_screen_mtf, (double)warm.joint_screen_mtf,\n'
               '               (double)cold.joint_fit.badness,\n'),
              ('cold.joint_seed_kind,\n',
               'cold.joint_seed_kind,\n'
               '               (double)warm.joint_fit.badness,\n'),
          ]
          for old, replacement in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'diagnostic anchor count {s.count(old)} for {old!r}')
              s = s.replace(old, replacement, 1)
          p.write_text(s)
          PY
          git diff --check
          printf '%s\n' \
            src/colorscreen/colorscreen.C \
            src/libcolorscreen/focus-analysis-unittests.C \
            src/libcolorscreen/focus-analysis.C \
            src/libcolorscreen/include/focus-analysis.h \
            src/qtgui/MainWindow.cpp \
            src/qtgui/SharpnessPanel.cpp | sort >/tmp/expected-files
          git diff --name-only | sort >/tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Build and run focused tests
        shell: bash
        run: |
          set -euxo pipefail
          CXXFLAGS='-O2 -g' CFLAGS='-O2 -g' ./configure
          make -C src/libcolorscreen -j$(nproc) focus-analysis-unittests
          ./src/libcolorscreen/focus-analysis-unittests
          make -C src/colorscreen -j$(nproc) colorscreen
          ./src/colorscreen/colorscreen --help >/tmp/colorscreen-help.txt 2>&1 || true
          grep -q 'analyze-focus-areas' /tmp/colorscreen-help.txt
          grep -q 'sigma-defocus' /tmp/colorscreen-help.txt

      - name: Commit and push clean feature branch
        shell: bash
        run: |
          set -euxo pipefail
          git switch -c agent/focus-area-carrier-multistart
          git add src/colorscreen/colorscreen.C \
                  src/libcolorscreen/focus-analysis.C \
                  src/libcolorscreen/include/focus-analysis.h \
                  src/libcolorscreen/focus-analysis-unittests.C \
                  src/qtgui/MainWindow.cpp \
                  src/qtgui/SharpnessPanel.cpp
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          git diff --cached --check
          git config user.name 'OpenAI Codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'focus: stabilize coupled carrier MTF fits' \
            -m 'Use the periodic focus-area pixel objective to select among the loaded calibration and scalar-seeded coupled basins. Preserve a fully evaluated scalar seed as a feasible coupled candidate so a released simplex cannot discard a better solution.' \
            -m 'Cold physical defocus is an even-function boundary, so derive a useful defocus range from the process-screen carrier and try a few nonzero defocus-only starts before releasing both coordinates. Keep both scalar basins in the final coupled comparison.' \
            -m 'Report effective process-screen MTF in CLI and Qt diagnostics, warm-start leave-one-out validation from the shared fit, and cover cold versus calibrated starts with a synthetic physical Paget regression.'
          git push origin HEAD:refs/heads/agent/focus-area-carrier-multistart
