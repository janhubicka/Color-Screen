name: Agent publish Qt tabbed workspace

on:
  pull_request:
    branches:
      - agent/transport-base-qt-tabbed-current
    paths:
      - .github/workflows/agent-publish-qt-tabbed.yml
      - agent/qt-tabbed-source-docs.patch.xz.b64.*

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/transport-qt-tabbed-20260821'
    runs-on: ubuntu-latest
    steps:
      - name: Check out transport payload
        uses: actions/checkout@v4
        with:
          path: transport

      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: cda22812f2749690aab0ddf365c0ad7d6640ae85
          fetch-depth: 0
          path: repo

      - name: Verify payload and publish tabbed workspace commit
        shell: bash
        run: |
          set -euxo pipefail
          cat transport/agent/qt-tabbed-source-docs.patch.xz.b64.* > qt-tabbed.patch.xz.b64
          echo '4bbf85aab183c08d01c0487d7f1f98e961ceff46337fedcbb8eeec66019e85e1  qt-tabbed.patch.xz.b64' | sha256sum -c -
          base64 --decode qt-tabbed.patch.xz.b64 > qt-tabbed.patch.xz
          echo 'c25cb5d2b89d349688109bc2d44b07835bf37ef039430d37ce1e243545766f90  qt-tabbed.patch.xz' | sha256sum -c -
          xz --decompress --stdout qt-tabbed.patch.xz > qt-tabbed.patch
          echo '2bbda0e3f68a0b3f8c29b88a6a36944baa3e33f8825a970f3198dad1cecce268  qt-tabbed.patch' | sha256sum -c -
          cd repo
          test "$(git rev-parse HEAD)" = cda22812f2749690aab0ddf365c0ad7d6640ae85
          git checkout -B agent/qtgui-tabbed-workspace cda22812f2749690aab0ddf365c0ad7d6640ae85
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git am --whitespace=error ../qt-tabbed.patch
          test "$(git rev-list --count cda22812f2749690aab0ddf365c0ad7d6640ae85..HEAD)" = 1
          git diff --check cda22812f2749690aab0ddf365c0ad7d6640ae85..HEAD
          test "$(git diff --name-only cda22812f2749690aab0ddf365c0ad7d6640ae85..HEAD | sort)" = $'.agents/qtgui.md\nNEWS\nREADME.md\nsrc/qtgui/CMakeLists.txt\nsrc/qtgui/ColorScreenApplication.cpp\nsrc/qtgui/ColorScreenApplication.h\nsrc/qtgui/MainWindow.cpp\nsrc/qtgui/Makefile.am\nsrc/qtgui/Makefile.in\nsrc/qtgui/WorkspaceWindow.cpp\nsrc/qtgui/WorkspaceWindow.h\nsrc/qtgui/main.cpp'
          git push --force origin HEAD:refs/heads/agent/qtgui-tabbed-workspace
