name: Agent Qt MDI cleanup publisher

on:
  push:
    branches:
      - agent/tmp-mdi-cleanup-publish-base-20260829

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish explicit detachable-section registry
        run: |
          set -e
          git config user.name OpenAI
          git config user.email noreply@openai.com
          cp .github/agent-mdi-section-registry-fix.py /tmp/agent-mdi-section-registry-fix.py
          git fetch origin agent/qtgui-mdi-shell-cleanup
          git checkout -B agent/qtgui-mdi-shell-cleanup origin/agent/qtgui-mdi-shell-cleanup
          python3 /tmp/agent-mdi-section-registry-fix.py
          git diff --check
          git add src/qtgui/ParameterPanel.h src/qtgui/ParameterPanel.cpp
          git commit -m "qtgui: track detachable sections independently of layout"
          git push origin HEAD:agent/qtgui-mdi-shell-cleanup
