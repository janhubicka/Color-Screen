name: Agent Qt MDI cleanup publisher

on:
  push:
    branches:
      - agent/tmp-mdi-cleanup-publish-base-20260829

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish workspace lifecycle cleanup
        run: |
          set -euo pipefail
          git config user.name OpenAI
          git config user.email noreply@openai.com
          cp .github/agent-mdi-top-level-host-fix.py /tmp/agent-mdi-top-level-host-fix.py
          git fetch origin agent/qtgui-mdi-shell-cleanup
          git checkout -B agent/qtgui-mdi-shell-cleanup origin/agent/qtgui-mdi-shell-cleanup
          python3 /tmp/agent-mdi-top-level-host-fix.py
          git diff --check
          git add src/qtgui/ParameterPanel.cpp src/qtgui/ParameterPanel.h \
                  src/qtgui/WorkspaceWindow.cpp src/qtgui/WorkspaceWindow.h \
                  src/qtgui/main.cpp
          if git diff --cached --quiet; then
            echo "No product changes to publish"
            exit 0
          fi
          git commit -m "qtgui: tighten workspace ownership lifetimes"
          git push origin HEAD:agent/qtgui-mdi-shell-cleanup
