name: Agent Qt MDI cleanup publisher

on:
  push:
    branches:
      - agent/tmp-mdi-cleanup-publish-base-20260829

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish top-level detachable host fix
        run: |
          set -euo pipefail
          git config user.name OpenAI
          git config user.email noreply@openai.com
          cp .github/agent-mdi-top-level-host-fix.py /tmp/agent-mdi-top-level-host-fix.py
          git fetch origin agent/qtgui-mdi-shell-cleanup
          git checkout -B agent/qtgui-mdi-shell-cleanup origin/agent/qtgui-mdi-shell-cleanup
          python3 /tmp/agent-mdi-top-level-host-fix.py
          git diff --check
          git add src/qtgui/ImageViewWindow.cpp src/qtgui/main.cpp .agents/qtgui.md
          git commit -m "qtgui: host detachable sections in top-level window"
          git push origin HEAD:agent/qtgui-mdi-shell-cleanup
