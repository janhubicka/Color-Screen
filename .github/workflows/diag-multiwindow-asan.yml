name: Diagnose multi-window ASan

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/diag-multiwindow-asan'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      PATH: /usr/lib/qt6/libexec:/usr/lib/x86_64-linux-gnu/qt6/libexec:/usr/lib/qt6/bin:/usr/lib/x86_64-linux-gnu/qt6/bin:/usr/lib64/qt6/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      ASAN_OPTIONS: abort_on_error=1:detect_leaks=0:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure sanitizer build
        shell: bash
        run: |
          set -euxo pipefail
          CXXFLAGS='-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined' \
          CFLAGS='-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined' \
          LDFLAGS='-fsanitize=address,undefined' \
            ./configure --enable-qtgui --disable-static-link
      - name: Build
        run: make -j$(nproc)
      - name: Run combined multi-window smoke under sanitizers
        shell: bash
        run: |
          set -euxo pipefail
          QT_QPA_PLATFORM=offscreen ./src/qtgui/colorscreen-qt \
            --smoke-test 10000 --smoke-test-expect-windows 2 \
            --smoke-test-tile-activation-stable --smoke-test-menu-order \
            --smoke-test-new-view --smoke-test-slanted-reference \
            "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif" \
            "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif"
