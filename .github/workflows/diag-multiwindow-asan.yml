name: Diagnose multi-window gdb

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/diag-multiwindow-asan'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      PATH: /usr/lib/qt6/libexec:/usr/lib/x86_64-linux-gnu/qt6/libexec:/usr/lib/qt6/bin:/usr/lib/x86_64-linux-gnu/qt6/bin:/usr/lib64/qt6/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v4
      - name: Install debugger
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v gdb >/dev/null; then
            apt-get update
            apt-get install -y gdb
          fi
      - name: Configure optimized debug build
        shell: bash
        run: |
          set -euxo pipefail
          CXXFLAGS='-Ofast -g -fno-omit-frame-pointer' \
          CFLAGS='-Ofast -g -fno-omit-frame-pointer' \
            ./configure --enable-qtgui
      - name: Build
        run: make -j$(nproc)
      - name: Capture combined smoke abort backtrace
        shell: bash
        run: |
          set -euxo pipefail
          export QT_QPA_PLATFORM=offscreen
          gdb -q -batch \
            -ex 'set pagination off' \
            -ex 'set confirm off' \
            -ex run \
            -ex 'thread apply all bt full' \
            --args ./src/qtgui/colorscreen-qt \
              --smoke-test 10000 --smoke-test-expect-windows 2 \
              --smoke-test-tile-activation-stable --smoke-test-menu-order \
              --smoke-test-new-view --smoke-test-slanted-reference \
              "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif" \
              "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif"
