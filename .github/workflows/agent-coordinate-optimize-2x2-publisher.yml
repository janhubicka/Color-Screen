name: TEMP publish coordinate optimize 2x2
on:
  push:
    branches:
      - agent/tmp-coordinate-optimize-2x2-publisher
  pull_request:
    branches:
      - agent/tmp-coordinate-optimize-2x2-base
jobs:
  publish:
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eb66eab20b432a75d9a00dce6b7acedf43a4f068
          fetch-depth: 0
      - name: Reconstruct and validate patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, pathlib
          data = base64.b64decode('')
          pathlib.Path('/tmp/fix.patch').write_bytes(data)
          PY
          echo "62c46f134a7b6c3ca6b65e48d28785294b3cfbe335e8b810f21d815ca713dc29  /tmp/fix.patch" | sha256sum -c -
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' src/libcolorscreen/finetune.C src/libcolorscreen/include/finetune.h src/qtgui/CoordinateOptimizationWorker.cpp | sort)"
          test "$changed" = "$expected"
      - name: Install focused build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libtiff-dev libturbojpeg0-dev libzip-dev libgsl-dev libraw-dev liblcms2-dev libfftw3-dev libexiv2-dev libopenjp2-7-dev libpng-dev qt6-base-dev qt6-tools-dev qt6-tools-dev-tools libqt6svg6-dev
      - name: Configure checked Qt build
        shell: bash
        run: |
          mkdir build-agent
          cd build-agent
          CFLAGS='-O2 -g -Wall -Wextra' CXXFLAGS='-O2 -g -Wall -Wextra' ../configure --enable-checking --enable-qtgui --disable-shared --enable-static --disable-static-link
      - name: Compile changed core and GUI paths
        shell: bash
        run: |
          make -C build-agent/src/libcolorscreen -j2 libcolorscreen_la-finetune.lo
          make -C build-agent/src/qtgui -j2 colorscreen_qt-CoordinateOptimizationWorker.o
      - name: Publish clean feature branch
        shell: bash
        run: |
          git config user.name 'OpenAI Agent'
          git config user.email 'openai-agent@users.noreply.github.com'
          git add src/libcolorscreen/include/finetune.h src/libcolorscreen/finetune.C src/qtgui/CoordinateOptimizationWorker.cpp
          git commit -m 'qtgui: limit coordinate optimization to 2x2 screen periods' -m 'The Geometry panel Optimize coordinates action refines center, rotation and scale using finetune, but it inherited finetune coordinate-mode defaults that analyze a much larger region, especially for Dufay and other strip screens. This makes a local geometry adjustment unnecessarily expensive.\n\nAdd an opt-in fixed_range contract to finetune_parameters. When enabled with a positive range, finetune uses that exact screen-coordinate half-extent and skips both the strip-screen vertical enlargement and the retry loop that grows tiny mapped tiles. Existing callers retain the historical adaptive behavior because fixed_range defaults to false.\n\nUse range=1 and fixed_range=true in CoordinateOptimizationWorker. Since range is a half-extent in screen-period coordinates, this limits the GUI operation to a 2x2-period neighborhood while preserving the existing position plus coordinate scale/rotation fit.\n\nValidated by applying the patch to current main with git diff --check and compiling the modified finetune core object plus CoordinateOptimizationWorker in an O2 checked Qt build.'
          git branch -f agent/coordinate-optimize-2x2 HEAD
          git push --force origin agent/coordinate-optimize-2x2
