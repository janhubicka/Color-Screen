name: TEMP Paget verbose seed CLI

on:
  push:
    branches:
      - agent/tmp-paget-seed-diag-20260904

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git make g++ gcc pkg-config libtool autoconf automake \
            libfftw3-dev libgsl-dev libturbojpeg0-dev liblcms2-dev libraw-dev \
            libzip-dev libexiv2-dev libtiff-dev libjpeg62-turbo-dev \
            libopenjp2-7-dev libpng-dev
      - uses: actions/checkout@v4
        with:
          ref: agent/scr-detect-primary-separation
          fetch-depth: 0
      - name: Enable seed diagnostics and build
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = d159ffbdf3f717b96f9edf9e6a8d6f77eec76509
          sed -i '0,/const bool verbose = false;/s//const bool verbose = true;/' \
            src/libcolorscreen/scr-detect-geometry.C
          grep -n 'const bool verbose = true;' src/libcolorscreen/scr-detect-geometry.C
          mkdir build-diag && cd build-diag
          CFLAGS='-O1 -g0' CXXFLAGS='-O1 -g0' ../configure \
            --enable-checking --disable-gtkgui --disable-qtgui \
            --disable-shared --enable-static --disable-static-link
          make -j"$(nproc)" -C src/libcolorscreen libcolorscreen.la
          make -j"$(nproc)" -C src/colorscreen colorscreen
          mkdir /tmp/paget-seed-verbose
          cp src/colorscreen/colorscreen /tmp/paget-seed-verbose/
          tar -C /tmp -czf /tmp/paget-seed-verbose-cli.tar.gz paget-seed-verbose
      - uses: actions/upload-artifact@v4
        with:
          name: paget-seed-verbose-cli
          path: /tmp/paget-seed-verbose-cli.tar.gz
          if-no-files-found: error
          retention-days: 1
