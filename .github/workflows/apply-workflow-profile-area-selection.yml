''')

          replace_once(
              image_cpp,
              '''void ImageWidget::mousePressEvent(QMouseEvent *event) {
            if (m_interactionMode == SetCenterMode) {
''',
              '''void ImageWidget::mousePressEvent(QMouseEvent *event) {
            // A selection must be interpreted against a stationary canvas. Smooth
            // fit/zoom/pan animation otherwise changes m_viewX/Y/scale between the
            // press and release and displaces the selected scan rectangle.
            if (event->button() == Qt::LeftButton &&
                m_interactionMode != PanMode &&
