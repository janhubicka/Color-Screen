name: Apply workflow profile and area-selection repair

on:
  push:
    branches:
      - qtgui/workflow-profile-area-selection

permissions:
  contents: write
  packages: read

jobs:
  patch-build-and-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      PATH: /usr/lib/qt6/libexec:/usr/lib/x86_64-linux-gnu/qt6/libexec:/usr/lib/qt6/bin:/usr/lib/x86_64-linux-gnu/qt6/bin:/usr/lib64/qt6/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qtgui/workflow-profile-area-selection
          fetch-depth: 0

      - name: Apply source changes
        run: python3 .github/apply-workflow-profile-area-selection.py

      - name: Verify patch invariants
        shell: bash
        run: |
          set -euxo pipefail
          grep -F 'WorkflowProfileSummary' src/qtgui/MainWindow.cpp
          grep -F 'capture_supports_screen_detection_p(capture)' src/qtgui/MainWindow.cpp
          grep -F 'Image layer + screen filter demosaiced with detail recovery' src/qtgui/MainWindow.cpp
          ! grep -F 'Show registration points and inspect' src/qtgui/MainWindow.cpp
          grep -F 'widgetAreaToImage' src/qtgui/ImageWidget.cpp src/qtgui/MainWindow.cpp src/qtgui/ImageViewWindow.cpp
          grep -F 'getTransformedCropSize' src/qtgui/ImageWidget.cpp
          git diff --check

      - name: Configure Qt GUI
        run: ./configure --enable-qtgui

      - name: Build
        run: make -j$(nproc)

      - name: Run focused workspace smoke test
        shell: bash
        run: |
          QT_QPA_PLATFORM=offscreen ./src/qtgui/colorscreen-qt \
            --smoke-test 30000 --smoke-test-expect-windows 2 \
            --smoke-test-document-lifecycle \
            "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif" \
            "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif"

      - name: Commit repaired sources
        shell: bash
        run: |
          set -euxo pipefail
          rm .github/workflows/apply-workflow-profile-area-selection.yml
          rm .github/apply-workflow-profile-area-selection.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "qtgui: clarify workflow and stabilize area selection"
          git push origin HEAD:qtgui/workflow-profile-area-selection
