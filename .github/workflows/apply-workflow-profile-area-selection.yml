            if (!m_scan->has_rgb())
              return tr("Profile (optional): unavailable — capture has no RGB channels");

            const qsizetype count = static_cast<qsizetype>(m_profileSpots.size());
            const bool savedCalibration = m_rparams.has_correction_profile();
            if (count < 4) {
              if (savedCalibration)
                return tr("Profile (optional): saved calibration present — provenance not verified • %1/4 spots")
                    .arg(count);
              return tr("Profile (optional): %1/4 calibration spots — add %2 more")
