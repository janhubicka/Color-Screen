name: Apply workflow profile and area-selection repair

on:
  push:
    branches:
      - qtgui/workflow-profile-area-selection

permissions:
  contents: write
  packages: read

jobs:
  patch-build-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      PATH: /usr/lib/qt6/libexec:/usr/lib/x86_64-linux-gnu/qt6/libexec:/usr/lib/qt6/bin:/usr/lib/x86_64-linux-gnu/qt6/bin:/usr/lib64/qt6/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qtgui/workflow-profile-area-selection
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}\n--- pattern ---\n{old}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          main = "src/qtgui/MainWindow.cpp"
          image_cpp = "src/qtgui/ImageWidget.cpp"
          image_h = "src/qtgui/ImageWidget.h"
          view_cpp = "src/qtgui/ImageViewWindow.cpp"
          smoke = "src/qtgui/WorkspaceChurnSmoke.cpp"

          replace_once(
              main,
              '''  m_workflowCalibrationLabel->setWordWrap(true);
          workflowLayout->addWidget(m_workflowCalibrationLabel);

          QFont workflowSectionFont = m_workflowProcessLabel->font();
          workflowSectionFont.setWeight(QFont::DemiBold);
          if (workflowSectionFont.pointSizeF() > 1.0)
            workflowSectionFont.setPointSizeF(workflowSectionFont.pointSizeF() - 0.5);
          m_workflowProcessLabel->setFont(workflowSectionFont);
          m_workflowRegistrationLabel->setFont(workflowSectionFont);
          m_workflowCalibrationLabel->setFont(workflowSectionFont);

          m_workflowNextStepLabel = new QLabel(workflowSummary);''',
              '''  m_workflowCalibrationLabel->setWordWrap(true);
          workflowLayout->addWidget(m_workflowCalibrationLabel);

          auto *workflowProfileLabel = new QLabel(workflowSummary);
          workflowProfileLabel->setObjectName(
              QStringLiteral("WorkflowProfileSummary"));
          workflowProfileLabel->setWordWrap(true);
          workflowProfileLabel->setToolTip(tr(
              "Optional simple matrix color correction for RGB captures made "
              "with the screen filter present."));
          workflowLayout->addWidget(workflowProfileLabel);

          QFont workflowSectionFont = m_workflowProcessLabel->font();
          workflowSectionFont.setWeight(QFont::DemiBold);
          if (workflowSectionFont.pointSizeF() > 1.0)
            workflowSectionFont.setPointSizeF(workflowSectionFont.pointSizeF() - 0.5);
          m_workflowProcessLabel->setFont(workflowSectionFont);
          m_workflowRegistrationLabel->setFont(workflowSectionFont);
          m_workflowCalibrationLabel->setFont(workflowSectionFont);
          workflowProfileLabel->setFont(workflowSectionFont);

          m_workflowNextStepLabel = new QLabel(workflowSummary);''')

          replace_once(
              main,
              '''  auto setWorkflowExpanded =
              [this, workflowToggle, workflowStages](bool expanded) {
                workflowToggle->setArrowType(expanded ? Qt::DownArrow : Qt::RightArrow);
                workflowStages->setVisible(expanded);
                m_workflowProcessLabel->setVisible(expanded);
                m_workflowRegistrationLabel->setVisible(expanded);
                m_workflowCalibrationLabel->setVisible(expanded);
                m_workflowNextStepLabel->setVisible(expanded);''',
              '''  auto setWorkflowExpanded =
              [this, workflowToggle, workflowStages,
               workflowProfileLabel](bool expanded) {
                workflowToggle->setArrowType(expanded ? Qt::DownArrow : Qt::RightArrow);
                workflowStages->setVisible(expanded);
                m_workflowProcessLabel->setVisible(expanded);
                m_workflowRegistrationLabel->setVisible(expanded);
                m_workflowCalibrationLabel->setVisible(expanded);
                workflowProfileLabel->setVisible(
                    expanded && !workflowProfileLabel->text().isEmpty());
                m_workflowNextStepLabel->setVisible(expanded);''')

          replace_once(
              main,
              '''QString MainWindow::profileCalibrationSummary() const {
            if (!m_scan)
              return tr("Profile: load an image to calibrate");

            const auto capture = m_rparams.get_capture_type(m_scan.get());
            if (!colorscreen::render_parameters::capture_has_screen_p(capture))
              return tr("Profile: not applicable to this capture workflow");
            if (!m_scan->has_rgb())
              return tr("Profile: unavailable — capture has no RGB channels");

            const qsizetype count = static_cast<qsizetype>(m_profileSpots.size());
            const bool savedCalibration = m_rparams.has_correction_profile();
            if (count < 4) {
              if (savedCalibration)
                return tr("Profile: saved calibration present — provenance not verified • %1/4 spots")
                    .arg(count);
              return tr("Profile: %1/4 calibration spots — add %2 more")
                  .arg(count).arg(4 - count);
            }

            const ColorOptimizerRequestData current{
                m_scrToImgParams, m_rparams, m_profileSpots};
            const bool fitCurrent = m_profileCalibrationBaseline &&
                !profileCalibrationInputsDiffer(*m_profileCalibrationBaseline, current);
            const bool failureCurrent = m_profileCalibrationFailureInputs &&
                !profileCalibrationInputsDiffer(*m_profileCalibrationFailureInputs, current);

            QString summary = tr("Profile: %1 calibration spots").arg(count);''',
              '''QString MainWindow::profileCalibrationSummary() const {
            if (!m_scan)
              return tr("Profile (optional): load an image to calibrate");

            const auto capture = m_rparams.get_capture_type(m_scan.get());
            if (!colorscreen::render_parameters::
