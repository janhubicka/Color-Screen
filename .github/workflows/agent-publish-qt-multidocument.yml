name: Agent publish Qt multi-document

on:
  pull_request:
    branches:
      - agent/transport-base-qt-multidocument
    paths:
      - .github/workflows/agent-publish-qt-multidocument.yml
      - agent/qt.patch.xz.b64.*

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/transport-qt-multidocument-20260821'
    runs-on: ubuntu-latest
    steps:
      - name: Check out transport payload
        uses: actions/checkout@v4
        with:
          path: transport

      - name: Check out current non-overlapping base
        uses: actions/checkout@v4
        with:
          ref: 878d96176f03ac8ddffdb072e120868b0c909c67
          fetch-depth: 0
          path: repo

      - name: Verify payload and publish source/documentation commits
        shell: bash
        run: |
          set -euxo pipefail
          cat transport/agent/qt.patch.xz.b64.* > qt.patch.xz.b64
          echo 'dce9c704d55a21e4cf8753854b77e6d45ad6c7fac0d1652e2296183f62163ad4  qt.patch.xz.b64' | sha256sum -c -
          base64 --decode qt.patch.xz.b64 > qt.patch.xz
          echo '64b34cf0c82eeb46ed0a80a7d994108288163cd2c96b9a3612b3d3517ce4f26d  qt.patch.xz' | sha256sum -c -
          xz --decompress --stdout qt.patch.xz > qt-multidocument.patch
          echo '062523e6a4c500941fde4fe922efe1beec1835f5654974d144b60f4b31d6ec8d  qt-multidocument.patch' | sha256sum -c -

          cd repo
          base=878d96176f03ac8ddffdb072e120868b0c909c67
          test "$(git rev-parse HEAD)" = "$base"
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'

          # Reconstruct the exact tested commits first, then rewrite only the
          # implementation commit to omit workflow files. GitHub Actions tokens
          # cannot update workflow definitions; those four files are added as a
          # separate connector-authored CI commit after this branch is pushed.
          git checkout -B agent/qtgui-multi-document-assembled "$base"
          git am --whitespace=error ../qt-multidocument.patch
          original_implementation=$(git rev-parse HEAD~1)
          original_documentation=$(git rev-parse HEAD)

          git checkout -B agent/qtgui-multi-document "$base"
          git cherry-pick --no-commit "$original_implementation"
          git restore --source="$base" --staged --worktree -- \
            .github/workflows/build-macos.yml \
            .github/workflows/build-ubuntu.yml \
            .github/workflows/build-windows-clang.yml \
            .github/workflows/build-windows.yml
          git commit -C "$original_implementation"
          git cherry-pick "$original_documentation"

          test "$(git rev-list --count "$base"..HEAD)" = 2
          git diff --check "$base"..HEAD
          test "$(git diff --name-only "$base"..HEAD | sort)" = $'.agents/qtgui.md\nNEWS\nREADME.md\nsrc/qtgui/CMakeLists.txt\nsrc/qtgui/ColorScreenApplication.cpp\nsrc/qtgui/ColorScreenApplication.h\nsrc/qtgui/MainWindow.cpp\nsrc/qtgui/MainWindow.h\nsrc/qtgui/Makefile.am\nsrc/qtgui/Makefile.in\nsrc/qtgui/main.cpp'
          git push --force origin HEAD:refs/heads/agent/qtgui-multi-document
