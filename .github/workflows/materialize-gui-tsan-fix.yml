name: Materialize validated GUI TSan fix

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    if: github.event.pull_request.number == 206
    runs-on: ubuntu-24.04
    steps:
      - name: Check out final review branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-gui-tsan-races
          fetch-depth: 0

      - name: Download exact green-tested source artifact
        uses: actions/download-artifact@v4
        with:
          name: tsan-render-handoff-source
          path: /tmp/validated-source
          repository: janhubicka/Color-Screen
          run-id: 33011846158
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Materialize clean review commit
        shell: bash
        run: |
          set -euxo pipefail

          cp /tmp/validated-source/qtgui/Renderer.h src/qtgui/Renderer.h
          cp /tmp/validated-source/qtgui/Renderer.cpp src/qtgui/Renderer.cpp
          cp /tmp/validated-source/qtgui/ImageWidget.cpp src/qtgui/ImageWidget.cpp
          cp /tmp/validated-source/qtgui/NavigationView.cpp src/qtgui/NavigationView.cpp
          cp /tmp/validated-source/qtgui/ImageViewWindow.h src/qtgui/ImageViewWindow.h
          cp /tmp/validated-source/qtgui/ImageViewWindow.cpp src/qtgui/ImageViewWindow.cpp
          cp /tmp/validated-source/qtgui/TilePreviewPanel.h src/qtgui/TilePreviewPanel.h
          cp /tmp/validated-source/qtgui/TilePreviewPanel.cpp src/qtgui/TilePreviewPanel.cpp
          cp /tmp/validated-source/qtgui/SynchronizedRunnable.h src/qtgui/SynchronizedRunnable.h
          cp /tmp/validated-source/libcolorscreen/render-tile.C src/libcolorscreen/render-tile.C
          cp /tmp/validated-source/libcolorscreen/render-scr-detect.C src/libcolorscreen/render-scr-detect.C

          # Prove that every source file is byte-for-byte the source validated by run 87.
          test "$(git hash-object src/qtgui/Renderer.h)" = 5f08f5aa52b087cc8b8bf508accd5cacdc705d22
          test "$(git hash-object src/qtgui/Renderer.cpp)" = 2b83972b3148d1c72f9ef00edb2ed2ac0c34ec99
          test "$(git hash-object src/qtgui/ImageWidget.cpp)" = b7f520f536efcdcca88cbcc3154efc7a3892feed
          test "$(git hash-object src/qtgui/NavigationView.cpp)" = f986a2df8d11ff11d9621aff5bfd8aa390f00531
          test "$(git hash-object src/qtgui/ImageViewWindow.h)" = bb21aa430f7dd987f3a61afef6a564d3e932e497
          test "$(git hash-object src/qtgui/ImageViewWindow.cpp)" = d7cc9dd6402062f42a6279dc310538f12c2c109c
          test "$(git hash-object src/qtgui/TilePreviewPanel.h)" = 7e04c28417dee32f8505fadea59badd383c69b18
          test "$(git hash-object src/qtgui/TilePreviewPanel.cpp)" = 46ce335a631d3b0330b93a589fec168abdcd4ca7
          test "$(git hash-object src/qtgui/SynchronizedRunnable.h)" = 2a76525bfcab985958d765eae2ac9ff5aeafe40e
          test "$(git hash-object src/libcolorscreen/render-tile.C)" = fa661f2d245efd750fb1bd02261151b1ee460e9c
          test "$(git hash-object src/libcolorscreen/render-scr-detect.C)" = 8a199d0c030ef5ca5faa6791669b43a41cbb3236

          git mv testsuite/qt-tsan-smoke-probe.test testsuite/qt-tsan-smoke.test
          python3 - <<'PY'
          from pathlib import Path

          p = Path('testsuite/qt-tsan-smoke.test')
          s = p.read_text()
          s = s.replace('## Temporary probe for Qt GUI smoke coverage under ThreadSanitizer.',
                        '## Qt GUI smoke coverage under ThreadSanitizer.')
          s = s.replace('qt-tsan-smoke-${platform}.probe.log',
                        'qt-tsan-smoke-${platform}.log')
          p.write_text(s)

          p = Path('.github/workflows/sanitizers.yml')
          s = p.read_text()
          s = s.replace('Qt GUI smoke probe (ThreadSanitizer)',
                        'Qt GUI smoke test (ThreadSanitizer)')
          s = s.replace('testsuite/qt-tsan-smoke-probe.test',
                        'testsuite/qt-tsan-smoke.test')
          p.write_text(s)

          p = Path('src/qtgui/Makefile.am')
          s = p.read_text()
          old = 'ParameterPanel.h ParameterState.h Renderer.h SharpnessPanel.h'
          new = 'ParameterPanel.h ParameterState.h Renderer.h SynchronizedRunnable.h SharpnessPanel.h'
          if old not in s:
              raise SystemExit('Could not locate Renderer.h in EXTRA_DIST')
          p.write_text(s.replace(old, new, 1))
          PY

          git diff --check
          test -z "$(git status --porcelain | grep '^?? .github/ci/' || true)"

          git config user.name "Jan Hubička"
          git config user.email "46065755+janhubicka@users.noreply.github.com"
          git add src/qtgui src/libcolorscreen/render-tile.C \
                  src/libcolorscreen/render-scr-detect.C \
                  .github/workflows/sanitizers.yml testsuite/qt-tsan-smoke.test \
                  testsuite/qt-tsan-smoke-probe.test
          git commit -m "qtgui: make threaded rendering TSan-visible" -m "Publish renderer requests and worker results through project-owned C++ mutexes so ThreadSanitizer can observe the happens-before edges hidden inside distro Qt. Replace QtConcurrent task publication in renderer, reference-image, and tile-preview paths with synchronized QRunnable handoffs while preserving QThreadPool and OpenMP parallelism. Also make CSSTATS bookkeeping thread-safe and promote the GUI TSan probe to permanent smoke coverage."
          git push origin HEAD:agent/fix-gui-tsan-races
