name: Test focus carrier v4

on:
  pull_request:
    branches: [agent/tmp-focus-carrier-publish-base]

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tmp-focus-carrier-publish-base
          fetch-depth: 0
      - name: Reconstruct exact source patch
        shell: bash
        run: |
          set -euo pipefail
          for spec in '00 0e5154b465a5c4ca68e65d72f2f46fb2b80e400f' '01 0d65721a074723e452d87a73176d1f65cfd9393d' '03 edbfe075b283891dd6be71bf9da9addd493dfa5a' '04 4a956ddb9fbd609ae2feb9d90b069eaf3c4c5911' '05 d3c0e4012db11d06448d98d8339b4c0b1ddf9e8d' '06a d2c137459ea0ef35de4eb9a336922f90410699ac' '06b deb191a0e14bf867342e16ed5e3ff79ccef96b22'; do
            set -- $spec; test "$(git hash-object agent/focus-carrier-v2-$1.b64)" = "$2"; cp "agent/focus-carrier-v2-$1.b64" "/tmp/c$1";
          done
          head -c 7800 agent/focus-carrier-v2-02.b64 >/tmp/c02a
          tail -c 7800 agent/focus-carrier-v2-02.b64 >/tmp/c02b
          if test "$(git hash-object /tmp/c02a)" = 58b19fd66748455363105fa37311d5a42dbad4cf; then cp /tmp/c02a /tmp/c02; else cp /tmp/c02b /tmp/c02; fi
          test "$(git hash-object /tmp/c02)" = 58b19fd66748455363105fa37311d5a42dbad4cf
          cat /tmp/c06a /tmp/c06b >/tmp/c06
          test "$(git hash-object /tmp/c06)" = 5c85bd61ee75392c3587b0fff72376223a92579d
          cat /tmp/c00 /tmp/c01 /tmp/c02 /tmp/c03 /tmp/c04 /tmp/c05 /tmp/c06 | base64 -d >/tmp/focus.patch
          echo '6c20c4d435d8fae1d8d7711de9051d6479a241f025f3b66d1082a3fe27beb306  /tmp/focus.patch' | sha256sum -c -
          echo '391494b7eff5193b34bd9406a15ad462c119a69624f0e0b6ff6e2d4fe9855806  agent/focus-carrier-test-link-fix.patch' | sha256sum -c -
          echo '69b7408038d476dfc94563d4515defd8125587b4c8c2ae5c9847e4df7e17876c  agent/focus-carrier-probe-phase-fix.patch' | sha256sum -c -
          cp agent/focus-carrier-test-link-fix.patch /tmp/focus-carrier-test-link-fix.patch
          cp agent/focus-carrier-probe-phase-fix.patch /tmp/focus-carrier-probe-phase-fix.patch
      - name: Apply and validate
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git checkout --detach 5b4e956d023dd42618ccbae9078f42f97300f6c5
          git apply /tmp/focus.patch
          git apply /tmp/focus-carrier-test-link-fix.patch
          git apply /tmp/focus-carrier-probe-phase-fix.patch
          git diff --check
          CXXFLAGS='-O2 -g' CFLAGS='-O2 -g' ./configure >/dev/null
          make -C src/libcolorscreen -j$(nproc) focus-analysis-unittests >/dev/null
          ./src/libcolorscreen/focus-analysis-unittests
          make -C src/colorscreen -j$(nproc) colorscreen >/dev/null
          test -x src/colorscreen/colorscreen -o -x src/colorscreen/.libs/colorscreen
          echo 'FOCUS CARRIER V4 VALIDATION PASS'
      - name: Bundle CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/focus-cli/bin /tmp/focus-cli/lib
          bin=src/colorscreen/.libs/colorscreen; test -x "$bin" || bin=src/colorscreen/colorscreen
          cp -L "$bin" /tmp/focus-cli/bin/colorscreen
          objs=("$bin"); if test -f src/libcolorscreen/.libs/libcolorscreen.so.2; then objs+=(src/libcolorscreen/.libs/libcolorscreen.so.2); fi
          for obj in "${objs[@]}"; do ldd "$obj" | awk '{for(i=1;i<=NF;i++) if ($i ~ /^\//) {print $i; break}}'; done | sort -u >/tmp/libs
          while read -r lib; do cp -L "$lib" "/tmp/focus-cli/lib/$(basename "$lib")"; done </tmp/libs
          if test -f src/libcolorscreen/.libs/libcolorscreen.so.2; then cp -L src/libcolorscreen/.libs/libcolorscreen.so.2 /tmp/focus-cli/lib/libcolorscreen.so.2; fi
          cat >/tmp/focus-cli/colorscreen <<'EOF'
          #!/bin/sh
          here=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          export LD_LIBRARY_PATH="$here/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$here/bin/colorscreen" "$@"
          EOF
          chmod +x /tmp/focus-cli/colorscreen
      - uses: actions/upload-artifact@v4
        with:
          name: focus-carrier-v4-cli
          path: /tmp/focus-cli
          retention-days: 3
