name: Agent new-view parity publisher

on:
  pull_request:
    branches: [ "agent/tmp-new-view-parity-publish-base-20260828" ]

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/tmp-new-view-parity-publish-trigger-20260828'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and publish New View parity patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent-new-view-parity.patch.00 \
              .github/agent-new-view-parity.patch.01 \
              .github/agent-new-view-parity.patch.02 \
              .github/agent-new-view-parity.patch.03 > /tmp/new-view-parity.patch
          echo "8bf175ff38d86ba96ca3de6f1680efb0da42693e2dd3b8b65ac09ea3ac5c7576  /tmp/new-view-parity.patch" | sha256sum -c -
          git checkout --detach 98f53b934e1dadf655d0be1e2510aa4484614a04
          git apply --check /tmp/new-view-parity.patch
          git apply /tmp/new-view-parity.patch
          git diff --check
          test "$(git diff --name-only)" = $'.agents/qtgui.md\nsrc/qtgui/ImageViewWindow.cpp\nsrc/qtgui/ImageViewWindow.h\nsrc/qtgui/ImageWidget.h\nsrc/qtgui/MainWindow.cpp\nsrc/qtgui/MainWindow.h\nsrc/qtgui/main.cpp'
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git add .agents/qtgui.md src/qtgui/ImageViewWindow.cpp src/qtgui/ImageViewWindow.h src/qtgui/ImageWidget.h src/qtgui/MainWindow.cpp src/qtgui/MainWindow.h src/qtgui/main.cpp
          git commit -m "qtgui: make ordinary New Views full document peers" \
            -m "Make ordinary secondary views expose the document Edit and Registration menus and reuse the same document-owned canvas toolbar actions as the primary presentation while preserving view-local render, Color/IR, coordinate, zoom, and pan state." \
            -m "Route shared canvas actions through the ImageWidget currently presenting the document inspector. Pending crop, generic-area, measurement, and registration tools move between compatible ordinary views of the same loaded scan, leaving the previous canvas in Pan mode. Explicitly reject inspector routing to widgets displaying a different image, such as slanted-edge reference views." \
            -m "Fix area-selection and registration handlers that still hard-coded the primary ImageWidget, keep the Color QWidgetAction visible in secondary toolbars, and add New View smoke coverage for menu/toolbar parity plus Measure/Crop transfer."
          git push --force origin HEAD:agent/new-view-parity
