name: Agent toolbar first-show publisher

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/tmp-toolbar-first-show-publisher-20260905'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qtgui-toolbar-first-show-order
          fetch-depth: 0

      - name: Apply guarded workspace first-show repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/qtgui/WorkspaceWindow.cpp')
          s = p.read_text()
          old = '''  m_mdiArea->setActiveSubWindow(subWindow);\n  --m_chromeActivationBlockDepth;\n  onSubWindowActivated(subWindow);\n  configureTabBar();\n\n  show();\n  if (isMinimized())\n    showNormal();\n  raise();\n  activateWindow();\n'''
          new = '''  m_mdiArea->setActiveSubWindow(subWindow);\n\n  // Keep chrome handoff blocked through the workspace's own first show/layout.\n  // Qt's offscreen macOS backend cannot safely relayout a hidden QMainWindow\n  // after a live QToolBar has been moved into it from the child window.\n  show();\n  if (isMinimized())\n    showNormal();\n\n  --m_chromeActivationBlockDepth;\n  onSubWindowActivated(subWindow);\n  configureTabBar();\n  raise();\n  activateWindow();\n'''
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'expected two insertion tails, found {count}')
          p.write_text(s.replace(old, new))
          PY

          git diff --check
          test "$(git diff --name-only)" = 'src/qtgui/WorkspaceWindow.cpp'
          test "$(grep -c "Keep chrome handoff blocked through the workspace's own first show/layout" src/qtgui/WorkspaceWindow.cpp)" -eq 2

      - name: Publish product branch
        shell: bash
        run: |
          git config user.name 'Jan Hubička'
          git config user.email '46065755+janhubicka@users.noreply.github.com'
          git add src/qtgui/WorkspaceWindow.cpp
          git commit -m 'qtgui: show workspace before toolbar handoff'
          git push origin HEAD:agent/qtgui-toolbar-first-show-order
