name: DN017 source transport

on:
  push:
    branches:
      - agent/dn017-transport

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dn017-transport
      - name: Archive exact source tree
        shell: bash
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          tar --exclude=.git --exclude=.github/workflows/dn017-source-transport.yml -czf /tmp/colorscreen-dn017-current-main.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: dn017-current-main-source
          path: /tmp/colorscreen-dn017-current-main.tar.gz
