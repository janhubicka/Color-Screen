name: Agent publish peer-view lifetime patch

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - '.agent/READY-peer-view-raw2'

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/tmp-publish-peer-view-lifetime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble exact patch bytes
        run: |
          cat .agent/peer-view.patch.* > /tmp/peer-view.patch
          # The first transport chunk accidentally duplicated the boundary blank
          # line. Remove that one line, then require the exact locally-reviewed
          # patch hash before applying anything.
          sed -i '181d' /tmp/peer-view.patch
          echo 'c9fa2d5c2728144789b7de6343e42bfc32445255b44df34e5af7b9ffa5c3cf8f  /tmp/peer-view.patch' | sha256sum -c -

      - name: Publish clean branch
        env:
          BASE_SHA: ef036dcd9b93aeb48a97d5dba64f5aa39140c24e
          TARGET_BRANCH: agent/qtgui-peer-view-window-lifetime
        run: |
          git checkout --detach "$BASE_SHA"
          git switch -c "$TARGET_BRANCH"
          git apply --check /tmp/peer-view.patch
          git apply /tmp/peer-view.patch
          git diff --check
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add \
            .agents/qtgui.md \
            .github/workflows/build-ubuntu.yml \
            src/qtgui/ColorScreenApplication.cpp \
            src/qtgui/ColorScreenApplication.h \
            src/qtgui/ImageViewWindow.cpp \
            src/qtgui/ImageViewWindow.h \
            src/qtgui/MainWindow.cpp \
            src/qtgui/WorkspaceWindow.cpp \
            src/qtgui/WorkspaceWindow.h \
            src/qtgui/main.cpp
          git commit -m "qtgui: make image views peer windows"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Remove temporary publisher branch
        if: success()
        run: git push origin --delete agent/tmp-publish-peer-view-lifetime || true
