name: Agent publish peer-view lifetime patch

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - '.agent/READY-peer-view-raw4'

permissions:
  contents: write

env:
  GIT_TERMINAL_PROMPT: '0'

jobs:
  publish:
    if: github.head_ref == 'agent/tmp-publish-peer-view-lifetime'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and verify exact patch bytes
        run: |
          cat .agent/peer-view.patch.* > /tmp/peer-view.patch
          sed -i '181d' /tmp/peer-view.patch
          echo 'c9fa2d5c2728144789b7de6343e42bfc32445255b44df34e5af7b9ffa5c3cf8f  /tmp/peer-view.patch' | sha256sum -c -

      - name: Apply patch to current base
        run: |
          git checkout --detach ef036dcd9b93aeb48a97d5dba64f5aa39140c24e
          git switch -c agent/qtgui-peer-view-window-lifetime
          git apply --check /tmp/peer-view.patch
          git apply /tmp/peer-view.patch
          git diff --check
          # PR-triggered GitHub App tokens cannot update workflow files without
          # the separate workflows permission. Keep the new smoke mode in main.cpp
          # but leave the existing CI workflow unchanged in this review branch.
          git checkout -- .github/workflows/build-ubuntu.yml

      - name: Commit patch
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add \
            .agents/qtgui.md \
            src/qtgui/ColorScreenApplication.cpp \
            src/qtgui/ColorScreenApplication.h \
            src/qtgui/ImageViewWindow.cpp \
            src/qtgui/ImageViewWindow.h \
            src/qtgui/MainWindow.cpp \
            src/qtgui/WorkspaceWindow.cpp \
            src/qtgui/WorkspaceWindow.h \
            src/qtgui/main.cpp
          git -c commit.gpgsign=false commit --no-verify -m "qtgui: make image views peer windows"

      - name: Push clean branch
        run: timeout 45 git push --force origin HEAD:refs/heads/agent/qtgui-peer-view-window-lifetime
