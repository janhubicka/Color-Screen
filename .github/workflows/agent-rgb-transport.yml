name: Publish weighted overlap matching

on:
  pull_request:
    branches:
      - agent/transport-publish-base-20260821

permissions:
  contents: write

concurrency:
  group: weighted-overlap-matching-publisher
  cancel-in-progress: true

jobs:
  publish-weighted-matching:
    if: github.head_ref == 'agent/transport-rgb-sharpening-20260821'
    runs-on: ubuntu-slim
    steps:
      - name: Check out exact transport payload
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: transport

      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: 16fe77d3c08dc3e27b927bba7e9ec16a6d97bc84
          fetch-depth: 0
          path: repo

      - name: Verify, commit, and publish the tested patch
        shell: bash
        run: |
          set -euxo pipefail
          cat transport/agent/weighted-main-chunks/* > weighted-matching-main.patch
          echo 'ed7052f4d8edb22701ed9ee01ebd08ad0b5a3dbb33756bd03f2bab665c11a7a2  weighted-matching-main.patch' | sha256sum -c -
          echo 'a41ead607b9ba836f5ee97ebb1d99347aed2668fd363b2995ca65da41362aa40  transport/agent/weighted-paget-fix-raw.patch' | sha256sum -c -

          cd repo
          test "$(git rev-parse HEAD)" = 16fe77d3c08dc3e27b927bba7e9ec16a6d97bc84
          git checkout -B agent/weighted-overlap-matching 16fe77d3c08dc3e27b927bba7e9ec16a6d97bc84
          git apply --index --whitespace=error ../weighted-matching-main.patch
          git apply --index --whitespace=error ../transport/agent/weighted-paget-fix-raw.patch
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'src/libcolorscreen/analyze-base.C\nsrc/libcolorscreen/unittests.C'
          test "$(git write-tree)" = e3d8cf50d282c4078940ecda2c572e9df2fecd2c
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git commit -F ../transport/agent/weighted-matching-commit.txt
          git push --force origin HEAD:refs/heads/agent/weighted-overlap-matching
          printf 'Published %s on base %s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^)"
