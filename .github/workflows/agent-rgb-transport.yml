name: Publish weighted overlap matching

on:
  pull_request:
    branches:
      - agent/transport-publish-base-20260821

permissions:
  contents: write

concurrency:
  group: weighted-overlap-matching-publisher
  cancel-in-progress: true

jobs:
  publish-weighted-matching:
    if: github.head_ref == 'agent/transport-rgb-sharpening-20260821'
    runs-on: macos-latest
    steps:
      - name: Check out exact transport payload
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: transport

      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: repo

      - name: Verify payload and publish one commit
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          def decode(parts, output, expected):
              data = b''.join(
                  base64.b64decode(
                      ''.join(path.read_text().split()), validate=True
                  )
                  for path in parts
              )
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected:
                  raise SystemExit(
                      f'{output}: SHA-256 {actual}, expected {expected}'
                  )
              Path(output).write_bytes(data)

          decode(
              sorted(Path('transport/agent').glob('weighted-matching.patch.b64.*')),
              'weighted-matching.patch',
              '97889df09fdb654c101f964bd47081942f0c3db43c222426a1a3a30da103b9f4',
          )
          decode(
              [Path('transport/agent/weighted-paget-fix.patch.b64')],
              'weighted-paget-fix.patch',
              '259e1c06927b9c1372e868efbac3f4d83eb197e3a3152aa91c22a2af605994e3',
          )
          PY

          cd repo
          base=$(git rev-parse HEAD)
          test "$(git rev-parse --abbrev-ref HEAD)" = main
          git checkout -B agent/weighted-overlap-matching "$base"
          git apply --index --whitespace=error ../weighted-matching.patch
          git apply --index --whitespace=error ../weighted-paget-fix.patch
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'src/libcolorscreen/analyze-base.C\nsrc/libcolorscreen/unittests.C'
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git commit -F ../transport/agent/weighted-matching-commit.txt
          git push --force origin HEAD:refs/heads/agent/weighted-overlap-matching
          printf 'Published on base %s as %s\n' "$base" "$(git rev-parse HEAD)"
