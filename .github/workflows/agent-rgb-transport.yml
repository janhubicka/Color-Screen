name: Publish weighted overlap matching

on:
  pull_request:
    branches:
      - agent/transport-publish-base-20260821

permissions:
  contents: write

jobs:
  publish-weighted-matching:
    if: github.head_ref == 'agent/transport-rgb-sharpening-20260821'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact transport payload
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: transport

      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: 16fe77d3c08dc3e27b927bba7e9ec16a6d97bc84
          fetch-depth: 0
          path: repo

      - name: Verify payload and publish one commit
        shell: bash
        run: |
          set -euxo pipefail
          cat transport/agent/weighted-matching.patch.b64.* \
            | tr -d '\r\n' \
            | base64 --decode > weighted-matching.patch
          echo '97889df09fdb654c101f964bd47081942f0c3db43c222426a1a3a30da103b9f4  weighted-matching.patch' \
            | sha256sum -c -

          tr -d '\r\n' < transport/agent/weighted-paget-fix.patch.b64 \
            | base64 --decode > weighted-paget-fix.patch
          echo '259e1c06927b9c1372e868efbac3f4d83eb197e3a3152aa91c22a2af605994e3  weighted-paget-fix.patch' \
            | sha256sum -c -

          cd repo
          test "$(git rev-parse HEAD)" = 16fe77d3c08dc3e27b927bba7e9ec16a6d97bc84
          git checkout -B agent/weighted-overlap-matching 16fe77d3c08dc3e27b927bba7e9ec16a6d97bc84
          git apply --index --whitespace=error ../weighted-matching.patch
          git apply --index --whitespace=error ../weighted-paget-fix.patch
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'src/libcolorscreen/analyze-base.C\nsrc/libcolorscreen/unittests.C'
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git commit -F ../transport/agent/weighted-matching-commit.txt
          git push --force origin HEAD:refs/heads/agent/weighted-overlap-matching
          git rev-parse HEAD
