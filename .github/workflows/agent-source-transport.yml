name: Agent source transport

on:
  push:
    branches: [ "agent/transport-background-lifetime-smoke" ]

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package exact source tree
        run: |
          git rev-parse HEAD > AGENT_TRANSPORT_HEAD
          tar --exclude=.git -czf colorscreen-agent-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: colorscreen-agent-source
          path: colorscreen-agent-source.tar.gz
