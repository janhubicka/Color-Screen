name: Agent source transport

on:
  push:
    branches:
      - agent/source-transport-multi-document-20260821
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish-denoise-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and publish denoise fix
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin main agent/denoise-unit-support-exact
          git switch -C agent/denoise-unit-support-exact origin/agent/denoise-unit-support-exact
          test "$(git rev-parse HEAD)" = "16fe77d3c08dc3e27b927bba7e9ec16a6d97bc84"
          test "$(git hash-object src/libcolorscreen/denoise.C)" = "a9a29557c957826f2912be088173a70b5a83d4fb"
          git apply <<'PATCH'
          diff --git a/src/libcolorscreen/denoise.C b/src/libcolorscreen/denoise.C
          --- a/src/libcolorscreen/denoise.C
          +++ b/src/libcolorscreen/denoise.C
          @@ -265,9 +265,28 @@ denoising<T>::process_tile (int thread_id, progress_info *progress)
             const T *support
                 = m_use_support ? m_data[thread_id].support.data () : nullptr;
           
          +  /* Unit support is defined to reproduce the historical unweighted filter
          +     exactly.  Do not rely on algebraically redundant multiplications by one
          +     compiling to bit-identical code under -ffast-math: Apple Clang can select
          +     a different arithmetic/vectorization path for the support-enabled
          +     template.
          +     Dispatch an all-unit tile through the same unweighted implementation.  */
          +  bool use_support = m_use_support;
          +  if (use_support)
          +    {
          +      use_support = false;
          +      const size_t n = (size_t)m_tile_size * m_tile_size;
          +      for (size_t i = 0; i < n; i++)
          +        if (usable_support (support[i]) != (T)1)
          +          {
          +            use_support = true;
          +            break;
          +          }
          +    }
          +
             if (m_params.mode == denoise_parameters::bilateral)
               {
          -      if (m_use_support)
          +      if (use_support)
                   process_bilateral<true> (
                       m_tile_size, border, basic_size, in, out,
                       (T)m_params.bilateral_sigma_s, (T)m_params.bilateral_sigma_r,
          @@ -280,7 +299,7 @@ denoising<T>::process_tile (int thread_id, progress_info *progress)
               }
             else if (m_params.mode == denoise_parameters::nl_fast)
               {
          -      if (m_use_support)
          +      if (use_support)
                   process_nl_fast<true> (
                       m_tile_size, border, basic_size, in, out, m_params.patch_radius,
                       m_params.search_radius, m_params, m_data[thread_id].aux1.data (),
          @@ -332,7 +351,7 @@ denoising<T>::process_tile (int thread_id, progress_info *progress)
                                         T v2 = in[(cy + py) * m_tile_size + (cx + px)];
                                         T d2 = denoise_nl_square_distance (v1, v2,
                                                                             m_params);
          -                              if (m_use_support)
          +                              if (use_support)
                                           {
                                             int idx1 = (y + py) * m_tile_size + (x + px);
                                             int idx2 = (cy + py) * m_tile_size + (cx + px);
          @@ -349,7 +368,7 @@ denoising<T>::process_tile (int thread_id, progress_info *progress)
                                  T weight
                                      = std::exp (-dist_sq * inv_patch_size
                                                  * inv_strength_sq);
          -                      if (m_use_support)
          +                      if (use_support)
                                  weight *= usable_support (
                                      support[cy * m_tile_size + cx]);
                                weighted_sum += weight * in[cy * m_tile_size + cx];
          PATCH
          git diff --check
          test "$(git hash-object src/libcolorscreen/denoise.C)" = "c60cd209cb7f57838c94a373f9293fff11ed085b"
          git config user.name "OpenAI Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -- src/libcolorscreen/denoise.C
          git commit -F - <<'MSG'
          denoise: route unit support through unweighted filter

          Confidence-aware denoising defines support one as exactly the
          historical unweighted behavior.  The macOS Apple Silicon -Ofast
          tests exposed a one-ULP difference because the support-enabled
          template is still a separate compiled arithmetic path even when all
          support factors are one.

          Detect all-unit support tiles and dispatch bilateral, fast NLM, and
          reference NLM through the same unweighted implementation.  Mixed or
          non-unit support keeps the existing confidence-aware calculations.
          This makes the documented compatibility invariant structural rather
          than depending on fast-math optimization choices, and preserves the
          existing bit-exact regression instead of weakening its tolerance.

          The uploaded macOS artifact isolates the failure to the denoising
          unit-support comparison.  A standalone fast-NLM reproduction was
          also checked with GCC and Clang at -O2, -Ofast, and
          -Ofast -march=native; full project validation is left to CI.
          MSG
          git push origin HEAD:refs/heads/agent/denoise-unit-support-exact
