name: Agent lifecycle patch transport

on:
  push:
    branches:
      - agent/transport-document-lifecycle

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: agent/qtgui-document-lifecycle
          fetch-depth: 0
          path: review
      - name: Apply guarded patch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATCH_BLOB_SHA: ee1a4c4970acba350912db7f4ffb9dbfcf0778fd
        run: |
          set -euo pipefail
          cd review
          expected=44f7af8c1b4ec256f114848ac47e564200240334
          actual=$(git rev-parse HEAD)
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Review branch moved: expected $expected, got $actual"
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/janhubicka/Color-Screen/git/blobs/$PATCH_BLOB_SHA" \
            | python3 -c 'import base64,json,sys; sys.stdout.write(base64.b64decode(json.load(sys.stdin)["content"]).decode())' \
            | base64 -d | gzip -d > /tmp/document-lifecycle.patch
          git apply --check /tmp/document-lifecycle.patch
          git apply /tmp/document-lifecycle.patch
          sh build-aux/check-generated-build-metadata.sh
          git diff --check
          git status --short
          git config user.name "Jan Hubička"
          git config user.email "46065755+janhubicka@users.noreply.github.com"
          git add -A
          git commit -m "qtgui: make document close decisions transactional"
          git push origin HEAD:agent/qtgui-document-lifecycle
