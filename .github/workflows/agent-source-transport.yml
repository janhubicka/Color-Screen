name: Agent lifecycle workflow blob transport

on:
  push:
    branches:
      - agent/transport-document-lifecycle

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: agent/qtgui-document-lifecycle
          fetch-depth: 0
          path: review
      - name: Materialize workflow blobs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATCH_BLOB_SHA: 7fc39007539b5b7d9c408164500f813c37b94b4a
        run: |
          set -euo pipefail
          cd review
          expected=583fb8254663cdbefa402c9a931f3b25db349b7a
          actual=$(git rev-parse HEAD)
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Review branch moved: expected $expected, got $actual"
            exit 1
          fi

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/janhubicka/Color-Screen/git/blobs/$PATCH_BLOB_SHA" \
            | python3 -c 'import base64,json,sys; sys.stdout.write(base64.b64decode(json.load(sys.stdin)["content"]).decode())' \
            | base64 -d | gzip -d > /tmp/workflows.patch

          git apply --check /tmp/workflows.patch
          git apply /tmp/workflows.patch
          git diff --check

          python3 <<'PY'
          import base64
          import json
          import os
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          url = "https://api.github.com/repos/janhubicka/Color-Screen/git/blobs"
          for label, path in [
              ("BUILD", ".github/workflows/build-ubuntu.yml"),
              ("SANITIZERS", ".github/workflows/sanitizers.yml"),
          ]:
              with open(path, "rb") as f:
                  content = base64.b64encode(f.read()).decode()
              body = json.dumps({"content": content, "encoding": "base64"}).encode()
              req = urllib.request.Request(
                  url,
                  data=body,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  sha = json.load(response)["sha"]
              print(f"{label}_BLOB_SHA={sha}")
          PY
