name: Agent source transport

on:
  push:
    branches:
      - agent/source-transport-20260821

permissions:
  contents: read

jobs:
  archive-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive current main revision
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin main
          git rev-parse origin/main | tee SOURCE_COMMIT
          git archive --format=tar.gz --prefix=Color-Screen/ -o Color-Screen-source.tar.gz origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: colorscreen-source-main-d32b9c0
          path: |
            Color-Screen-source.tar.gz
            SOURCE_COMMIT
          if-no-files-found: error
