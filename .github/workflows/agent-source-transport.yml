name: Agent source transport

on:
  push:
    branches:
      - agent/source-transport-multi-document-20260821
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create verified repository bundle
        shell: bash
        run: |
          set -euxo pipefail
          git rev-parse HEAD > HEAD.sha
          git rev-parse origin/main > MAIN.sha
          git bundle create "$RUNNER_TEMP/Color-Screen.bundle" --all
          git bundle verify "$RUNNER_TEMP/Color-Screen.bundle"
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: colorscreen-multidocument-source
          path: |
            ${{ runner.temp }}/Color-Screen.bundle
            HEAD.sha
            MAIN.sha
          if-no-files-found: error
          retention-days: 1
