name: Publish Color-Screen wiki

on:
  pull_request:
    paths:
      - 'doc/wiki/**'
      - '.github/workflows/publish-wiki.yml'
  push:
    branches: [main]
    paths:
      - 'doc/wiki/**'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

concurrency:
  group: publish-colorscreen-wiki-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test archival and idempotent wiki navigation
        run: python3 -m unittest discover -s doc/wiki/tests -v

  publish:
    if: github.event_name != 'pull_request'
    needs: test-navigation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish documentation without deleting historical articles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          wiki_url="https://github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git ls-remote "$wiki_url" HEAD >/dev/null 2>&1; then
            echo "::error::Wiki is not initialized or accessible; no changes made."
            exit 1
          fi
          source_dir="$GITHUB_WORKSPACE/doc/wiki"
          work_dir="$(mktemp -d)"
          git clone "$wiki_url" "$work_dir/wiki"
          cd "$work_dir/wiki"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Copy only the four published documentation pages.
          pages=(
            Color-Screen-1.0-Documentation.md
            Color-Screen-2.0-User-Manual.md
            Color-Screen-2.0-Parameter-Format.md
            Color-Screen-2.0-Parameter-Fields.md
            Color-Screen-2.0-Project-Format.md
          )
          for page in "${pages[@]}"; do
            test -f "$source_dir/$page"
            cp "$source_dir/$page" "$page"
          done

          # First run archives the previous Home page. Subsequent runs only
          # replace marked 2.0 navigation, preserving manual wiki edits outside
          # those blocks. The complete set of old article URLs is preserved.
          python3 "$source_dir/publish_navigation.py" \
            --source "$source_dir" --wiki "$PWD"

          # Stage only managed pages. No git add -A, rm, rename or force push.
          git add -- "${pages[@]}" Home.md _Sidebar.md \
            Color-Screen-1.0-Original-Home.md
          if git diff --cached --name-only --diff-filter=D | grep -q .; then
            echo "::error::Refusing to delete existing wiki pages."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Wiki documentation already up to date."
            exit 0
          fi
          git commit -m "docs: publish Color-Screen 2.0 manual and historical wiki navigation"
          git push origin HEAD
