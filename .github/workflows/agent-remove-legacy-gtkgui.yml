name: Agent legacy GTK removal

on:
  push:
    branches:
      - agent/remove-legacy-gtkgui-work

permissions:
  contents: write

jobs:
  prepare-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare clean GTK-free branch and test it
        run: |
          cp .github/agent-remove-legacy-gtkgui.sh /tmp/agent-remove-legacy-gtkgui.sh
          bash /tmp/agent-remove-legacy-gtkgui.sh
