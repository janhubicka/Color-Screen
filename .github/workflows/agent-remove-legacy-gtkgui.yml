name: Agent legacy GTK removal

on:
  push:
    branches:
      - agent/remove-legacy-gtkgui-work

permissions:
  contents: write

concurrency:
  group: agent-remove-legacy-gtkgui
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize workflow cleanup
        run: |
          set -euo pipefail
          SOURCE_BRANCH=agent/remove-legacy-gtkgui
          FINAL_BRANCH=agent/remove-legacy-gtkgui-final
          TEMP_TAG=agent-remove-legacy-gtkgui-finalize

          git config user.name "Color-Screen agent"
          git config user.email "46065755+janhubicka@users.noreply.github.com"
          git fetch origin "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
          git checkout --detach "refs/remotes/origin/$SOURCE_BRANCH"

          python3 - <<'PY'
          from pathlib import Path

          edits = {
              ".github/workflows/build-ubuntu.yml": (
                  "./configure --enable-checking --disable-static-link --enable-gtkgui --enable-qtgui",
                  "./configure --enable-checking --disable-static-link --enable-qtgui",
              ),
              ".github/workflows/sanitizers.yml": (
                  "./configure --enable-checking --disable-static-link \\\n          --disable-gtkgui --enable-qtgui",
                  "./configure --enable-checking --disable-static-link --enable-qtgui",
              ),
          }
          for path, (old, new) in edits.items():
              p = Path(path)
              text = p.read_text()
              if old in text:
                  text = text.replace(old, new)
                  p.write_text(text)
              if new not in p.read_text():
                  raise SystemExit(f"expected GTK-free configure command missing in {path}")
          PY

          if git grep -n -i -E 'gtkgui|colorscreen-gtk|gtkimageviewer|gtk\+?-?2\.0|libgtk2|enable-gtkgui|disable-gtkgui|GTKGUI_BIN'; then
            echo "Legacy GTK GUI references remain" >&2
            exit 1
          fi
          git diff --check -- . ':(exclude,glob)**/Makefile.in'
          sh build-aux/check-generated-build-metadata.sh

          if git diff --quiet; then
            FINAL_SHA=$(git rev-parse HEAD)
          else
            git add .github/workflows/build-ubuntu.yml .github/workflows/sanitizers.yml
            git commit -m "ci: remove legacy GTK workflow switches" -m "Drop the last gtkgui configure switches from the Ubuntu checking and ThreadSanitizer jobs. The GTK2 development package is already removed from the shared Ubuntu CI image by the parent cleanup commit."
            FINAL_SHA=$(git rev-parse HEAD)
          fi
          echo "final cleanup commit: $FINAL_SHA"

          git tag -f "$TEMP_TAG" "$FINAL_SHA"
          git push --force origin "refs/tags/$TEMP_TAG"

          # The connected GitHub client will create the final review branch from
          # the temporary tag. Remove the transport tag once that branch appears.
          for i in $(seq 1 120); do
            if git ls-remote --exit-code origin "refs/heads/$FINAL_BRANCH" >/dev/null 2>&1; then
              git push origin ":refs/tags/$TEMP_TAG" || true
              exit 0
            fi
            sleep 5
          done
          echo "Final branch was not created while the transport tag was available" >&2
          exit 1
