name: Agent legacy GTK removal

on:
  push:
    branches:
      - agent/remove-legacy-gtkgui-work

permissions:
  contents: write

concurrency:
  group: agent-remove-legacy-gtkgui
  cancel-in-progress: true

jobs:
  patch-distcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch generated config-header stamp
        run: |
          set -euo pipefail
          FINAL_BRANCH=agent/remove-legacy-gtkgui-final

          git config user.name "Color-Screen agent"
          git config user.email "46065755+janhubicka@users.noreply.github.com"
          git fetch origin "refs/heads/$FINAL_BRANCH:refs/remotes/origin/$FINAL_BRANCH"
          git checkout --detach "refs/remotes/origin/$FINAL_BRANCH"

          echo "Before:"
          grep -n 'stamp-h[0-9]' Makefile.in
          test "$(grep -c 'src/libcolorscreen/include/stamp-h3' Makefile.in)" -gt 0
          sed -i 's#src/libcolorscreen/include/stamp-h3#src/libcolorscreen/include/stamp-h2#g' Makefile.in
          ! grep -q 'src/libcolorscreen/include/stamp-h3' Makefile.in
          grep -q 'src/libcolorscreen/include/stamp-h2' Makefile.in
          echo "After:"
          grep -n 'stamp-h[0-9]' Makefile.in

          git diff --check
          git diff -- Makefile.in
          git add Makefile.in
          git commit -m "build: fix distclean config-header stamp" -m "Removing the GTK config header renumbered colorscreen-config.h from stamp-h3 to stamp-h2. Update the selectively regenerated Makefile.in so distclean removes the stamp that config.status now creates."
          git push origin "HEAD:refs/heads/$FINAL_BRANCH"
