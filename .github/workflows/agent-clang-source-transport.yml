name: Temporary macOS Clang patch publisher

on:
  pull_request:
    branches: [ "agent/tmp-clang-publisher-base-20260823" ]

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-13
    env:
      REVIEW_BRANCH: agent/fix-macos-clang-regressions-pr
      EXPECTED_BASE: bc6008cb6a3c69af7c0f88494dbd3f7772410f7d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Publish exact reviewed patch
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          python3 - <<'PY'
          import base64
          from pathlib import Path
          Path('/tmp/macos-clang-fix.patch').write_bytes(base64.b64decode(''))
          PY
          test "$(shasum -a 256 /tmp/macos-clang-fix.patch | awk '{print $1}')" = "d43e1bb1a03b2e8a52d0a88ce2b06ceb100cc68a8bc2f35bbc38a6d3d0857662"
          git apply --check /tmp/macos-clang-fix.patch
          git apply /tmp/macos-clang-fix.patch
          git diff --check HEAD
          test "$(git diff --name-only HEAD | sort | tr '\n' ' ')" = "src/libcolorscreen/unittests.C testsuite/dufaycolor_dt_captureone_export.test "
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          git config user.name "OpenAI Codex"
          git config user.email "noreply@openai.com"
          git switch -C "$REVIEW_BRANCH" "$EXPECTED_BASE"
          git apply /tmp/macos-clang-fix.patch
          git add src/libcolorscreen/unittests.C testsuite/dufaycolor_dt_captureone_export.test
          cat > /tmp/commit-message <<'EOF'
          tests: make macOS Clang regressions numerically robust

          Fix two brittle test assumptions exposed by the macOS build.

          Validate solid focus-area candidates in scan/output coordinates rather
          than mapping them back through division and comparing an exact analysis
          boundary. Apple Clang contracts that inverse transform under -Ofast on
          arm64, allowing the valid boundary 31.5 to become
          31.500000000000004. Use a tiny scan-coordinate tolerance and keep the
          inverse coordinates only for diagnostics.

          Make the Dufay stitch regression validate the physical final offset and
          a narrow overlap range. Mesh and --no-mesh runs resolve the same final
          displacement, about (6.71,-27.64), but their known-pixel boundaries
          report 58.62% and 58.91% overlap respectively. This preserves a useful
          physical regression without pinning lattice phase or exact pixel count.

          Local validation reproduced the Apple arm64 fast-math FMA boundary,
          checked the direct-coordinate replacement, verified the Dufay parser
          against the supplied macOS and earlier Windows reports including
          negative controls, and passed git diff --check and dash syntax checks.
          EOF
          git commit -F /tmp/commit-message
          git push --force origin "HEAD:$REVIEW_BRANCH"
