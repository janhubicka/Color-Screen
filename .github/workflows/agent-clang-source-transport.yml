name: Temporary macOS Clang regression publisher

on:
  pull_request:
    branches: [ "agent/tmp-clang-publisher-base-20260823" ]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      REVIEW_BRANCH: agent/fix-macos-clang-regressions
      EXPECTED_BASE: bc6008cb6a3c69af7c0f88494dbd3f7772410f7d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply macOS Clang regression fixes
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          cat > /tmp/macos-clang-fix.patch <<'PATCH'
          diff --git a/src/libcolorscreen/unittests.C b/src/libcolorscreen/unittests.C
          index 7e82bcc..fe10700 100644
          --- a/src/libcolorscreen/unittests.C
          +++ b/src/libcolorscreen/unittests.C
          @@ -694,22 +694,46 @@ test_finetune_focus_areas ()
                return false;
              }
          
          +  /* Validate candidate positions in the output coordinate system.  Do not
          +     invert the mapping by dividing by XSTEP/YSTEP just to classify the test
          +     regions.  Apple Clang with -Ofast contracts e.g.
          +     (294.5 - 200) / 3 into an FMA that rounds to 31.500000000000004, so an
          +     exact upper-bound comparison in analysis coordinates can reject the
          +     correctly mapped boundary point.  A tiny scan-coordinate tolerance also
          +     keeps this metadata check independent of harmless fast-math contraction.  */
          +  const coord_t position_epsilon = (coord_t)1e-9;
          +  const auto mapped = [&] (coord_t x, coord_t y) {
          +    return point_t { search.origin.x + x * search.xstep,
          +                     search.origin.y + y * search.ystep };
          +  };
          +  const point_t brown_min = mapped (15.5, 15.5);
          +  const point_t brown_max = mapped (31.5, 31.5);
          +  const point_t green_min = mapped (95.5, 15.5);
          +  const point_t green_max = mapped (111.5, 31.5);
          +
             bool found_brown = false;
             bool found_green = false;
             for (const finetune_focus_area_candidate &area : areas)
               {
          -      const coord_t cx = (area.center.x - search.origin.x) / search.xstep;
          -      const coord_t cy = (area.center.y - search.origin.y) / search.ystep;
          -      const bool brown = cx >= 15.5 && cx <= 31.5
          -                         && cy >= 15.5 && cy <= 31.5;
          -      const bool green = cx >= 95.5 && cx <= 111.5
          -                         && cy >= 15.5 && cy <= 31.5;
          +      const auto in_range = [&] (point_t min, point_t max) {
          +        return area.center.x >= min.x - position_epsilon
          +               && area.center.x <= max.x + position_epsilon
          +               && area.center.y >= min.y - position_epsilon
          +               && area.center.y <= max.y + position_epsilon;
          +      };
          +      const bool brown = in_range (brown_min, brown_max);
          +      const bool green = in_range (green_min, green_max);
                 if (!brown && !green)
                   {
          +          const coord_t cx
          +              = (area.center.x - search.origin.x) / search.xstep;
          +          const coord_t cy
          +              = (area.center.y - search.origin.y) / search.ystep;
                     fprintf (stderr,
                              "Focus-area finder accepted texture/strong gradient at "
          -                   "%.3f, %.3f\n",
          -                   (double)cx, (double)cy);
          +                   "%.17g, %.17g (scan %.17g, %.17g)\n",
          +                   (double)cx, (double)cy, (double)area.center.x,
          +                   (double)area.center.y);
                     return false;
                   }
                 if (area.area.width != search.window_width * search.xstep
          diff --git a/testsuite/dufaycolor_dt_captureone_export.test b/testsuite/dufaycolor_dt_captureone_export.test
          index 6a6318c..fb08913 100755
          --- a/testsuite/dufaycolor_dt_captureone_export.test
          +++ b/testsuite/dufaycolor_dt_captureone_export.test
          @@ -11,15 +11,46 @@ fi
           echo 1..6
           . $srcdir/defs.sh
           NAME=dufaycolor_dt_captureone_export
          +
          +# Verify the physical match rather than the arbitrary detected screen-grid
          +# phase or an exact known-pixel count.  The same match is represented as raw
          +# offset -28,5 after nearest-pixel detector rounding.  Mesh and no-mesh runs
          +# both map it to about final (6.71,-27.64), while their known-pixel boundaries
          +# make the reported overlap differ slightly (58.62% versus 58.91%).
          +check_stitch_match ()
          +{
          +    awk '
          +      /Best match on offset/ {
          +        have_final = 0;
          +        have_overlap = 0;
          +        for (i = 1; i <= NF; i++) {
          +          if ($i == "(final" && i + 2 <= NF) {
          +            x = $(i + 1);
          +            y = $(i + 2);
          +            sub(/,$/, "", x);
          +            have_final = 1;
          +          }
          +          if ($i == "overlap" && i + 1 <= NF) {
          +            overlap = $(i + 1);
          +            sub(/%$/, "", overlap);
          +            have_overlap = 1;
          +          }
          +        }
          +        if (have_final && have_overlap &&
          +            x >= 6.5 && x <= 7.0 &&
          +            y >= -28.0 && y <= -27.2 &&
          +            overlap >= 58.0 && overlap <= 60.0)
          +          good = 1;
          +      }
          +      END { exit good ? 0 : 1; }
          +    ' "$1"
          +}
          +
           pexec $RUNCOLORSCREEN stitch --ncols 2 "$srcdir/${NAME}_tile1.jpg" "$srcdir/${NAME}_tile2.jpg"  --out "out-${NAME}.csprj"  --report "out-${NAME}.txt" --no-cpfind  --min-screen-percentage=80 --max-unknown-screen-range=10 || exit 1
          -# The integer offset is expressed in the independently detected screen-grid
          -# origins.  Detector improvements may choose a lattice-equivalent origin while
          -# preserving the same physical tile overlap, so keep the overlap fraction as
          -# the stable stitching invariant rather than pinning an arbitrary grid phase.
          -grep "Best match on offset .* overlap 58.620690%" "out-${NAME}.txt" || exit 1
          +check_stitch_match "out-${NAME}.txt" || exit 1
           echo 'ok 1 - stitch project construction'
           pexec $RUNCOLORSCREEN stitch --ncols 2 "$srcdir/${NAME}_tile1.jpg" "$srcdir/${NAME}_tile2.jpg"  --out "out-${NAME}-nomesh.csprj"  --report "out-${NAME}.txt" --no-cpfind  --no-mesh --min-screen-percentage=80 --max-unknown-screen-range=10 || exit 1
          -grep "Best match on offset .* overlap 58.620690%" "out-${NAME}.txt" || exit 1
          +check_stitch_match "out-${NAME}.txt" || exit 1
           echo 'ok 2 - stitch project construction no mesh'
           PARNAME=out-${NAME}
           pexec $RUNCOLORSCREEN autodetect out-${NAME}.csprj ${PARNAME}.par --gamma 2.2  $* || exit 1
          PATCH
          git apply --check /tmp/macos-clang-fix.patch
          git apply /tmp/macos-clang-fix.patch
          git diff --check HEAD
          test "$(git diff --name-only HEAD | sort | tr '\n' ' ')" = "src/libcolorscreen/unittests.C testsuite/dufaycolor_dt_captureone_export.test "
          dash -n testsuite/dufaycolor_dt_captureone_export.test

      - name: Install Clang build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libomp-dev libtiff-dev libturbojpeg0-dev \
            libzip-dev libgsl-dev libraw-dev liblcms2-dev libfftw3-dev \
            libexiv2-dev libopenjp2-7-dev libpng-dev

      - name: Configure Clang Ofast checking build
        run: |
          mkdir build-clang
          cd build-clang
          CC=clang CXX=clang++ \
          CFLAGS="-Ofast -march=native -g -Wall" \
          CXXFLAGS="-Ofast -march=native -g -Wall" \
          ../configure --enable-checking --disable-shared --enable-static --disable-static-link

      - name: Build and run focused Clang regressions
        run: |
          make -C build-clang -j"$(nproc)"
          top_srcdir="$GITHUB_WORKSPACE" ./build-clang/src/libcolorscreen/unittests finetune_focus_areas
          make -C build-clang/testsuite TESTS=dufaycolor_dt_captureone_export.test check

      - name: Publish clean review branch
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          git config user.name "OpenAI Codex"
          git config user.email "noreply@openai.com"
          git switch -C "$REVIEW_BRANCH" "$EXPECTED_BASE"
          git apply /tmp/macos-clang-fix.patch
          git add src/libcolorscreen/unittests.C testsuite/dufaycolor_dt_captureone_export.test
          cat > /tmp/commit-message <<'EOF'
          tests: make macOS Clang regressions numerically robust

          Fix two brittle test assumptions exposed by the macOS build.

          Validate solid focus-area candidates in the scan/output coordinate
          system instead of mapping them back through division and comparing an
          exact analysis-space boundary. Apple Clang reassociates the inverse
          transform and contracts it to FMA under -Ofast on arm64; the valid
          boundary point 294.5 can therefore become 31.500000000000004 and fail
          an exact <= 31.5 comparison. Keep a tiny scan-coordinate epsilon and
          retain the inverse coordinates only for high-precision diagnostics.

          Make the Dufay stitch regression validate the physical final offset and
          a narrow overlap range. The ordinary mesh and --no-mesh paths both
          resolve the same final displacement, about (6.71,-27.64), but their
          known-pixel boundaries report 58.62% and 58.91% overlap respectively.
          Continue rejecting a genuinely different displacement or overlap while
          avoiding exact pixel-count and arbitrary lattice-phase checks.

          Validation: local Clang 17 O2/Ofast focus-finder reproduction; local
          Apple arm64 -Ofast codegen confirms the old inverse bound becomes FMA;
          the fused boundary evaluates to 31.500000000000004; the new direct
          scan-space comparison does not use the inverse FMA; the stitch parser
          accepts the uploaded mesh/no-mesh reports and the earlier Windows
          report while rejecting altered final-offset/overlap negative controls;
          dash syntax and git diff --check pass. The publisher additionally runs
          an Ubuntu Clang -Ofast checking build, focused focus-area unit group,
          and Dufay CLI integration test.
          EOF
          git commit -F /tmp/commit-message
          git push --force origin "HEAD:$REVIEW_BRANCH"
