name: Temporary macOS Clang regression publisher

on:
  pull_request:
    branches: [ "agent/tmp-clang-publisher-base-20260823" ]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    env:
      REVIEW_BRANCH: agent/fix-macos-clang-regressions
      EXPECTED_BASE: bc6008cb6a3c69af7c0f88494dbd3f7772410f7d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and apply macOS Clang regression fixes
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          printf '%s' '' | base64 -d > /tmp/macos-clang-fix.patch
          test "$(sha256sum /tmp/macos-clang-fix.patch | awk '{print $1}')" = "d43e1bb1a03b2e8a52d0a88ce2b06ceb100cc68a8bc2f35bbc38a6d3d0857662"
          git apply --check /tmp/macos-clang-fix.patch
          git apply /tmp/macos-clang-fix.patch
          git diff --check HEAD
          test "$(git diff --name-only HEAD | sort | tr '\n' ' ')" = "src/libcolorscreen/unittests.C testsuite/dufaycolor_dt_captureone_export.test "
          dash -n testsuite/dufaycolor_dt_captureone_export.test

      - name: Install Clang build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libomp-dev libtiff-dev libturbojpeg0-dev \
            libzip-dev libgsl-dev libraw-dev liblcms2-dev libfftw3-dev \
            libexiv2-dev libopenjp2-7-dev libpng-dev

      - name: Configure Clang Ofast checking build
        run: |
          mkdir build-clang
          cd build-clang
          CC=clang CXX=clang++ \
          CFLAGS="-Ofast -march=native -g -Wall" \
          CXXFLAGS="-Ofast -march=native -g -Wall" \
          ../configure --enable-checking --disable-shared --enable-static --disable-static-link

      - name: Build and run focused Clang regressions
        run: |
          make -C build-clang -j"$(nproc)"
          top_srcdir="$GITHUB_WORKSPACE" ./build-clang/src/libcolorscreen/unittests finetune_focus_areas
          make -C build-clang/testsuite TESTS=dufaycolor_dt_captureone_export.test check

      - name: Publish clean review branch
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          git config user.name "OpenAI Codex"
          git config user.email "noreply@openai.com"
          git switch -C "$REVIEW_BRANCH" "$EXPECTED_BASE"
          git apply /tmp/macos-clang-fix.patch
          git add src/libcolorscreen/unittests.C testsuite/dufaycolor_dt_captureone_export.test
          cat > /tmp/commit-message <<'EOF'
          tests: make macOS Clang regressions numerically robust

          Fix two brittle test assumptions exposed by the macOS build.

          Validate solid focus-area candidates in the scan/output coordinate
          system instead of mapping them back through division and comparing an
          exact analysis-space boundary. Apple Clang reassociates the inverse
          transform and contracts it to FMA under -Ofast on arm64; the valid
          boundary point 294.5 can therefore become 31.500000000000004 and fail
          an exact <= 31.5 comparison. Keep a tiny scan-coordinate epsilon and
          retain the inverse coordinates only for high-precision diagnostics.

          Make the Dufay stitch regression validate the physical final offset and
          a narrow overlap range. The ordinary mesh and --no-mesh paths both
          resolve the same final displacement, about (6.71,-27.64), but their
          known-pixel boundaries report 58.62% and 58.91% overlap respectively.
          Continue rejecting a genuinely different displacement or overlap while
          avoiding exact pixel-count and arbitrary lattice-phase checks.

          Validation: local Clang 17 O2/Ofast focus-finder reproduction; local
          Apple arm64 -Ofast codegen confirms the old inverse bound becomes FMA;
          the fused boundary evaluates to 31.500000000000004; the new direct
          scan-space comparison does not use the inverse FMA; the stitch parser
          accepts the uploaded mesh/no-mesh reports and the earlier Windows
          report while rejecting altered final-offset/overlap negative controls;
          dash syntax and git diff --check pass. The publisher additionally runs
          an ARM64 Ubuntu Clang -Ofast checking build, focused focus-area unit
          group, and Dufay CLI integration test.
          EOF
          git commit -F /tmp/commit-message
          git push --force origin "HEAD:$REVIEW_BRANCH"
