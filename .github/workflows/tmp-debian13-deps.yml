name: TEMP Debian 13 agent dependencies

on:
  push:
    branches:
      - agent/tmp-debian13-deps-20260905

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-slim
    steps:
      - name: Download trixie dependency packages
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          mkdir -p "$GITHUB_WORKSPACE/debs"
          cd "$GITHUB_WORKSPACE/debs"
          apt-get download \
            libfftw3-dev libfftw3-bin libfftw3-long3 libfftw3-quad3 \
            libgsl-dev libgsl28 libgslcblas0 \
            libturbojpeg0-dev libturbojpeg0 \
            liblcms2-dev liblcms2-2 \
            libraw-dev libraw23t64 \
            libzip-dev libzip5 zipcmp zipmerge ziptool \
            libexiv2-dev libexiv2-28 libexiv2-data \
            libinireader0
          dpkg-deb -f ./*.deb Package Version Architecture | sort
      - uses: actions/upload-artifact@v4
        with:
          name: colorscreen-debian13-agent-deps-amd64
          path: debs/*.deb
          if-no-files-found: error
          retention-days: 7
