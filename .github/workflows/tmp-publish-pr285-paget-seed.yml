name: TEMP publish PR285 Paget seed fix

on:
  push:
    branches:
      - agent/tmp-publish-pr285-paget-seed-20260906
    paths:
      - .github/workflows/tmp-publish-pr285-paget-seed.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve reviewed patch
        run: cp .tmp/pr285-paget-seed.patch /tmp/pr285-paget-seed.patch
      - name: Apply to clean PR branch
        run: |
          set -euo pipefail
          git checkout -B agent/scr-detect-default-purity-1.2 9975c4a643235f9ddf9e0df541a8cd8be72157d4
          git apply --check /tmp/pr285-paget-seed.patch
          git apply /tmp/pr285-paget-seed.patch
          git diff --check
          test "$(git status --short | wc -l)" -eq 1
          test "$(git status --short | awk '{print $2}')" = "src/libcolorscreen/scr-detect-geometry.C"
          grep -q 'min_ratio (1)' src/libcolorscreen/include/scr-detect-parameters.h
      - name: Commit and publish
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/libcolorscreen/scr-detect-geometry.C
          git commit -m "detect: use purer Paget seed classes" -m "Keep the public screen-class purity default at 1.0 so Dufay retains its existing classification semantics. For the already-separate Paget/Finlay seed map, classify adjusted pixels with an effective minimum ratio of 1.2. This breaks mixed-color bridges between touching mosaic elements without reintroducing detector sharpening or changing the fitted process primaries."
          git push --force origin HEAD:agent/scr-detect-default-purity-1.2
