name: Publish final-coordinate v2

on:
  push:
    branches:
      - agent/final-coordinate-v2-publisher-20260823

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-coordinate-image-view
          fetch-depth: 0

      - name: Apply final-coordinate orientation patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count))

          # libcolorscreen: persistent final-plane mirroring.
          replace(
              "src/libcolorscreen/include/scr-to-img-parameters.h",
              """  /* Rotation from screen coordinates to final coordinates.  */
  coord_t final_rotation = 0;
  /* Angle of the screen X and Y axis in the final coordinates.  */
  coord_t final_angle = 90;
""",
              """  /* Rotation from screen coordinates to final coordinates, in degrees.  */
  coord_t final_rotation = 0;
  /* Mirror the final coordinate plane horizontally before final rotation.  */
  bool final_mirror = false;
  /* Angle of the screen X and Y axis in the final coordinates.  */
  coord_t final_angle = 90;
""")
          replace(
              "src/libcolorscreen/include/scr-to-img-parameters.h",
              """           && projection_distance == other.projection_distance
           && final_rotation == other.final_rotation
           && final_angle == other.final_angle
""",
              """           && projection_distance == other.projection_distance
           && final_rotation == other.final_rotation
           && final_mirror == other.final_mirror
           && final_angle == other.final_angle
""")

          replace(
              "src/libcolorscreen/scr-to-img.C",
              """  rotate += m_rotation_adjustment;
  m_scr_to_final_matrix = rotation_2x2matrix (rotate) * fm;
  m_final_to_scr_matrix = m_scr_to_final_matrix.invert ();
""",
              """  rotate += m_rotation_adjustment;

  /* FINAL_MIRROR belongs to the final output geometry, not to scan
     presentation.  Reflect the final X axis before applying the continuous
     final rotation; get_final_range() then supplies the translation needed to
     keep the resulting canvas zero based.  */
  matrix2x2<coord_t> final_mirror_matrix (
      m_param.final_mirror ? (coord_t)-1 : (coord_t)1, 0, 0, 1);
  m_scr_to_final_matrix
      = rotation_2x2matrix (rotate) * final_mirror_matrix * fm;
  m_final_to_scr_matrix = m_scr_to_final_matrix.invert ();
""")

          replace(
              "src/libcolorscreen/loadsave.C",
              """          || fprintf (f, \"final_rotation: %f\\n\", param->final_rotation) < 0
          /* Needs large precision close to zero - so use %g.  */
""",
              """          || fprintf (f, \"final_rotation: %f\\n\", param->final_rotation) < 0
          || fprintf (f, \"final_mirror: %s\\n\",
                      bool_names[(int)param->final_mirror])
                 < 0
          /* Needs large precision close to zero - so use %g.  */
""")
          replace(
              "src/libcolorscreen/loadsave.C",
              """      else if (!strcmp (buf, \"final_rotation\"))
        {
          if (!read_scalar (f, param_check (final_rotation)))
            {
              *error = \"error parsing final_rotation\";
              return false;
            }
        }
      /* Old lens correction parameter; now ignored.  */
""",
              """      else if (!strcmp (buf, \"final_rotation\"))
        {
