          qtgui: make final orientation native geometry

          Treat libcolorscreen final coordinates as the complete output geometry
          rather than another base canvas for the Qt scan presentation transform.
          Final-coordinate views now ignore scan crop, quarter-turn scan rotation,
          and scan mirroring, so viewport mapping agrees with render-to-file and
          with the screen-to-final mapping itself.

          Add final_mirror to scr_to_img_parameters and persist it in parameter
          files next to final_rotation.  Fold the reflection into the
          screen-to-final matrix before the existing continuous degree rotation;
          old parameter files remain compatible because the new flag defaults to
          false.

          In Qt, expose Final rotation as a continuous degree control whenever an
          ordinary view is in Screen/final coordinates, and make the mirror action
          edit final_mirror in that mode.  Scan mode keeps the existing 90-degree
          rotate actions and scan_mirror behavior.  The Geometry panel exposes the
          same final orientation parameters as shared, undoable document geometry,
          so all final-coordinate views and file output stay synchronized.

          Extend the New View smoke path with non-trivial final rotation/mirroring
          and an explicit invariant check proving that changing scan crop,
          scan_mirror, and scan_rotation cannot move a final-coordinate canvas.
          Keep slanted-edge reference views scan-only.

          Publisher validation: all scripted source replacements were asserted,
