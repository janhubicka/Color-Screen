name: TEMP focus carrier build

on:
  push:
    branches:
      - agent/tmp-focus-carrier-build-base
  pull_request:
    branches:
      - main
      - agent/tmp-focus-carrier-build-base

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tmp-focus-carrier-build-base
          fetch-depth: 0

      - name: Reconstruct patch
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cat agent/focus-carrier.chunk-* >/tmp/focus-carrier.patch
          echo '6733d63f753b42299e27246397de0e547b954a391dbef7f38be6b9899ac35047  /tmp/focus-carrier.patch' | sha256sum -c -
          git checkout --detach cc3220cc930cceb3c99cf988ee09fa2f6380584d
          git apply --check /tmp/focus-carrier.patch
          git apply /tmp/focus-carrier.patch
          git diff --check

      - name: Configure
        run: CXXFLAGS='-O2 -g' CFLAGS='-O2 -g' ./configure

      - name: Focus analysis unit tests
        shell: bash
        run: |
          set -euxo pipefail
          make -C src/libcolorscreen -j$(nproc) focus-analysis-unittests
          ./src/libcolorscreen/focus-analysis-unittests

      - name: Build CLI
        shell: bash
        run: |
          set -euxo pipefail
          make -C src/colorscreen -j$(nproc) colorscreen
          ./src/colorscreen/colorscreen --help >/tmp/help.txt 2>&1 || true
          grep -q 'analyze-focus-areas' /tmp/help.txt

      - name: Package portable CLI
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p focus-cli/lib
          test -x src/colorscreen/.libs/colorscreen
          cp src/colorscreen/.libs/colorscreen focus-cli/colorscreen.bin
          cp -L src/libcolorscreen/.libs/libcolorscreen.so.2 focus-cli/lib/
          ldd src/colorscreen/.libs/colorscreen \
            | awk '/=> \// {print $3} /^[[:space:]]*\/.*\(0x/ {print $1}' \
            | sort -u >/tmp/libs.txt
          while read -r lib; do
            test -f "$lib" && cp -L "$lib" focus-cli/lib/
          done </tmp/libs.txt
          cat >focus-cli/colorscreen <<'WRAPPER'
          #!/bin/sh
          DIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          LD_LIBRARY_PATH="$DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" exec "$DIR/colorscreen.bin" "$@"
          WRAPPER
          chmod +x focus-cli/colorscreen
          tar czf focus-cli.tar.gz focus-cli

      - uses: actions/upload-artifact@v4
        with:
          name: focus-carrier-cli
          path: focus-cli.tar.gz
