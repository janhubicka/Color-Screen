name: Publish verified DN-017 noise-domain patch

on:
  push:
    branches:
      - review/dn-017-noise-domains-stage

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/dn-017-noise-domains-stage
          fetch-depth: 0
      - name: Apply exact locally-tested DN-017 patch
        shell: bash
        run: |
          set -euxo pipefail
          cat .dn017-code.part.* > /tmp/DN017-code.patch
          echo 'b40ca368b9c4b12ea452413a3e6b432ca99836f8463ef65ad34960f5f0d1f3c3  /tmp/DN017-code.patch' | sha256sum -c -
          git apply --check /tmp/DN017-code.patch
          git apply /tmp/DN017-code.patch
          git diff --check
          test "$(git hash-object src/libcolorscreen/denoise.h)" = 40a63e1cf1945e1ccb6a5d29267990a6e60abbb4
          test "$(git hash-object src/libcolorscreen/analyze-base.C)" = 34a9957300399a15e6af34da6e8f3ae4452fb236
          test "$(git hash-object src/libcolorscreen/analyze-base.h)" = 360a0dbf5babb524ed47f94e5b31ed0ad141ed68
          test "$(git hash-object src/libcolorscreen/render-interpolate.C)" = 0dc4b4004ba75d33dceca15f44241345e4bf8491
          test "$(git hash-object src/libcolorscreen/render-interpolate.h)" = b81aacb80f2a0d97533c63a076bbf1221dc9a671
          test "$(git hash-object src/libcolorscreen/unittests.C)" = 8717737809a4ef03221832e6e63b31553e953d23
          rm .dn017-code.part.* .github/workflows/dn017-noise-domains-stage.yml
          git add -A
          git config user.name 'OpenAI review'
          git config user.email 'review@openai.invalid'
          git commit -m 'denoise: compare noise models across sample domains' -m 'Add read-only comparisons of the existing three-scale screen-noise diagnostic in linear intensity, density/log and a generalized square-root variance-stabilized domain. Preserve historical linear semantics and record an unconstrained diagnostic regression for fair transformed-domain comparison. Add scalar and precise-RGB synthetic regressions. Rendering parameters and filtering domains are unchanged.'
          git push origin HEAD:review/dn-017-noise-domains-stage
