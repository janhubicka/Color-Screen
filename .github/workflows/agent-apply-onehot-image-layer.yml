name: Agent make one-hot render cache-independent

on:
  push:
    branches:
      - agent/tmp-onehot-image-layer-stage

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/onehot-image-layer-sharpening
          fetch-depth: 0
      - name: Use native channel transfer in scalar shortcut
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/libcolorscreen/render.C')
          s = p.read_text()
          old = '''                  m_params.get_image_layer_sharpen_parameters (&m_img) };'''
          new = '''                  m_params.get_sharpen_parameters_for_channel (channel) };'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one scalar-channel specialization, found {s.count(old)}')
          s = s.replace(old, new, 1)
          old_comment = '''          /* No full RGB result was requested or cached.  Sharpen only the
             native channel which actually contributes to the image layer.
             Keep mix-dark and gain after sharpening so this is equivalent to
             the full RGB sharpen-then-mix path even for Wiener/RL filters.  */'''
          new_comment = '''          /* No full RGB result was requested or cached.  Sharpen only the
             native channel which actually contributes to the image layer,
             using the same native-channel transfer as the full RGB path so
             cache state cannot change the result.  Keep mix-dark and gain
             after sharpening so this remains equivalent for Wiener/RL.  */'''
          if s.count(old_comment) != 1:
              raise SystemExit('selected-channel comment anchor missing')
          s = s.replace(old_comment, new_comment, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- src/libcolorscreen/render.C
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/libcolorscreen/render.C
          git commit -m "render: keep one-hot cache reuse deterministic" -m "Use the selected native channel's sharpening parameters in the scalar-only one-hot path, exactly as the full RGB path does. This ensures that populating or evicting the RGB cache cannot change image-layer pixels when a separate scalar image-layer measurement is selected."
          git push origin HEAD:agent/onehot-image-layer-sharpening
