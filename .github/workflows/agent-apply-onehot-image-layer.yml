name: Agent fix one-hot render specialization

on:
  push:
    branches:
      - agent/tmp-onehot-image-layer-stage

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/onehot-image-layer-sharpening
          fetch-depth: 0
      - name: Apply render corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/libcolorscreen/render.C')
          s = p.read_text()
          old = '                  m_params.get_image_layer_sharpen_parameters (&m_img) };'
          new = '                  m_params.get_sharpen_parameters_for_channel (channel) };'
          if s.count(old) != 1:
              raise SystemExit(f'expected one scalar-channel specialization, found {s.count(old)}')
          s = s.replace(old, new, 1)
          old = '                    = (channel_holder->m_data[i] - dark) * weight;'
          new = '                    = ((luminosity_t)channel_holder->m_data[i] - dark) * weight;'
          if s.count(old) != 1:
              raise SystemExit(f'expected one cached-channel transform, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- src/libcolorscreen/render.C
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/libcolorscreen/render.C
          git commit -m "render: keep one-hot channel reuse deterministic" -m "Use the selected native channel's sharpening parameters in the scalar-only one-hot path, matching the full RGB path regardless of cache state. Explicitly convert cached compact luminosity samples before applying image-layer dark and gain to avoid the intentionally ambiguous float/double conversion operators."
          git push origin HEAD:agent/onehot-image-layer-sharpening
