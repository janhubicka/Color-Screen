name: Agent normalize one-hot image-layer test strings

on:
  push:
    branches:
      - agent/tmp-onehot-image-layer-stage

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/onehot-image-layer-sharpening
          fetch-depth: 0
      - name: Normalize escaped newlines and publish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/libcolorscreen/unittests.C')
          s = p.read_text()
          bs = chr(92)
          messages = [
              'LRU peek test FAIL: miss generated a value',
              'LRU peek test FAIL: completed lookup changed cache state',
          ]
          for message in messages:
              old = 'printf ("' + message + bs + bs + 'n");'
              new = 'printf ("' + message + bs + 'n");'
              if s.count(old) != 1:
                  raise SystemExit(f'expected one occurrence of {old!r}, found {s.count(old)}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- src/libcolorscreen/unittests.C
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/libcolorscreen/unittests.C
          git commit -m "test: normalize LRU peek diagnostics"
          git push origin HEAD:agent/onehot-image-layer-sharpening
