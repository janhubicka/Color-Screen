name: Agent preserve native one-hot MTF specialization

on:
  push:
    branches:
      - agent/tmp-onehot-image-layer-stage

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging helper
        uses: actions/checkout@v4
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/onehot-image-layer-sharpening
          path: work
          fetch-depth: 0
      - name: Apply reviewed specialization correction
        run: |
          cp .agents/fix_onehot_native_specialization.py work/.fix-onehot.py
          cd work
          python3 .fix-onehot.py
          rm .fix-onehot.py
          git diff --check
          git diff -- src/libcolorscreen/render-parameters.C doc/mtf-channel-domain-tracking.md
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/libcolorscreen/render-parameters.C doc/mtf-channel-domain-tracking.md
          git commit -m "mtf: preserve native one-hot specialization" -m "Return native channel sharpening directly when a scalar image layer reduces exactly to one native channel, preserving the same measured-curve and wavelength precedence as ordinary channel sharpening. Reserve scalar measurement wavelength handling for explicit image-layer measurements and representative wavelength selection for genuine multi-channel mixtures.\n\nClarify that the one-channel simplification is exact even for viewing-filter captures because a single scanner-channel transfer distributes over the process-primary sum."
          git push origin HEAD:agent/onehot-image-layer-sharpening
