name: TEMP build focus multistart

on:
  pull_request:
    branches:
      - agent/tmp-focus-mtf-multistart-build

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: agent/tmp-focus-mtf-multistart-build
          fetch-depth: 0

      - name: Reconstruct patch
        shell: bash
        run: |
          set -euxo pipefail
          cat agent/focus-multistart.part-* >/tmp/focus.patch
          sha256sum /tmp/focus.patch

      - name: Apply to current main and test
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin main
          test "$(git rev-parse origin/main)" = a86ac611846419ace3934ac8f46752b5e8abb4a8
          git checkout --detach a86ac611846419ace3934ac8f46752b5e8abb4a8
          git apply --recount --check /tmp/focus.patch
          git apply --recount /tmp/focus.patch
          git diff --check
          CXXFLAGS='-O2 -g' CFLAGS='-O2 -g' ./configure
          make -C src/libcolorscreen -j$(nproc) focus-analysis-unittests
          ./src/libcolorscreen/focus-analysis-unittests
          make -C src/colorscreen -j$(nproc) colorscreen
          ./src/colorscreen/colorscreen analyze-focus-areas --help >/tmp/help.txt 2>&1 || true
          grep -q -- '--coupled' /tmp/help.txt
          grep -q 'process-screen' src/libcolorscreen/focus-analysis.C

      - name: Publish clean review branch
        shell: bash
        run: |
          set -euxo pipefail
          git switch -c agent/focus-area-mtf-multistart
          git add src/libcolorscreen/focus-analysis.C \
                  src/libcolorscreen/include/focus-analysis.h \
                  src/libcolorscreen/focus-analysis-unittests.C \
                  src/colorscreen/colorscreen.C \
                  src/qtgui/MainWindow.cpp \
                  src/qtgui/SharpnessPanel.cpp
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          git diff --cached --check
          git config user.name 'OpenAI Codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'focus: stabilize coupled area MTF fitting' \
            -m 'Periodic focus areas primarily constrain the effective transfer at the process-screen carrier. Preserve the simultaneous selected-area pixel model, but avoid the poor zero sigma/defocus basin by comparing the caller calibration with a fixed-phase sigma-only prefit before releasing the normal coupled solve.' \
            -m 'Keep candidate verification local to phase/color, warm leave-one-out fits from the all-area solution, and report the process-screen carrier MTF and its leave-one-out stability explicitly in the library, CLI, and Qt UI.' \
            -m 'On the Hurley scan at 750 nm, cold and calibrated starts converge to about 63.7% and 65.8% carrier MTF respectively versus 64.6% from the slanted-edge reference, while reaching essentially identical pixel residuals.'
          git push origin HEAD:refs/heads/agent/focus-area-mtf-multistart
