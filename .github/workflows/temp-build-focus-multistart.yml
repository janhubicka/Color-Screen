name: TEMP build focus multistart

on:
  pull_request:
    branches:
      - agent/tmp-focus-mtf-multistart-build

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: agent/tmp-focus-mtf-multistart-build
          fetch-depth: 0

      - name: Reconstruct patch
        shell: bash
        run: |
          set -euxo pipefail
          cat agent/focus-multistart.part-* >/tmp/focus.patch
          echo '145c85cda037da6597a87dbeca031b850f22bc4d88c0eea972c30d9fc93871e1  /tmp/focus.patch' | sha256sum -c -

      - name: Apply to current main and test
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git checkout --detach a86ac611846419ace3934ac8f46752b5e8abb4a8
          git apply --check /tmp/focus.patch
          git apply /tmp/focus.patch
          git diff --check
          CXXFLAGS='-O2 -g' CFLAGS='-O2 -g' ./configure
          make -C src/libcolorscreen -j$(nproc) focus-analysis-unittests
          ./src/libcolorscreen/focus-analysis-unittests
          make -C src/colorscreen -j$(nproc) colorscreen
          ./src/colorscreen/colorscreen analyze-focus-areas --help >/tmp/help.txt 2>&1 || true
          grep -q -- '--coupled' /tmp/help.txt
          grep -q 'process-screen' src/libcolorscreen/focus-analysis.C

      - name: Package portable CLI
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/focus-cli/lib
          cp src/colorscreen/colorscreen /tmp/focus-cli/colorscreen.bin
          ldd src/colorscreen/colorscreen | tee /tmp/focus-cli/ldd.txt
          awk '/=> \/[^ ]+/ {print $3} /^\/[a-zA-Z0-9_]/ {print $1}' /tmp/focus-cli/ldd.txt | sort -u | while read -r lib; do
            test -f "$lib" && cp -L "$lib" /tmp/focus-cli/lib/ || true
          done
          cat >/tmp/focus-cli/colorscreen <<'EOF'
          #!/bin/sh
          HERE=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          export LD_LIBRARY_PATH="$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/colorscreen.bin" "$@"
          EOF
          chmod +x /tmp/focus-cli/colorscreen
          tar -C /tmp -czf /tmp/colorscreen-focus-multistart.tar.gz focus-cli

      - name: Upload CLI bundle
        uses: actions/upload-artifact@v4
        with:
          name: colorscreen-focus-multistart
          path: /tmp/colorscreen-focus-multistart.tar.gz
          if-no-files-found: error
          retention-days: 2
