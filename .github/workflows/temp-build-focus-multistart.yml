name: TEMP validate PR218 BW carrier MTF

on:
  pull_request:
    branches:
      - agent/tmp-focus-mtf-multistart-build

permissions:
  contents: write
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out PR218 branch
        uses: actions/checkout@v4
        with:
          ref: agent/focus-area-carrier-multistart
          fetch-depth: 0

      - name: Specialize BW carrier MTF to image layer
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = ffae4749049c0dfd171293daf0fd148582510d4f
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/libcolorscreen/focus-analysis.C')
          text = path.read_text()
          replacements = [
              (
                  '  mtf_parameters mtf = rparam.sharpen.scanner_mtf;\n',
                  '  mtf_parameters mtf\n'
                  '      = (flags & finetune_bw)\n'
                  '            ? rparam.get_image_layer_sharpen_parameters (&img).scanner_mtf\n'
                  '            : rparam.sharpen.scanner_mtf;\n',
              ),
              (
                  '      mtf_parameters focus_mtf = rparam.sharpen.scanner_mtf;\n',
                  '      mtf_parameters focus_mtf\n'
                  '          = (fparams.flags & finetune_bw)\n'
                  '                ? rparam.get_image_layer_sharpen_parameters (&img).scanner_mtf\n'
                  '                : rparam.sharpen.scanner_mtf;\n',
              ),
              (
                  '      mtf_parameters stage_mtf = scalar[0].rparam.sharpen.scanner_mtf;\n',
                  '      mtf_parameters stage_mtf\n'
                  '          = (fparams.flags & finetune_bw)\n'
                  '                ? scalar[0].rparam\n'
                  '                      .get_image_layer_sharpen_parameters (&img)\n'
                  '                      .scanner_mtf\n'
                  '                : scalar[0].rparam.sharpen.scanner_mtf;\n',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              assert count == 1, (old, count)
              text = text.replace(old, new)
          path.write_text(text)

          path = Path('src/libcolorscreen/focus-analysis-unittests.C')
          text = path.read_text()
          old = ('  rparam.sharpen.scanner_mtf = capture.scanner_mtf;\n'
                 '  rparam.sharpen.scanner_mtf.sigma = 0;\n')
          new = ('  rparam.sharpen.scanner_mtf = capture.scanner_mtf;\n'
                 '  /* Exercise the same image-layer channel specialization used by\n'
                 '     a standalone IR/BW capture: the global wavelength is unknown,\n'
                 '     while channel 3 supplies the authoritative 750 nm value.  */\n'
                 '  rparam.sharpen.scanner_mtf.wavelength = 0;\n'
                 '  rparam.sharpen.scanner_mtf.wavelengths[3] = 750;\n'
                 '  rparam.sharpen.scanner_mtf.sigma = 0;\n')
          count = text.count(old)
          assert count == 1, count
          path.write_text(text.replace(old, new))
          PY
          git diff --check

      - name: Build and test
        shell: bash
        run: |
          set -euxo pipefail
          CXXFLAGS='-O2 -g' CFLAGS='-O2 -g' ./configure
          make -C src/libcolorscreen -j$(nproc) focus-analysis-unittests
          ./src/libcolorscreen/focus-analysis-unittests
          make -C src/colorscreen -j$(nproc) colorscreen
          ./src/colorscreen/colorscreen analyze-focus-areas --help >/tmp/help.txt 2>&1 || true
          grep -q -- '--sigma-defocus' /tmp/help.txt

      - name: Package portable CLI
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/focus-cli/lib
          cp src/colorscreen/colorscreen /tmp/focus-cli/colorscreen.bin
          ldd src/colorscreen/colorscreen | tee /tmp/focus-cli/ldd.txt
          awk '/=> \/[^ ]+/ {print $3} /^\/[a-zA-Z0-9_]/ {print $1}' /tmp/focus-cli/ldd.txt | sort -u | while read -r lib; do
            test -f "$lib" && cp -L "$lib" /tmp/focus-cli/lib/ || true
          done
          tar -C /tmp -czf /tmp/colorscreen-pr218-bw-mtf.tar.gz focus-cli

      - name: Commit fix to PR218
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'OpenAI Codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/libcolorscreen/focus-analysis.C \
                  src/libcolorscreen/focus-analysis-unittests.C
          git diff --cached --check
          git commit -m 'focus: honor image-layer MTF in BW carrier fits' \
            -m 'Use the same image-layer-specialized scanner MTF as finetune when reporting BW process-screen transfer and when deriving cold physical-defocus seed ranges. This preserves per-channel capture wavelength metadata such as IR channel 3.' \
            -m 'Make the synthetic physical Paget regression use channel-3 750 nm with no global wavelength so this domain specialization is covered.'
          git push origin HEAD:refs/heads/agent/focus-area-carrier-multistart

      - name: Upload exact tested CLI
        uses: actions/upload-artifact@v4
        with:
          name: colorscreen-pr218-bw-mtf
          path: /tmp/colorscreen-pr218-bw-mtf.tar.gz
          if-no-files-found: error
          retention-days: 2
