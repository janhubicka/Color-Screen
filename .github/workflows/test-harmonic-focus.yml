name: Test harmonic focus patch

on:
  pull_request:
    branches:
      - agent/tmp-harmonic-focus-test-base

permissions:
  contents: read
  packages: read

env:
  PATH: /usr/lib/qt6/libexec:/usr/lib/x86_64-linux-gnu/qt6/libexec:/usr/lib/qt6/bin:/usr/lib/x86_64-linux-gnu/qt6/bin:/usr/lib64/qt6/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tmp-harmonic-focus-test-base
          fetch-depth: 0

      - name: Reconstruct patch
        shell: bash
        run: |
          set -euxo pipefail
          base64 -d agent/focus-harmonic.patch.gz.b64 | gzip -dc >/tmp/focus.patch
          echo '67972f488a48dc311fd398b97ed460ba822116771346b14dad9218900eddc506  /tmp/focus.patch' | sha256sum -c -

      - name: Apply and build
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git checkout --detach fc7495c2969ceb45e23891a05e6f64c469f31c3a
          git apply --check /tmp/focus.patch
          git apply /tmp/focus.patch
          git diff --check
          CXXFLAGS='-O2 -g' CFLAGS='-O2 -g' ./configure --enable-qtgui
          make -j$(nproc)
          ./src/libcolorscreen/focus-analysis-unittests
          ./src/colorscreen/colorscreen --help >/tmp/colorscreen-help.txt 2>&1 || true
          grep -q 'analyze-focus-areas' /tmp/colorscreen-help.txt

      - name: Bundle CLI
        shell: bash
        run: |
          set -euxo pipefail
          exe=src/colorscreen/colorscreen
          mkdir -p /tmp/harmonic-focus-cli/lib
          cp "$exe" /tmp/harmonic-focus-cli/colorscreen.bin
          ldd "$exe" | awk '/=> \/|^\// {for(i=1;i<=NF;i++) if ($i ~ /^\//) print $i}' | sort -u >/tmp/libs.txt
          while read -r lib; do
            base=$(basename "$lib")
            case "$base" in
              libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|ld-linux*.so.*) continue ;;
            esac
            cp -L "$lib" "/tmp/harmonic-focus-cli/lib/$base"
          done </tmp/libs.txt
          cat >/tmp/harmonic-focus-cli/colorscreen <<'EOF'
          #!/bin/sh
          here=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          LD_LIBRARY_PATH="$here/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" exec "$here/colorscreen.bin" "$@"
          EOF
          chmod +x /tmp/harmonic-focus-cli/colorscreen
          tar -C /tmp -czf /tmp/colorscreen-harmonic-focus-cli.tar.gz harmonic-focus-cli

      - uses: actions/upload-artifact@v4
        with:
          name: colorscreen-harmonic-focus-cli
          path: /tmp/colorscreen-harmonic-focus-cli.tar.gz
          retention-days: 1
