name: Agent registration stall lens policy debugger
on:
  push:
    branches: [agent/qtgui-registration-followup-stage]
    paths: [.github/workflows/agent-registration-stall-lens-policy-publish.yml]
permissions:
  contents: read
  packages: read
env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  PATH: /usr/lib/qt6/libexec:/usr/lib/x86_64-linux-gnu/qt6/libexec:/usr/lib/qt6/bin:/usr/lib/x86_64-linux-gnu/qt6/bin:/usr/lib64/qt6/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
jobs:
  debug-smoke:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qtgui-registration-stall-lens-policy
          fetch-depth: 0
      - name: Build and obtain workspace-smoke backtrace
        shell: bash
        run: |
          set -euo pipefail
          CXXFLAGS='-O2 -g -Wall -Wextra' CFLAGS='-O2 -g -Wall -Wextra' \
            ./configure --enable-checking --enable-qtgui --disable-static-link
          make -j"$(nproc)"
          gdb --batch --return-child-result \
            -ex 'set pagination off' \
            -ex 'set print thread-events off' \
            -ex 'set env QT_QPA_PLATFORM offscreen' \
            -ex run \
            -ex 'thread apply all bt full' \
            --args ./src/qtgui/colorscreen-qt \
              --smoke-test 60000 --smoke-test-expect-windows 2 \
              --smoke-test-workspace-churn \
              "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif" \
              "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif"
