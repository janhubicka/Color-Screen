name: Agent registration stall lens policy ABI publisher
on:
  push:
    branches: [agent/qtgui-registration-followup-stage]
    paths: [.github/workflows/agent-registration-stall-lens-policy-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qtgui-registration-stall-lens-policy
          fetch-depth: 0
      - name: Preserve legacy solver ABI
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HEAD=68026b6205e07ccc8e08df77e81a4235e40f88f3
          EXPECTED_BASE=fcf58687463a055dfb888e456fde6c71e2e9bb6d
          FEATURE=agent/qtgui-registration-stall-lens-policy
          git fetch origin main "$FEATURE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          python3 - <<'PY'
          from pathlib import Path
          header = Path('src/libcolorscreen/include/colorscreen.h')
          text = header.read_text()
          old = "DLL_PUBLIC coord_t solver (scr_to_img_parameters *param, const image_data &img_data,\n                           const solver_parameters &sparam,\n                           progress_info *progress = NULL,\n                           bool ignore_lens_coverage = false);\n"
          new = "DLL_PUBLIC coord_t solver (scr_to_img_parameters *param, const image_data &img_data,\n                           const solver_parameters &sparam,\n                           progress_info *progress = NULL);\nDLL_PUBLIC coord_t solver (scr_to_img_parameters *param, const image_data &img_data,\n                           const solver_parameters &sparam,\n                           progress_info *progress,\n                           bool ignore_lens_coverage);\n"
          if text.count(old) != 1:
              raise SystemExit('unexpected public solver declaration')
          header.write_text(text.replace(old, new))
          source = Path('src/libcolorscreen/solver.C')
          text = source.read_text()
          marker = "/* Determine geometry and lens warp.  PARAM is updated with results.\n   IMG_DATA is the source image.  SPARAM contains solver points.\n   PROGRESS is used for progress reporting.  */\n\ncoord_t\nsolver (scr_to_img_parameters *param,const  image_data &img_data,\n        const solver_parameters &sparam, progress_info *progress,\n        bool ignore_lens_coverage)\n"
          replacement = "/* Determine geometry and lens warp using the normal lens-coverage safety gate.\n   Keep this overload out of line so existing users retain the historical\n   four-argument exported symbol.  */\ncoord_t\nsolver (scr_to_img_parameters *param, const image_data &img_data,\n        const solver_parameters &sparam, progress_info *progress)\n{\n  return solver (param, img_data, sparam, progress, false);\n}\n\n/* Determine geometry and lens warp.  PARAM is updated with results.\n   IMG_DATA is the source image.  SPARAM contains solver points.\n   PROGRESS is used for progress reporting.  IGNORE_LENS_COVERAGE is reserved\n   for callers that deliberately apply a process-specific bootstrap policy.  */\ncoord_t\nsolver (scr_to_img_parameters *param,const  image_data &img_data,\n        const solver_parameters &sparam, progress_info *progress,\n        bool ignore_lens_coverage)\n"
          if text.count(marker) != 1:
              raise SystemExit('unexpected solver definition')
          source.write_text(text.replace(marker, replacement))
          PY
          printf '%s\n' src/libcolorscreen/include/colorscreen.h src/libcolorscreen/solver.C > /tmp/expected-files
          git diff --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --check
          sh build-aux/check-generated-build-metadata.sh
          git config user.name 'ChatGPT Agent'
          git config user.email 'noreply@openai.com'
          git add src/libcolorscreen/include/colorscreen.h src/libcolorscreen/solver.C
          git commit -m 'libcolorscreen: preserve legacy solver ABI' -m 'Keep the historical four-argument solver entry point as a real exported symbol and expose the registration bootstrap coverage override only through an explicit five-argument overload.'
          git push origin HEAD:"$FEATURE"
