name: DN-017 source transport

on:
  push:
    branches:
      - agent/dn-017-source-transport

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact current main
        shell: bash
        run: |
          set -euxo pipefail
          MAIN=f52c7133c8a41656b6c5e274719269a4edad313d
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$MAIN"
          git archive --format=tar.gz --output=/tmp/colorscreen-main-f52c713.tar.gz origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: colorscreen-main-f52c713-source
          path: /tmp/colorscreen-main-f52c713.tar.gz
      - name: Record transport run
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .transport
          mkdir .transport
          {
            echo "main=f52c7133c8a41656b6c5e274719269a4edad313d"
            echo "run_id=$GITHUB_RUN_ID"
            echo "artifact=colorscreen-main-f52c713-source"
            echo "archive_sha256=$(sha256sum /tmp/colorscreen-main-f52c713.tar.gz | cut -d' ' -f1)"
          } > .transport/run.txt
          git config user.name 'OpenAI source transport'
          git config user.email 'review@openai.invalid'
          git add -- .transport
          git commit -m 'agent: record source transport run [skip ci]'
          git push origin HEAD:agent/dn-017-source-transport
