name: TEMP geometry color-ranking experiment

on:
  push:
    branches:
      - agent/tmp-geometry-color-ranking-20260829

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scr-detect-primary-separation
          fetch-depth: 0

      - name: Configure optimized CLI build
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = d159ffbdf3f717b96f9edf9e6a8d6f77eec76509
          CFLAGS='-O2 -g' CXXFLAGS='-O2 -g' ./configure --disable-gtkgui --disable-qtgui --disable-static-link
          make -C src/libcolorscreen -j2 unittests
          make -C src/colorscreen -j2 colorscreen
          ./src/libcolorscreen/unittests discovery

      - name: Generate deterministic no-screen controls
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/geometry-ranking
          mkdir -p /tmp/geometry-ranking/controls
          python3 - <<'PY'
          from pathlib import Path
          import struct

          width = 1200
          height = 1200
          out = Path('/tmp/geometry-ranking/controls')

          def write_rgb_tiff(path, pixel):
              tags = 10
              ifd_size = 2 + tags * 12 + 4
              bits_offset = 8 + ifd_size
              pixel_offset = (bits_offset + 6 + 3) & ~3
              byte_count = width * height * 3

              entries = []
              def short(tag, value):
                  entries.append(struct.pack('<HHI', tag, 3, 1) +
                                 struct.pack('<H', value) + b'\0\0')
              def long(tag, value):
                  entries.append(struct.pack('<HHII', tag, 4, 1, value))

              long(256, width)
              long(257, height)
              entries.append(struct.pack('<HHII', 258, 3, 3, bits_offset))
              short(259, 1)
              short(262, 2)
              long(273, pixel_offset)
              short(277, 3)
              long(278, height)
              long(279, byte_count)
              short(284, 1)
              entries.sort(key=lambda e: struct.unpack_from('<H', e)[0])

              with path.open('wb') as f:
                  f.write(b'II')
                  f.write(struct.pack('<H', 42))
                  f.write(struct.pack('<I', 8))
                  f.write(struct.pack('<H', tags))
                  for entry in entries:
                      f.write(entry)
                  f.write(struct.pack('<I', 0))
                  f.write(struct.pack('<HHH', 8, 8, 8))
                  while f.tell() < pixel_offset:
                      f.write(b'\0')
                  row = bytearray(width * 3)
                  for y in range(height):
                      for x in range(width):
                          r, g, b = pixel(x, y)
                          i = x * 3
                          row[i:i+3] = bytes((r, g, b))
                      f.write(row)

          def base_value(x, y):
              h = (x * 2246822519 + y * 3266489917 + (x ^ (y << 7))) & 0xffffffff
              h ^= h >> 15
              h = (h * 2246822519) & 0xffffffff
              h ^= h >> 13
              return (h >> 8) & 255

          write_rgb_tiff(out / 'grayscale.tif',
                         lambda x, y: (base_value(x, y),) * 3)

          def low_chroma(x, y):
              v = base_value(x, y)
              return (max(0, min(255, v + ((x + y) % 3 - 1))),
                      v,
                      max(0, min(255, v + ((2 * x + y) % 3 - 1))))
          write_rgb_tiff(out / 'low-chroma.tif', low_chroma)

          def colorful(x, y):
              h = (x * 73856093) ^ (y * 19349663) ^ ((x // 37) * 83492791)
              h &= 0xffffffff
              h ^= h >> 16
              h = (h * 0x7feb352d) & 0xffffffff
              h ^= h >> 15
              h = (h * 0x846ca68b) & 0xffffffff
              h ^= h >> 16
              return (h & 255, (h >> 8) & 255, (h >> 16) & 255)
          write_rgb_tiff(out / 'colorful-noise.tif', colorful)
          PY
          ls -lh /tmp/geometry-ranking/controls/*.tif

      - name: Benchmark baseline
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/geometry-ranking/baseline
          for n in 1 2 3; do
            python3 testsuite/benchmark-screen-detection.py \
              --colorscreen ./src/colorscreen/colorscreen \
              --threads 4 --screen-type Dufay --scanner-type fixed-lens --gamma 1 \
              --mode legacy-2-3,2,3,both --mode unsharpened-0-0,0,0,both \
              --csv "/tmp/geometry-ranking/baseline/real-${n}.csv" \
              --output-dir "/tmp/geometry-ranking/baseline/real-${n}" \
              testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif
            python3 testsuite/benchmark-screen-detection.py \
              --colorscreen ./src/colorscreen/colorscreen \
              --threads 4 --screen-type Dufay --scanner-type fixed-lens --gamma 1 \
              --mode legacy-2-3,2,3,both --mode unsharpened-0-0,0,0,both \
              --csv "/tmp/geometry-ranking/baseline/negative-${n}.csv" \
              --output-dir "/tmp/geometry-ranking/baseline/negative-${n}" \
              /tmp/geometry-ranking/controls/grayscale.tif \
              /tmp/geometry-ranking/controls/low-chroma.tif \
              /tmp/geometry-ranking/controls/colorful-noise.tif
          done

      - name: Apply color-ranking experiment
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/libcolorscreen/scr-detect-colors.C')
          text = path.read_text()

          old = '''  sort (pixels.begin (), pixels.end (), compare_priorities);\n  int pos = pixels.size () / 2;\n  luminosity_t min_density = pixels[pos].orig_color.red + pixels[pos].orig_color.green + pixels[pos].orig_color.blue;\n  //printf ("\\n min density %f\\n", min_density);\n\n'''
          new = '''  /* Only the brighter half of this region can contribute process-color\n     samples below.  Find the same median-density cutoff in linear average\n     time, then discard pixels which all three later rankings would skip.\n     Keep SAMPLE_LIMIT based on the original region size so sample counts are\n     unchanged.  */\n  const size_t original_pixel_count = pixels.size ();\n  const size_t sample_limit = original_pixel_count / 1000;\n  auto density = [] (const entry &e)\n    {\n      return e.orig_color.red + e.orig_color.green + e.orig_color.blue;\n    };\n  auto median = pixels.begin () + original_pixel_count / 2;\n  std::nth_element (pixels.begin (), median, pixels.end (),\n                    [&] (const entry &a, const entry &b)\n                    {\n                      return density (a) < density (b);\n                    });\n  luminosity_t min_density = density (*median);\n  pixels.erase (std::remove_if (pixels.begin (), pixels.end (),\n                                [&] (const entry &e)\n                                {\n                                  return density (e) < min_density;\n                                }),\n                pixels.end ());\n  //printf ("\\n min density %f\\n", min_density);\n\n'''
          if text.count(old) != 1:
              raise SystemExit(f'median block match count: {text.count(old)}')
          text = text.replace(old, new, 1)

          for color in ('reds', 'greens', 'blues'):
              old_break = f'''      if ({color}.size () > pixels.size () / 1000)\n\tbreak;'''
              new_break = f'''      if ({color}.size () > sample_limit)\n\tbreak;'''
              if text.count(old_break) != 1:
                  raise SystemExit(f'{color} sample-limit block mismatch')
              text = text.replace(old_break, new_break, 1)

          path.write_text(text)
          PY
          git diff --check
          git diff -- src/libcolorscreen/scr-detect-colors.C

      - name: Rebuild and run discovery regression
        shell: bash
        run: |
          set -euxo pipefail
          make -C src/libcolorscreen -j2 unittests
          make -C src/colorscreen -j2 colorscreen
          ./src/libcolorscreen/unittests discovery

      - name: Benchmark patched optimizer
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/geometry-ranking/patched
          for n in 1 2 3; do
            python3 testsuite/benchmark-screen-detection.py \
              --colorscreen ./src/colorscreen/colorscreen \
              --threads 4 --screen-type Dufay --scanner-type fixed-lens --gamma 1 \
              --mode legacy-2-3,2,3,both --mode unsharpened-0-0,0,0,both \
              --csv "/tmp/geometry-ranking/patched/real-${n}.csv" \
              --output-dir "/tmp/geometry-ranking/patched/real-${n}" \
              testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif
            python3 testsuite/benchmark-screen-detection.py \
              --colorscreen ./src/colorscreen/colorscreen \
              --threads 4 --screen-type Dufay --scanner-type fixed-lens --gamma 1 \
              --mode legacy-2-3,2,3,both --mode unsharpened-0-0,0,0,both \
              --csv "/tmp/geometry-ranking/patched/negative-${n}.csv" \
              --output-dir "/tmp/geometry-ranking/patched/negative-${n}" \
              /tmp/geometry-ranking/controls/grayscale.tif \
              /tmp/geometry-ranking/controls/low-chroma.tif \
              /tmp/geometry-ranking/controls/colorful-noise.tif
          done

      - name: Compare outputs and summarize timings
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv
          import statistics

          root = Path('/tmp/geometry-ranking')

          def load(variant):
              grouped = {}
              for csv_path in sorted((root / variant).glob('*.csv')):
                  with csv_path.open(newline='') as f:
                      for row in csv.DictReader(f):
                          key = (Path(row['scan']).name, row['mode'])
                          grouped.setdefault(key, []).append(row)
              return grouped

          baseline = load('baseline')
          patched = load('patched')
          if baseline.keys() != patched.keys():
              raise SystemExit('baseline/patched benchmark key sets differ')

          stable_fields = (
              'exit_code', 'success', 'type', 'scan_coverage_percent',
              'screen_coverage_percent', 'regions', 'seed_pixels',
              'initial_grids', 'initial_solver_failures', 'flood_attempts',
              'flood_failures', 'patches', 'last_flood_failure',
              'color_opt_failures', 'precompute_failures', 'classmap_builds',
              'rgb_precomputes', 'legacy_preclassification_sharpening')

          for key in sorted(baseline):
              b = baseline[key]
              p = patched[key]
              if len(b) != len(p):
                  raise SystemExit(f'{key}: repeat counts differ')
              for i, (br, pr) in enumerate(zip(b, p), 1):
                  for field in stable_fields:
                      if br[field] != pr[field]:
                          raise SystemExit(
                              f'{key} repeat {i}: {field} changed: '
                              f'{br[field]} -> {pr[field]}')

              bt = [float(r['optimize_colors_ms']) for r in b]
              pt = [float(r['optimize_colors_ms']) for r in p]
              bw = [float(r['detector_total_ms']) for r in b]
              pw = [float(r['detector_total_ms']) for r in p]
              print(f'{key}: optimize_colors baseline={bt} patched={pt}')
              print(f'{key}: optimize_colors median {statistics.median(bt):.3f} -> '
                    f'{statistics.median(pt):.3f} ms')
              print(f'{key}: detector total baseline={bw} patched={pw}')
              print(f'{key}: detector total median {statistics.median(bw):.3f} -> '
                    f'{statistics.median(pw):.3f} ms')

          real = 'dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif'
          for mode in ('legacy-2-3', 'unsharpened-0-0'):
              bpar = root / 'baseline' / 'real-1' / f'dufaycolor_nikon_coolsan9000ED_4000DPI_raw-{mode}.par'
              ppar = root / 'patched' / 'real-1' / f'dufaycolor_nikon_coolsan9000ED_4000DPI_raw-{mode}.par'
              if not bpar.exists() or not ppar.exists():
                  raise SystemExit(f'{mode}: expected real-screen parameter file missing')
              if bpar.read_bytes() != ppar.read_bytes():
                  raise SystemExit(f'{mode}: generated real-screen parameter file changed')
          PY

      - name: Run focused real Dufay integration test
        shell: bash
        run: |
          set -euxo pipefail
          make -C testsuite check TESTS=dufaycolor_nikon_coolsan9000ED_4000DPI_raw.test
