name: Sanitizer builds

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  thread-sanitizer:
    name: ThreadSanitizer (Ubuntu amd64, Clang + OpenMP)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      PATH: /usr/lib/qt6/libexec:/usr/lib/x86_64-linux-gnu/qt6/libexec:/usr/lib/qt6/bin:/usr/lib/x86_64-linux-gnu/qt6/bin:/usr/lib64/qt6/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      CC: "ccache clang-18"
      CXX: "ccache clang++-18"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 500M
    steps:
    - name: Check out final PR207 branch
      uses: actions/checkout@v4
      with:
        ref: agent/fix-tsan-render-handoffs

    - name: Verify final review head
      run: |
        test "$(git rev-parse HEAD)" = "1ce4eee222e6f1a4aa7aa7f3dcbc02220eb87596"
        git diff --check 544655741cbc3f05185bb05e0a4988caad95467e..HEAD

    - name: Install Clang OpenMP TSan runtime
      run: |
        apt-get update
        apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev libomp-18-dev llvm-18
        test -f /usr/lib/llvm-18/lib/libarcher.so
        test -x /usr/bin/llvm-symbolizer-18
        rm -rf /var/lib/apt/lists/*

    - name: Restore compiler cache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-${{ runner.os }}-amd64-tsan-clang18-pr207-final
        restore-keys: |
          ccache-${{ runner.os }}-amd64-tsan-clang18-

    - name: Reset compiler cache stats
      run: ccache --zero-stats

    - name: Verify OpenMP-aware ThreadSanitizer runtime
      run: |
        cat >/tmp/tsan-openmp-smoke.cpp <<'EOF'
        #include <omp.h>
        #include <cstdio>
        int main ()
        {
          int threads = 0;
        #pragma omp parallel
          {
        #pragma omp single
            threads = omp_get_num_threads ();
          }
          std::printf ("OpenMP threads: %d\n", threads);
          return threads < 2;
        }
        EOF
        clang++-18 -O1 -g -fno-omit-frame-pointer -fopenmp -fsanitize=thread \
          /tmp/tsan-openmp-smoke.cpp -o /tmp/tsan-openmp-smoke
        LD_LIBRARY_PATH=/usr/lib/llvm-18/lib:${LD_LIBRARY_PATH:-} \
          OMP_NUM_THREADS=4 \
          OMP_TOOL=enabled \
          OMP_TOOL_LIBRARIES=/usr/lib/llvm-18/lib/libarcher.so \
          TSAN_OPTIONS=halt_on_error=1:ignore_noninstrumented_modules=1:external_symbolizer_path=/usr/bin/llvm-symbolizer-18 \
          /tmp/tsan-openmp-smoke

    - name: Configure with ThreadSanitizer
      run: |
        SANITIZER_FLAGS="-O1 -g -fno-omit-frame-pointer -fno-optimize-sibling-calls -fsanitize=thread"
        CC="ccache clang-18" CXX="ccache clang++-18" \
          CXXFLAGS="$SANITIZER_FLAGS" CFLAGS="$SANITIZER_FLAGS" \
          LDFLAGS="-fsanitize=thread" \
          ./configure --enable-checking --disable-static-link \
          --disable-gtkgui --enable-qtgui

    - name: Build ThreadSanitizer variant
      run: make -j$(nproc)

    - name: Qt GUI smoke test (ThreadSanitizer)
      env:
        OMP_NUM_THREADS: "4"
        OMP_TOOL: enabled
        OMP_TOOL_LIBRARIES: /usr/lib/llvm-18/lib/libarcher.so
        TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:ignore_noninstrumented_modules=1:external_symbolizer_path=/usr/bin/llvm-symbolizer-18
      run: |
        top_builddir="$PWD" srcdir="$PWD/testsuite" \
          sh testsuite/qt-tsan-smoke-probe.test

    - name: Test ThreadSanitizer variant
      env:
        OMP_NUM_THREADS: "4"
        OMP_TOOL: enabled
        OMP_TOOL_LIBRARIES: /usr/lib/llvm-18/lib/libarcher.so
        TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:ignore_noninstrumented_modules=1:external_symbolizer_path=/usr/bin/llvm-symbolizer-18
      run: make -j$(nproc) check

    - name: Compiler cache stats
      if: always()
      run: ccache --show-stats
