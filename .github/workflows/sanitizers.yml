name: Sanitizer builds

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize-review-branch:
    name: Materialize validated GUI TSan review branch
    if: github.event.action == 'reopened' && github.event.pull_request.number == 206
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
    - name: Check out final review branch
      uses: actions/checkout@v4
      with:
        ref: agent/fix-gui-tsan-races
        fetch-depth: 0

    - name: Download exact green-tested source artifact
      uses: actions/download-artifact@v4
      with:
        name: tsan-render-handoff-source
        path: /tmp/validated-source
        repository: janhubicka/Color-Screen
        run-id: 33011846158
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Materialize clean review commit
      shell: bash
      run: |
        set -euxo pipefail

        cp /tmp/validated-source/qtgui/Renderer.h src/qtgui/Renderer.h
        cp /tmp/validated-source/qtgui/Renderer.cpp src/qtgui/Renderer.cpp
        cp /tmp/validated-source/qtgui/ImageWidget.cpp src/qtgui/ImageWidget.cpp
        cp /tmp/validated-source/qtgui/NavigationView.cpp src/qtgui/NavigationView.cpp
        cp /tmp/validated-source/qtgui/ImageViewWindow.h src/qtgui/ImageViewWindow.h
        cp /tmp/validated-source/qtgui/ImageViewWindow.cpp src/qtgui/ImageViewWindow.cpp
        cp /tmp/validated-source/qtgui/TilePreviewPanel.h src/qtgui/TilePreviewPanel.h
        cp /tmp/validated-source/qtgui/TilePreviewPanel.cpp src/qtgui/TilePreviewPanel.cpp
        cp /tmp/validated-source/qtgui/SynchronizedRunnable.h src/qtgui/SynchronizedRunnable.h
        cp /tmp/validated-source/libcolorscreen/render-tile.C src/libcolorscreen/render-tile.C
        cp /tmp/validated-source/libcolorscreen/render-scr-detect.C src/libcolorscreen/render-scr-detect.C

        test "$(git hash-object src/qtgui/Renderer.h)" = 5f08f5aa52b087cc8b8bf508accd5cacdc705d22
        test "$(git hash-object src/qtgui/Renderer.cpp)" = 2b83972b3148d1c72f9ef00edb2ed2ac0c34ec99
        test "$(git hash-object src/qtgui/ImageWidget.cpp)" = b7f520f536efcdcca88cbcc3154efc7a3892feed
        test "$(git hash-object src/qtgui/NavigationView.cpp)" = f986a2df8d11ff11d9621aff5bfd8aa390f00531
        test "$(git hash-object src/qtgui/ImageViewWindow.h)" = bb21aa430f7dd987f3a61afef6a564d3e932e497
        test "$(git hash-object src/qtgui/ImageViewWindow.cpp)" = d7cc9dd6402062f42a6279dc310538f12c2c109c
        test "$(git hash-object src/qtgui/TilePreviewPanel.h)" = 7e04c28417dee32f8505fadea59badd383c69b18
        test "$(git hash-object src/qtgui/TilePreviewPanel.cpp)" = 46ce335a631d3b0330b93a589fec168abdcd4ca7
        test "$(git hash-object src/qtgui/SynchronizedRunnable.h)" = 2a76525bfcab985958d765eae2ac9ff5aeafe40e
        test "$(git hash-object src/libcolorscreen/render-tile.C)" = fa661f2d245efd750fb1bd02261151b1ee460e9c
        test "$(git hash-object src/libcolorscreen/render-scr-detect.C)" = 8a199d0c030ef5ca5faa6791669b43a41cbb3236

        git mv testsuite/qt-tsan-smoke-probe.test testsuite/qt-tsan-smoke.test
        python3 - <<'PY'
        from pathlib import Path

        p = Path('testsuite/qt-tsan-smoke.test')
        s = p.read_text()
        s = s.replace('## Temporary probe for Qt GUI smoke coverage under ThreadSanitizer.',
                      '## Qt GUI smoke coverage under ThreadSanitizer.')
        s = s.replace('qt-tsan-smoke-${platform}.probe.log',
                      'qt-tsan-smoke-${platform}.log')
        p.write_text(s)

        p = Path('.github/workflows/sanitizers.yml')
        s = p.read_text()
        s = s.replace('Qt GUI smoke probe (ThreadSanitizer)',
                      'Qt GUI smoke test (ThreadSanitizer)')
        s = s.replace('testsuite/qt-tsan-smoke-probe.test',
                      'testsuite/qt-tsan-smoke.test')
        p.write_text(s)

        p = Path('src/qtgui/Makefile.am')
        s = p.read_text()
        old = 'ParameterPanel.h ParameterState.h Renderer.h SharpnessPanel.h'
        new = 'ParameterPanel.h ParameterState.h Renderer.h SynchronizedRunnable.h SharpnessPanel.h'
        if old not in s:
            raise SystemExit('Could not locate Renderer.h in EXTRA_DIST')
        p.write_text(s.replace(old, new, 1))
        PY

        git diff --check
        git config user.name "Jan Hubička"
        git config user.email "46065755+janhubicka@users.noreply.github.com"
        git add -A
        git commit -m "qtgui: make threaded rendering TSan-visible" -m "Publish renderer requests and worker results through project-owned C++ mutexes so ThreadSanitizer can observe the happens-before edges hidden inside distro Qt. Replace QtConcurrent task publication in renderer, reference-image, and tile-preview paths with synchronized QRunnable handoffs while preserving QThreadPool and OpenMP parallelism. Also make CSSTATS bookkeeping thread-safe and promote the GUI TSan probe to permanent smoke coverage."
        git push origin HEAD:agent/fix-gui-tsan-races

  thread-sanitizer:
    name: ThreadSanitizer (Ubuntu amd64, Clang + OpenMP)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      PATH: /usr/lib/qt6/libexec:/usr/lib/x86_64-linux-gnu/qt6/libexec:/usr/lib/qt6/bin:/usr/lib/x86_64-linux-gnu/qt6/bin:/usr/lib64/qt6/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      CC: "ccache clang-18"
      CXX: "ccache clang++-18"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 500M
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.ref }}

    - name: Apply renderer race fixes
      run: |
        python3 .github/ci/apply-tsan-render-handoff.py
        python3 .github/ci/apply-tsan-render-stats.py
        python3 .github/ci/apply-tsan-qtpool.py
        python3 .github/ci/apply-tsan-tilepreview.py
        grep -q 'enqueueRender' src/qtgui/Renderer.h
        grep -q 'runSynchronized' src/qtgui/Renderer.cpp
        grep -q 'finishReferenceLoad' src/qtgui/ImageViewWindow.cpp
        grep -q 'finishTileRender' src/qtgui/TilePreviewPanel.cpp
        grep -q 'stats_enabled' src/libcolorscreen/render-tile.C
        grep -q 'dead timing work' src/libcolorscreen/render-scr-detect.C

    - name: Install Clang OpenMP TSan runtime
      run: |
        apt-get update
        apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev libomp-18-dev llvm-18
        test -f /usr/lib/llvm-18/lib/libarcher.so
        test -x /usr/bin/llvm-symbolizer-18
        rm -rf /var/lib/apt/lists/*

    - name: Restore compiler cache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-${{ runner.os }}-amd64-tsan-clang18-${{ github.event.pull_request.head.sha || github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-amd64-tsan-clang18-

    - name: Reset compiler cache stats
      run: ccache --zero-stats

    - name: Verify OpenMP-aware ThreadSanitizer runtime
      run: |
        cat >/tmp/tsan-openmp-smoke.cpp <<'EOF'
        #include <omp.h>
        #include <cstdio>
        int main ()
        {
          int threads = 0;
        #pragma omp parallel
          {
        #pragma omp single
            threads = omp_get_num_threads ();
          }
          std::printf ("OpenMP threads: %d\n", threads);
          return threads < 2;
        }
        EOF
        clang++-18 -O1 -g -fno-omit-frame-pointer -fopenmp -fsanitize=thread \
          /tmp/tsan-openmp-smoke.cpp -o /tmp/tsan-openmp-smoke
        LD_LIBRARY_PATH=/usr/lib/llvm-18/lib:${LD_LIBRARY_PATH:-} \
          OMP_NUM_THREADS=4 \
          OMP_TOOL=enabled \
          OMP_TOOL_LIBRARIES=/usr/lib/llvm-18/lib/libarcher.so \
          TSAN_OPTIONS=halt_on_error=1:ignore_noninstrumented_modules=1:external_symbolizer_path=/usr/bin/llvm-symbolizer-18 \
          /tmp/tsan-openmp-smoke

    - name: Configure with ThreadSanitizer
      run: |
        SANITIZER_FLAGS="-O1 -g -fno-omit-frame-pointer -fno-optimize-sibling-calls -fsanitize=thread"
        CC="ccache clang-18" CXX="ccache clang++-18" \
          CXXFLAGS="$SANITIZER_FLAGS" CFLAGS="$SANITIZER_FLAGS" \
          LDFLAGS="-fsanitize=thread" \
          ./configure --enable-checking --disable-static-link \
          --disable-gtkgui --enable-qtgui

    - name: Build ThreadSanitizer variant
      run: make -j$(nproc)

    - name: Qt GUI smoke test (ThreadSanitizer)
      shell: bash
      env:
        OMP_NUM_THREADS: "4"
        OMP_TOOL: enabled
        OMP_TOOL_LIBRARIES: /usr/lib/llvm-18/lib/libarcher.so
        TSAN_OPTIONS: halt_on_error=0:second_deadlock_stack=1:ignore_noninstrumented_modules=1:external_symbolizer_path=/usr/bin/llvm-symbolizer-18
      run: |
        set -o pipefail
        top_builddir="$PWD" srcdir="$PWD/testsuite" \
          sh testsuite/qt-tsan-smoke-probe.test 2>&1 | tee tsan-gui-smoke.log

    - name: Upload GUI ThreadSanitizer smoke log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tsan-gui-smoke-log
        path: tsan-gui-smoke.log

    - name: Test ThreadSanitizer variant
      env:
        OMP_NUM_THREADS: "4"
        OMP_TOOL: enabled
        OMP_TOOL_LIBRARIES: /usr/lib/llvm-18/lib/libarcher.so
        TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:ignore_noninstrumented_modules=1:external_symbolizer_path=/usr/bin/llvm-symbolizer-18
      run: make -j$(nproc) check

    - name: Compiler cache stats
      if: always()
      run: ccache --show-stats

    - name: Upload validated source
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tsan-render-handoff-source
        path: |
          src/qtgui/SynchronizedRunnable.h
          src/qtgui/Renderer.h
          src/qtgui/Renderer.cpp
          src/qtgui/ImageWidget.cpp
          src/qtgui/NavigationView.cpp
          src/qtgui/ImageViewWindow.h
          src/qtgui/ImageViewWindow.cpp
          src/qtgui/TilePreviewPanel.h
          src/qtgui/TilePreviewPanel.cpp
          src/libcolorscreen/render-tile.C
          src/libcolorscreen/render-scr-detect.C
