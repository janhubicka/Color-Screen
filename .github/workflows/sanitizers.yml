name: Sanitizer builds

on:
  push:
    branches: [ "main", "v1-branch", "Kimrova-bachelorRelease" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      tsan:
        description: Run ThreadSanitizer on Ubuntu amd64
        required: true
        default: true
        type: boolean
      macos:
        description: Run ASan + UBSan on macOS
        required: true
        default: true
        type: boolean
      windows_asan:
        description: Run AddressSanitizer on Windows clang64
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  thread-sanitizer:
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.tsan) &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       !contains(github.event.pull_request.body, '[ci:') ||
       contains(github.event.pull_request.body, '[ci:all]') ||
       contains(github.event.pull_request.body, '[ci:sanitizers]') ||
       contains(github.event.pull_request.body, '[ci:tsan]'))
    name: ThreadSanitizer (Ubuntu amd64, Clang + OpenMP)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      PATH: /usr/lib/qt6/libexec:/usr/lib/x86_64-linux-gnu/qt6/libexec:/usr/lib/qt6/bin:/usr/lib/x86_64-linux-gnu/qt6/bin:/usr/lib64/qt6/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      CC: "ccache clang-18"
      CXX: "ccache clang++-18"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 500M
    steps:
    - uses: actions/checkout@v4
    - name: Install Clang OpenMP TSan runtime
      run: |
        apt-get update
        apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev libomp-18-dev llvm-18
        test -f /usr/lib/llvm-18/lib/libarcher.so
        test -x /usr/bin/llvm-symbolizer-18
        rm -rf /var/lib/apt/lists/*
    - name: Restore compiler cache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-${{ runner.os }}-amd64-tsan-clang18-${{ github.event.pull_request.head.sha || github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-amd64-tsan-clang18-
    - name: Reset compiler cache stats
      run: ccache --zero-stats
    - name: Verify OpenMP-aware ThreadSanitizer runtime
      run: |
        cat >/tmp/tsan-openmp-smoke.cpp <<'EOF'
        #include <omp.h>
        #include <cstdio>

        int main ()
        {
          int threads = 0;
          double a = 0, b = 0;
        #pragma omp parallel
          {
        #pragma omp single
            threads = omp_get_num_threads ();
          }
        #pragma omp parallel for reduction(+ : a, b)
          for (int i = 0; i < 100000; i++)
            {
              a += i;
              b += 2 * i;
            }
          std::printf ("OpenMP threads: %d\n", threads);
          return threads < 2 || !(a > 0) || !(b > 0);
        }
        EOF
        clang++-18 -O1 -g -fno-omit-frame-pointer -fopenmp -fsanitize=thread \
          /tmp/tsan-openmp-smoke.cpp -o /tmp/tsan-openmp-smoke
        LD_LIBRARY_PATH=/usr/lib/llvm-18/lib:${LD_LIBRARY_PATH:-} \
          OMP_NUM_THREADS=4 \
          OMP_TOOL=enabled \
          OMP_TOOL_LIBRARIES=/usr/lib/llvm-18/lib/libarcher.so \
          TSAN_OPTIONS=halt_on_error=1:ignore_noninstrumented_modules=1:external_symbolizer_path=/usr/bin/llvm-symbolizer-18 \
          /tmp/tsan-openmp-smoke
    - name: Verify generated build metadata
      run: sh build-aux/check-generated-build-metadata.sh
    - name: Configure with ThreadSanitizer
      run: |
        SANITIZER_FLAGS="-O1 -g -fno-omit-frame-pointer -fno-optimize-sibling-calls -fsanitize=thread"
        CC="ccache clang-18" CXX="ccache clang++-18" \
          CXXFLAGS="$SANITIZER_FLAGS" CFLAGS="$SANITIZER_FLAGS" \
          LDFLAGS="-fsanitize=thread" \
          ./configure --enable-checking --disable-static-link --enable-qtgui
    - name: Build ThreadSanitizer variant
      shell: bash
      run: |
        set -o pipefail
        make -j$(nproc) 2>&1 | tee tsan-build.log
    - name: Upload ThreadSanitizer build diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-diagnostics-tsan-amd64
        path: |
          tsan-build.log
          config.log
          src/qtgui/Makefile
          src/qtgui/Makefile.am
          src/qtgui/Makefile.in
    - name: Qt GUI smoke probe (ThreadSanitizer)
      env:
        OMP_NUM_THREADS: "4"
        OMP_TOOL: enabled
        OMP_TOOL_LIBRARIES: /usr/lib/llvm-18/lib/libarcher.so
        TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:ignore_noninstrumented_modules=1:external_symbolizer_path=/usr/bin/llvm-symbolizer-18
      run: |
        top_builddir="$PWD" srcdir="$PWD/testsuite" \
          sh testsuite/qt-tsan-smoke-probe.test
    # Keep the full OpenMP-heavy test suite after the GUI probe so both GUI
    # concurrency and library/CLI coverage use the same TSan environment.
    - name: Test ThreadSanitizer variant
      env:
        OMP_NUM_THREADS: "4"
        OMP_TOOL: enabled
        OMP_TOOL_LIBRARIES: /usr/lib/llvm-18/lib/libarcher.so
        TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:ignore_noninstrumented_modules=1:external_symbolizer_path=/usr/bin/llvm-symbolizer-18
      run: make -j$(nproc) check
    - name: Upload ThreadSanitizer test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: testsuite-tsan-amd64
        path: |
          testsuite/*.txt
          testsuite/*.log
          testsuite/*.par
    - name: Compiler cache stats
      if: always()
      run: ccache --show-stats

  macos-sanitizers:
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.macos) &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       !contains(github.event.pull_request.body, '[ci:') ||
       contains(github.event.pull_request.body, '[ci:all]') ||
       contains(github.event.pull_request.body, '[ci:sanitizers]') ||
       contains(github.event.pull_request.body, '[ci:macos-sanitizers]'))
    name: ASan + UBSan (macOS)
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 500M
    steps:
    - uses: actions/checkout@v4
    - name: Locate Homebrew cache
      id: homebrew-cache
      run: |
        echo "path=$(brew --cache)" >> "$GITHUB_OUTPUT"
        echo "image-version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
    - name: Restore Homebrew download cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.homebrew-cache.outputs.path }}
        key: homebrew-sanitizers-${{ runner.os }}-${{ runner.arch }}-${{ steps.homebrew-cache.outputs.image-version }}-${{ hashFiles('.github/workflows/sanitizers.yml') }}
        restore-keys: |
          homebrew-${{ runner.os }}-${{ runner.arch }}-${{ steps.homebrew-cache.outputs.image-version }}-
          homebrew-${{ runner.os }}-${{ runner.arch }}-
    - name: Install dependencies
      run: |
        brew install \
          libtiff libjpeg-turbo libzip gsl libraw little-cms2 libomp fftw \
          qt6 exiv2 openjpeg libpng webp ccache
        brew link qt6 --force
    - name: Restore compiler cache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-${{ runner.os }}-${{ runner.arch }}-asan-ubsan-${{ github.event.pull_request.head.sha || github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ runner.arch }}-asan-ubsan-
          ccache-${{ runner.os }}-${{ runner.arch }}-macos-
    - name: Reset compiler cache stats
      run: ccache --zero-stats
    - name: Verify generated build metadata
      run: sh build-aux/check-generated-build-metadata.sh
    - name: Configure with ASan and UBSan
      run: |
        QT6_PREFIX=$(brew --prefix qt6)
        BREW_PREFIX=$(brew --prefix)
        export PATH="$QT6_PREFIX/bin:$PATH"
        MOC_CANDIDATE=$(find "$QT6_PREFIX" -name moc -type f -perm +111 | head -n 1)
        if [ -z "$MOC_CANDIDATE" ]; then
          MOC_CANDIDATE=$(find "$BREW_PREFIX" -name moc -type f -perm +111 2>/dev/null | grep qt | head -n 1)
        fi
        if [ -z "$MOC_CANDIDATE" ]; then
          QT6_BIN=$(pkg-config --variable=host_bins Qt6Core)
          if [ -n "$QT6_BIN" ] && [ -x "$QT6_BIN/moc" ]; then
            MOC_CANDIDATE="$QT6_BIN/moc"
          fi
        fi
        if [ -z "$MOC_CANDIDATE" ]; then
          echo "Could not locate Qt moc" >&2
          exit 1
        fi
        export PATH="$(dirname "$MOC_CANDIDATE"):$PATH"
        SANITIZER_FLAGS="-O1 -g -fno-omit-frame-pointer -fno-optimize-sibling-calls -fsanitize=address,undefined -I$BREW_PREFIX/include -I$BREW_PREFIX/opt/libomp/include -Xclang=-fopenmp"
        CC="ccache clang" CXX="ccache clang++" \
          CFLAGS="$SANITIZER_FLAGS" CXXFLAGS="$SANITIZER_FLAGS" \
          LDFLAGS="-L$BREW_PREFIX/lib -L$BREW_PREFIX/opt/libomp/lib -lomp -fsanitize=address,undefined" \
          ./configure --enable-checking --disable-static-link --disable-openmp \
          --enable-qtgui MOC="$MOC_CANDIDATE"
    - name: Build sanitizer variant
      run: |
        set -o pipefail
        make -j$(sysctl -n hw.logicalcpu) 2>&1 | tee macos-sanitizer-build.log
    - name: Upload macOS sanitizer build diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-diagnostics-sanitizers-macos
        path: |
          macos-sanitizer-build.log
          config.log
          src/qtgui/Makefile
          src/qtgui/Makefile.am
          src/qtgui/Makefile.in
    - name: Qt multi-window smoke test (ASan + UBSan)
      env:
        ASAN_OPTIONS: halt_on_error=1
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        QT_QPA_PLATFORM: offscreen
      run: |
        ./src/qtgui/colorscreen-qt \
          --smoke-test 30000 --smoke-test-expect-windows 2 \
          --smoke-test-tile-activation-stable --smoke-test-menu-order \
          --smoke-test-new-view --smoke-test-slanted-reference \
          "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif" \
          "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif"

        ./src/qtgui/colorscreen-qt \
          --smoke-test 60000 --smoke-test-expect-windows 2 \
          --smoke-test-workspace-churn \
          "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif" \
          "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif"

        ./src/qtgui/colorscreen-qt \
          --smoke-test 30000 --smoke-test-expect-windows 2 \
          --smoke-test-document-lifecycle \
          "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif" \
          "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif"

        ./src/qtgui/colorscreen-qt \
          --smoke-test 20000 --smoke-test-expect-windows 1 \
          --smoke-test-window-lifetime \
          "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif"
    - name: Test sanitizer variant
      env:
        ASAN_OPTIONS: halt_on_error=1
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      run: make -j$(sysctl -n hw.logicalcpu) check
    - name: Upload sanitizer test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: testsuite-sanitizers-macos
        path: |
          testsuite/*.txt
          testsuite/*.log
          testsuite/*.par
    - name: Compiler cache stats
      if: always()
      run: ccache --show-stats

  windows-address-sanitizer:
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.windows_asan) &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       !contains(github.event.pull_request.body, '[ci:') ||
       contains(github.event.pull_request.body, '[ci:all]') ||
       contains(github.event.pull_request.body, '[ci:sanitizers]') ||
       contains(github.event.pull_request.body, '[ci:windows-asan]'))
    name: AddressSanitizer (Windows clang64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: msys2/setup-msys2@v2
      with:
        msystem: CLANG64
        update: false
        cache: true
        install: >
          make mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-gdb
          mingw-w64-clang-x86_64-libtiff mingw-w64-clang-x86_64-llvm-openmp
          mingw-w64-clang-x86_64-libjpeg-turbo git mingw-w64-clang-x86_64-libraw
          mingw-w64-clang-x86_64-lcms2 mingw-w64-clang-x86_64-libzip
          mingw-w64-clang-x86_64-gsl diffutils autoconf-archive
          mingw-w64-clang-x86_64-autotools mingw-w64-clang-x86_64-fftw
          mingw-w64-clang-x86_64-qt6-base mingw-w64-clang-x86_64-qt6-tools
          mingw-w64-clang-x86_64-adwaita-icon-theme mingw-w64-clang-x86_64-qt6-svg
          mingw-w64-clang-x86_64-imagemagick mingw-w64-clang-x86_64-exiv2
    - name: Verify generated build metadata
      shell: msys2 {0}
      run: sh build-aux/check-generated-build-metadata.sh
    - name: Update autotools
      shell: msys2 {0}
      run: autoreconf -fiv
    - name: Configure with AddressSanitizer
      shell: msys2 {0}
      run: |
        export PATH="/clang64/share/qt6/bin:$PATH"
        SANITIZER_FLAGS="-O1 -g -fno-omit-frame-pointer -fno-optimize-sibling-calls -fsanitize=address"
        CC=clang CXX=clang++ AR=llvm-ar NM=llvm-nm \
          STRIP=llvm-strip RANLIB=llvm-ranlib \
          CXXFLAGS="$SANITIZER_FLAGS" CFLAGS="$SANITIZER_FLAGS" \
          LDFLAGS="-Wl,--stack,16777216 -fsanitize=address -lomp -lpthread" \
          ./configure --enable-checking --disable-static-link --enable-qtgui
    - name: Generate Windows icon
      shell: msys2 {0}
      run: |
        magick images/icon.svg -background none -define icon:auto-resize=256,128,64,48,32,16 os/windows/icon.ico
        cp os/windows/icon.ico src/qtgui/icon.ico
    - name: Build AddressSanitizer variant
      shell: msys2 {0}
      run: |
        set -o pipefail
        make -j2 2>&1 | tee windows-asan-build.log
    - name: Upload Windows ASan build diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: windows-asan-build-log
        path: |
          windows-asan-build.log
          config.log
          src/qtgui/Makefile
          src/qtgui/Makefile.am
          src/qtgui/Makefile.in
    - name: Create bounded ASan process runner
      shell: msys2 {0}
      run: |
        cat > windows-asan-watchdog.sh <<'EOF'
        #!/usr/bin/env bash
        # A Windows ASan process can occasionally wedge before Qt reaches
        # main(). Bound it externally so the CI job never waits for hours.
        # On timeout, diagnose both the libtool launcher and the real .libs
        # executable, then kill the complete process tree before any retry.
        set -uo pipefail

        if test "$#" -lt 3; then
          echo "usage: $0 LABEL TIMEOUT_SECONDS PROGRAM [ARGS ...]" >&2
          exit 2
        fi
        label=$1
        timeout_seconds=$2
        shift 2
        output_log="windows-asan-${label}.log"
        process_log="windows-asan-${label}-processes.log"
        backtrace_log="windows-asan-${label}-backtrace.log"
        runtime_prefix="windows-asan-runtime-${label}"

        echo "command: $*" > "$output_log"
        echo "timeout: ${timeout_seconds}s" >> "$output_log"
        ASAN_OPTIONS="${ASAN_OPTIONS:-halt_on_error=1}:abort_on_error=1:symbolize=1:log_path=${runtime_prefix}" \
        ASAN_SYMBOLIZER_PATH="${ASAN_SYMBOLIZER_PATH:-/clang64/bin/llvm-symbolizer.exe}" \
          "$@" >> "$output_log" 2>&1 &
        shell_pid=$!
        deadline=$((SECONDS + timeout_seconds))

        while kill -0 "$shell_pid" 2>/dev/null; do
          if test "$SECONDS" -ge "$deadline"; then
            echo "watchdog timeout after ${timeout_seconds}s (MSYS pid ${shell_pid})" | tee -a "$output_log"
            {
              echo "===== ps -efW ====="
              ps -efW 2>&1 || ps -W 2>&1 || true
              echo "===== tasklist ====="
              timeout 10s tasklist.exe 2>&1 || true
            } > "$process_log"

            mapfile -t winpids < <(
              MSYS2_ARG_CONV_EXCL='*' timeout 10s tasklist.exe \
                /FI "IMAGENAME eq colorscreen-qt.exe" /FO CSV /NH 2>/dev/null | \
                tr -d '\r' | \
                awk -F',' '$1 ~ /colorscreen-qt\.exe/ {
                  gsub(/"/, "", $2);
                  print $2;
                }'
            )
            : > "$backtrace_log"
            if test "${#winpids[@]}" -gt 0; then
              for winpid in "${winpids[@]}"; do
                echo "attaching GDB to Windows pid ${winpid}" | tee -a "$output_log"
                {
                  echo "===== Windows pid ${winpid} ====="
                  timeout 20s gdb --batch --nx \
                    -ex "set pagination off" \
                    -ex "set confirm off" \
                    -ex "info threads" \
                    -ex "thread apply all bt full" \
                    -p "$winpid"
                } >> "$backtrace_log" 2>&1 || true
              done
              # The libtool launcher and .libs executable have the same image
              # name. Kill both so a timed-out first attempt cannot poison the
              # retry or survive until GitHub's end-of-job cleanup.
              MSYS2_ARG_CONV_EXCL='*' timeout 10s taskkill.exe \
                /IM colorscreen-qt.exe /T /F >> "$process_log" 2>&1 || true
            else
              echo "could not locate colorscreen-qt.exe Windows pids" > "$backtrace_log"
            fi

            kill -KILL "$shell_pid" 2>/dev/null || true
            wait "$shell_pid" 2>/dev/null || true
            cat "$output_log"
            echo "===== process state ====="
            cat "$process_log" || true
            echo "===== debugger backtrace ====="
            cat "$backtrace_log" || true
            exit 124
          fi
          sleep 1
        done

        wait "$shell_pid"
        status=$?
        cat "$output_log"
        exit "$status"
        EOF
        chmod +x windows-asan-watchdog.sh
    - name: Qt multi-window smoke test (AddressSanitizer)
      shell: msys2 {0}
      env:
        ASAN_OPTIONS: halt_on_error=1
        ASAN_SYMBOLIZER_PATH: /clang64/bin/llvm-symbolizer.exe
      run: |
        set -euo pipefail
        image="$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif"

        # Freshly built Windows ASan GUI executables occasionally wedge during
        # process startup without producing an ASan report. Retry only the
        # watchdog's timeout status; a sanitizer finding or any other non-zero
        # exit remains an immediate failure. A second timeout still fails.
        run_asan_smoke ()
        {
          local label=$1
          local timeout_seconds=$2
          shift 2
          local status
          if ./windows-asan-watchdog.sh "$label" "$timeout_seconds" "$@"; then
            return 0
          else
            status=$?
          fi
          if test "$status" -ne 124; then
            return "$status"
          fi
          echo "::warning::${label} Windows ASan smoke timed out; retrying once after forced cleanup"
          sleep 2
          ./windows-asan-watchdog.sh "${label}-retry" "$timeout_seconds" "$@"
        }

        # Keep the native MDI mode-switch probe in its own process on Windows.
        # Combining it with the detached-view smoke triggers a Qt crash before
        # AddressSanitizer can produce a diagnostic.
        run_asan_smoke mdi 45 \
          ./src/qtgui/colorscreen-qt \
            --smoke-test 10000 --smoke-test-expect-windows 2 \
            --smoke-test-tile-activation-stable --smoke-test-menu-order \
            "$image" "$image"

        # The renderer sweep performs synchronous renderer precomputation for
        # every GUI mode in both coordinate spaces. Windows clang64 ASan can
        # spend well over six minutes doing that real work, so keep both the
        # application and process watchdogs bounded but give them a realistic
        # budget.
        run_asan_smoke detached-views 900 \
          ./src/qtgui/colorscreen-qt \
            --smoke-test 720000 --smoke-test-expect-windows 2 \
            --smoke-test-new-view --smoke-test-slanted-reference \
            "$image" "$image"

        run_asan_smoke workspace-churn 100 \
          ./src/qtgui/colorscreen-qt \
            --smoke-test 60000 --smoke-test-expect-windows 2 \
            --smoke-test-workspace-churn \
            "$image" "$image"

        run_asan_smoke document-lifecycle 90 \
          ./src/qtgui/colorscreen-qt \
            --smoke-test 30000 --smoke-test-expect-windows 2 \
            --smoke-test-document-lifecycle \
            "$image" "$image"

        run_asan_smoke window-lifetime 60 \
          ./src/qtgui/colorscreen-qt \
            --smoke-test 20000 --smoke-test-expect-windows 1 \
            --smoke-test-window-lifetime "$image"
    - name: Test AddressSanitizer variant
      shell: msys2 {0}
      env:
        ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:symbolize=1:log_path=windows-asan-runtime-check
        ASAN_SYMBOLIZER_PATH: /clang64/bin/llvm-symbolizer.exe
      run: make -j2 check
    - name: Print Windows ASan failure diagnostics
      if: failure()
      shell: msys2 {0}
      run: |
        shopt -s nullglob
        for log in windows-asan-*.log windows-asan-runtime-*; do
          echo "===== $log ====="
          cat "$log" || true
        done
        if test -f testsuite/test-suite.log; then
          echo "===== testsuite/test-suite.log ====="
          cat testsuite/test-suite.log || true
        fi
    - name: Upload sanitizer test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: testsuite-asan-windows-clang64
        path: |
          windows-asan-*.log
          windows-asan-runtime-*
          testsuite/*.txt
          testsuite/*.log
          testsuite/*.par
