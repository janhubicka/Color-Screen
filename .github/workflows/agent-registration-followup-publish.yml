name: Agent registration follow-up publisher
on:
  push:
    branches: [agent/qtgui-registration-followup-stage]
    paths: [.github/workflows/agent-registration-followup-publish.yml]
permissions:
  contents: write
  packages: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish exact reviewed registration follow-up
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=fcf58687463a055dfb888e456fde6c71e2e9bb6d
          FEATURE=agent/qtgui-registration-stall-recovery
          git merge-base --is-ancestor "$BASE" HEAD
          cat .agent-registration-followup-v2.part1 \
              .agent-registration-followup-v2.part2 \
              .agent-registration-followup-v2.part3 \
              | base64 -d | xz -d > /tmp/change.patch
          echo '10ab9bc0de95dd796c5a35c935f6dc9ee2f094746fbe89f8c631fe220604ca3e  /tmp/change.patch' | sha256sum -c -
          git checkout -B "$FEATURE" "$BASE"
          git apply --index /tmp/change.patch
          cat > /tmp/expected-files <<'EOF'
          .agents/qtgui.md
          doc/lens-correction-review.md
          doc/qtgui-internal-cleanup.md
          doc/qtgui-workflow-roadmap.md
          src/libcolorscreen/include/colorscreen.h
          src/libcolorscreen/include/solver-parameters.h
          src/libcolorscreen/loadsave.C
          src/libcolorscreen/solver.C
          src/libcolorscreen/unittests.C
          src/qtgui/FinetuneMisregisteredWorker.cpp
          src/qtgui/FinetuneMisregisteredWorker.h
          src/qtgui/GeometryPanel.cpp
          src/qtgui/GeometryPanel.h
          src/qtgui/MainWindow.cpp
          src/qtgui/MainWindow.h
          src/qtgui/WorkspaceChurnSmoke.cpp
          EOF
          git diff --cached --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --cached --check
          sh build-aux/check-generated-build-metadata.sh
          CXXFLAGS='-O2 -g -Wall -Wextra' CFLAGS='-O2 -g -Wall -Wextra' \
            ./configure --enable-checking --disable-static-link
          make -C src/libcolorscreen -j"$(nproc)" unittests
          ./src/libcolorscreen/unittests lens_fit_policy
          ./src/libcolorscreen/unittests warp
          ./src/libcolorscreen/unittests lens_correction
          ./src/libcolorscreen/unittests 1d_homography
          git config user.name 'ChatGPT Agent'
          git config user.email 'noreply@openai.com'
          git commit -m 'qtgui: refine registration stall recovery and lens fitting'
          test "$(git rev-parse HEAD^)" = "$BASE"
          git push --force-with-lease origin "$FEATURE"
