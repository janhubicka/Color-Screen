name: Build temporary focus CLI bundle

on:
  pull_request:
    branches:
      - agent/tmp-focus-cli-bundle-base

permissions:
  contents: read
  packages: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out temporary base
        uses: actions/checkout@v4
        with:
          ref: agent/tmp-focus-cli-bundle-base
          fetch-depth: 1
      - name: Apply focus CLI patch
        run: |
          git apply --check agent/focus-cli.patch
          git apply agent/focus-cli.patch
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/colorscreen/colorscreen.C')
          text = path.read_text()
          replacements = [
              ('      fprintf (stderr, "      --fixed-focus-verification verify candidates without refitting global focus\\n");\n'
               '      fprintf (stderr, "      --no-leave-one-out         skip N-1 stability fits\\n");',
               '      fprintf (stderr, "      --fixed-focus-verification verify candidates without refitting global focus\\n");\n'
               '      fprintf (stderr, "      --fixed-joint-position     keep verified local phases fixed in the joint focus solve\\n");\n'
               '      fprintf (stderr, "      --no-leave-one-out         skip N-1 stability fits\\n");'),
              ('  bool fixed_focus_verification = false;\n  uint64_t focus_flags',
               '  bool fixed_focus_verification = false;\n  bool fixed_joint_position = false;\n  uint64_t focus_flags'),
              ('      else if (arg == "--fixed-focus-verification")\n        fixed_focus_verification = true;\n'
               '      else if (arg == "--no-leave-one-out")',
               '      else if (arg == "--fixed-focus-verification")\n        fixed_focus_verification = true;\n'
               '      else if (arg == "--fixed-joint-position")\n        fixed_joint_position = true;\n'
               '      else if (arg == "--no-leave-one-out")'),
              ('  if (!use_bw)\n    joint.flags |= finetune_uniform_image_layer;\n\n  finetune_focus_analysis_parameters',
               '  if (!use_bw)\n    joint.flags |= finetune_uniform_image_layer;\n'
               '  if (fixed_joint_position)\n    joint.flags &= ~finetune_position;\n\n  finetune_focus_analysis_parameters'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one match, found {text.count(old)} for {old[:60]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          grep -q -- '--fixed-joint-position' src/colorscreen/colorscreen.C
      - name: Build CLI
        run: |
          CXXFLAGS='-O2 -g' CFLAGS='-O2 -g' ./configure
          make -C src/libcolorscreen -j$(nproc)
          make -C src/colorscreen -j$(nproc) colorscreen
          ./src/colorscreen/colorscreen --help >/tmp/colorscreen-help.txt 2>&1 || true
          grep -q 'analyze-focus-areas' /tmp/colorscreen-help.txt
      - name: Bundle executable and shared libraries
        shell: bash
        run: |
          set -euxo pipefail
          exe=src/colorscreen/colorscreen
          mkdir -p /tmp/focus-cli/lib
          cp "$exe" /tmp/focus-cli/colorscreen.bin
          ldd "$exe" | tee /tmp/focus-cli/ldd.txt
          ldd "$exe" | awk '/=> \/|^\// {for(i=1;i<=NF;i++) if ($i ~ /^\//) print $i}' | sort -u >/tmp/libs.txt
          while read -r lib; do
            base=$(basename "$lib")
            case "$base" in
              libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|ld-linux*.so.*) continue ;;
            esac
            cp -L "$lib" "/tmp/focus-cli/lib/$base"
          done </tmp/libs.txt
          cat >/tmp/focus-cli/colorscreen <<'EOF'
          #!/bin/sh
          here=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          LD_LIBRARY_PATH="$here/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" exec "$here/colorscreen.bin" "$@"
          EOF
          chmod +x /tmp/focus-cli/colorscreen
          tar -C /tmp -czf /tmp/colorscreen-focus-cli-bundle.tar.gz focus-cli
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: colorscreen-focus-cli-bundle
          path: /tmp/colorscreen-focus-cli-bundle.tar.gz
          retention-days: 1
