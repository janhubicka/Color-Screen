name: Ubuntu build

on:
  push:
    branches: [ "main", "v1-branch", "Kimrova-bachelorRelease" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: read

env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  PATH: /usr/lib/qt6/libexec:/usr/lib/x86_64-linux-gnu/qt6/libexec:/usr/lib/qt6/bin:/usr/lib/x86_64-linux-gnu/qt6/bin:/usr/lib64/qt6/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  CC: "ccache gcc"
  CXX: "ccache g++"
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 500M

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }

    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v4
    - name: Restore compiler cache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-${{ runner.os }}-${{ matrix.arch }}-${{ github.event.pull_request.head.sha || github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ matrix.arch }}-
    - name: Reset compiler cache stats
      run: ccache --zero-stats

    - name: configure
      run: CXXFLAGS="-Ofast -flto=auto" CFLAGS="$CXXFLAGS" ./configure --enable-qtgui
    - name: make
      run: make -j$(nproc)
    - name: Qt multi-document smoke test
      run: |
        QT_QPA_PLATFORM=offscreen ./src/qtgui/colorscreen-qt \
          --smoke-test 10000 --smoke-test-expect-windows 2 \
          --smoke-test-tile-activation-stable --smoke-test-menu-order \
          --smoke-test-new-view --smoke-test-slanted-reference \
          "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif" \
          "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif"
    - name: make check
      run: make -j$(nproc) check
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: testsuite-${{ matrix.arch }}
        path: |
          testsuite/*.txt
          testsuite/*.log
          testsuite/*.par

    - name: Package DEB
      run: |
        # Create temp install dir
        mkdir -p /tmp/install
        # Install to temp dir
        make install DESTDIR=/tmp/install
        # Run packaging script
        ./os/linux/package_deb.sh /tmp/install 2.0alpha ${{ matrix.arch }}
    - uses: actions/upload-artifact@v4
      with:
        name: colorscreen-deb-${{ matrix.arch }}
        path: colorscreen_*.deb
    - name: Compiler cache stats
      if: always()
      run: ccache --show-stats

  distcheck:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v4
    - name: Restore compiler cache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-${{ runner.os }}-amd64-distcheck-${{ github.event.pull_request.head.sha || github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-amd64-distcheck-
          ccache-${{ runner.os }}-amd64-
    - name: Reset compiler cache stats
      run: ccache --zero-stats

    - name: configure
      run: CXXFLAGS="-Ofast -flto=auto" CFLAGS="$CXXFLAGS" ./configure --enable-qtgui
    - name: make distcheck
      run: make -j$(nproc) distcheck
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: testsuite-distcheck-amd64
        path: |
          testsuite/*.txt
          testsuite/*.log
          testsuite/*.par
          colorscreen-*/_build/testsuite/*.txt
          colorscreen-*/_build/testsuite/*.log
          colorscreen-*/_build/testsuite/*.par
    - uses: actions/upload-artifact@v4
      with:
        name: source-tarball
        path: colorscreen-*.tar.gz
    - name: Compiler cache stats
      if: always()
      run: ccache --show-stats

  checking:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v4
    - name: Restore compiler cache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-${{ runner.os }}-amd64-checking-${{ github.event.pull_request.head.sha || github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-amd64-checking-
          ccache-${{ runner.os }}-amd64-
    - name: Reset compiler cache stats
      run: ccache --zero-stats

    - name: configure with checking
      run: CXXFLAGS="-Ofast  -march=native -fsanitize=address,undefined" CFLAGS="$CXXFLAGS" ./configure --enable-checking --disable-static-link --enable-gtkgui --enable-qtgui
    - name: make (checking enabled)
      run: make -j$(nproc)
    - name: Ensure virtual X server is available
      run: |
        if ! command -v xvfb-run >/dev/null 2>&1; then
          apt-get update
          apt-get install -y --no-install-recommends xauth xvfb
          rm -rf /var/lib/apt/lists/*
        fi
    - name: Qt GUI smoke tests (sanitizers)
      env:
        ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        QT_QPA_PLATFORM: xcb
        QT_X11_NO_MITSHM: "1"
      run: |
        xvfb-run -a -s "-screen 0 1600x1200x24" \
          ./src/qtgui/colorscreen-qt \
            --smoke-test 30000 --smoke-test-expect-windows 2 \
            --smoke-test-tile-activation-stable --smoke-test-menu-order \
            --smoke-test-new-view --smoke-test-slanted-reference \
            "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif" \
            "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif"

        xvfb-run -a -s "-screen 0 1600x1200x24" \
          ./src/qtgui/colorscreen-qt \
            --smoke-test 20000 --smoke-test-expect-windows 1 \
            --smoke-test-window-lifetime \
            "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif"
    - name: make check (checking enabled)
      run: make -j$(nproc) check
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: testsuite-checking-amd64
        path: |
          testsuite/*.txt
          testsuite/*.log
          testsuite/*.par
    - name: Compiler cache stats
      if: always()
      run: ccache --show-stats
