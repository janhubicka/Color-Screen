name: Ubuntu build

on:
  push:
    branches: [ "main", "v1-branch", "Kimrova-bachelorRelease" ]
  pull_request:
    branches: [ "main" ]

jobs:
  publish-recovery-patch:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/tmp-publish-recovery-references'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: Checkout publisher payload
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: publisher
    - name: Checkout feature branch
      uses: actions/checkout@v4
      with:
        ref: agent/qtgui-recover-slanted-references
        path: source
        fetch-depth: 0
    - name: Apply and verify patch
      run: |
        cd source
        git apply --check ../publisher/.agent/recover-slanted.patch
        git apply ../publisher/.agent/recover-slanted.patch
        git diff --check
    - name: Commit and push feature branch
      run: |
        cd source
        git config user.name "OpenAI Agent"
        git config user.email "agent@openai.com"
        cat > /tmp/recovery-commit-message <<'EOF'
        qtgui: recover slanted-edge reference scans

        Store live slanted-edge reference filenames alongside each document's crash-recovery payload and recreate those specialized reference tabs after the owning MainWindow is restored.

        Keep reference recovery document-scoped and atomic. Suppress metadata rewrites while replaying a saved list so opening the first recovered reference cannot truncate later entries. Missing or unreadable auxiliary scans do not block restoration of the main document.

        Deliberately do not recover ordinary New Views or view-local presentation state such as attachment, zoom, pan, Color/IR selection, or render mode. Recovered references return as attached workspace views and continue to share the source document's parameter and undo state.

        Extend the existing slanted-reference smoke test to verify persistence and replay through the normal application creation path, and document the recovery boundary in NEWS and the Qt developer notes.

        Validation before publication: exact base b9296f93; git diff --check clean. Full Qt build and smoke validation run in repository CI.
        EOF
        git add NEWS .agents/qtgui.md \
          src/qtgui/ColorScreenApplication.cpp \
          src/qtgui/ColorScreenApplication.h \
          src/qtgui/MainWindow.h src/qtgui/main.cpp
        git commit -F /tmp/recovery-commit-message
        git push origin HEAD:agent/qtgui-recover-slanted-references

  build:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    
    runs-on: ${{ matrix.runner }}
    
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      PATH: /usr/lib/qt6/libexec:/usr/lib/x86_64-linux-gnu/qt6/libexec:/usr/lib/qt6/bin:/usr/lib/x86_64-linux-gnu/qt6/bin:/usr/lib64/qt6/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    
    steps:
    - uses: actions/checkout@v4
    - name: Update
      run: sudo apt-get update
    - name: Install dependencies
      run: sudo apt-get install -y libtiff-dev libturbojpeg0-dev libzip-dev libgsl-dev libraw-dev liblcms2-dev libgtk2.0-dev libfftw3-dev qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-translations-l10n libqt6svg6-dev libexiv2-dev build-essential libopenjp2-7-dev libpng-dev
    
    - name: configure
      run: CXXFLAGS="-Ofast -flto" CFLAGS="$CXXFLAGS" ./configure --enable-qtgui
    - name: make
      run: make -j$(nproc)
    - name: Qt multi-document smoke test
      run: |
        QT_QPA_PLATFORM=offscreen ./src/qtgui/colorscreen-qt \
          --smoke-test 10000 --smoke-test-expect-windows 2 \
          --smoke-test-tile-activation-stable --smoke-test-menu-order \
          --smoke-test-new-view --smoke-test-slanted-reference \
          "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif" \
          "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif"
    - name: make check
      run: make -j$(nproc) check
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: testsuite-${{ matrix.arch }}
        path: |
          testsuite/*.txt
          testsuite/*.log
          testsuite/*.par
    
    - name: Package DEB
      run: |
        # Create temp install dir
        mkdir -p /tmp/install
        # Install to temp dir
        make install DESTDIR=/tmp/install
        # Run packaging script
        ./os/linux/package_deb.sh /tmp/install 2.0alpha ${{ matrix.arch }}
    - uses: actions/upload-artifact@v4
      with:
        name: colorscreen-deb-${{ matrix.arch }}
        path: colorscreen_*.deb

    # Only run distcheck and checking build on amd64 to save time/resources on ARM runners
    - name: make distcheck
      if: matrix.arch == 'amd64'
      run: make -j$(nproc) distcheck
    - name: Upload Test Results (distcheck)
      if: matrix.arch == 'amd64' && always()
      uses: actions/upload-artifact@v4
      with:
        name: testsuite-distcheck-${{ matrix.arch }}
        path: |
          testsuite/*.txt
          testsuite/*.log
          testsuite/*.par
    
    - uses: actions/upload-artifact@v4
      if: matrix.arch == 'amd64'
      with:
        name: source-tarball
        path: colorscreen-*.tar.gz

    - name: make distclean
      if: matrix.arch == 'amd64'
      run: make -j$(nproc) distclean
    
    - name: configure with checking
      if: matrix.arch == 'amd64'
      run: CXXFLAGS="-Ofast  -march=native -fsanitize=address,undefined" CFLAGS="$CXXFLAGS" ./configure --enable-checking --disable-static-link --enable-gtkgui --enable-qtgui
    - name: make (checking enabled)
      if: matrix.arch == 'amd64'
      run: make -j$(nproc) 
    - name: make -j$(nproc) check (checking enabled)
      if: matrix.arch == 'amd64'
      run: make check
    - name: Upload Test Results (checking enabled)
      uses: actions/upload-artifact@v4
      if: matrix.arch == 'amd64' && always()
      with:
        name: testsuite-checking-${{ matrix.arch }}
        path: |
          testsuite/*.txt
          testsuite/*.log
          testsuite/*.par