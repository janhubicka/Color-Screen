name: Ubuntu build

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  publish-overlay-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v4
        with:
          ref: agent/final-registration-overlay-publisher-20260823
          path: publisher
          fetch-depth: 0
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/qtgui-final-registration-overlay
          path: target
          fetch-depth: 0
      - name: Apply checked follow-up
        shell: bash
        run: |
          cd target
          python3 ../publisher/.agent-publish-overlay.py
          git diff --check
          git diff --stat
      - name: Amend and push feature branch
        shell: bash
        run: |
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NEWS src/qtgui/ImageWidget.cpp
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:agent/qtgui-final-registration-overlay
