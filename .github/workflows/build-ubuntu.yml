name: Export focus source

on:
  pull_request:
    branches:
      - agent/tmp-source-export-base-final2

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out focus branch
        uses: actions/checkout@v4
        with:
          ref: agent/focus-area-cold-start
          fetch-depth: 1
      - name: Archive source
        run: tar --exclude=.git -czf /tmp/colorscreen-focus-source.tar.gz .
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: colorscreen-focus-source
          path: /tmp/colorscreen-focus-source.tar.gz
          retention-days: 1
