name: Ubuntu build

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  publish-final-coordinate-patch:
    if: github.head_ref == 'agent/tmp-publish-final-coordinate-image-view'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout publisher payload
        uses: actions/checkout@v4
        with:
          ref: agent/tmp-publish-final-coordinate-image-view
          path: payload
      - name: Checkout clean feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/final-coordinate-image-view
          fetch-depth: 0
          path: feature
      - name: Apply and verify patch
        shell: bash
        run: |
          base64 -d payload/agent-final-coordinate.patch.gz.b64 | gunzip > /tmp/final-coordinate.patch
          cd feature
          git apply --check /tmp/final-coordinate.patch
          git apply /tmp/final-coordinate.patch
          git apply --check ../payload/agent-final-coordinate-followup.patch
          git apply ../payload/agent-final-coordinate-followup.patch
          git diff --check
      - name: Commit and push feature branch
        shell: bash
        run: |
          cd feature
          git config user.name "OpenAI Agent"
          git config user.email "agent@openai.com"
          cat > /tmp/message <<'EOF'
          qtgui: add final-coordinate image views

          Extend the public tile rendering API with an explicit coordinate-space
          selector. Existing callers continue to render in scan coordinates,
          while the new final-coordinate path uses the same geometrically
          corrected screen plane and renderer sampling policies as screen-
          geometry file output and stitched projects.

          Make zero-based final-coordinate origin handling consistent between
          renderers that sample image, screen, or native final coordinates.

          Add a view-local Scan coordinates / Screen coordinates selector to
          primary and ordinary secondary Qt image views. Keep the choice outside
          ParameterState so views can independently compare raw scan geometry
          with the corrected screen plane alongside independent render mode,
          Color/IR, zoom, and pan. Route rendering, fit/navigation, overlays,
          and mouse interaction through the selected canvas while preserving
          scan-coordinate editing APIs for document operations.

          Stitched projects use final coordinates automatically because they do
          not have a single scan coordinate system. Slanted-edge reference views
          remain scan-only because they do not own registered screen geometry.

          Extend New View smoke coverage to exercise the public final-coordinate
          render_tile API and verify coordinate-space independence between the
          primary and secondary views. Update NEWS.

          Validation before publication: git apply --check and git diff --check
          are clean. Full Qt builds and offscreen smoke tests run in repository CI.
          EOF
          git add -A
          git commit -F /tmp/message
          git push origin HEAD:agent/final-coordinate-image-view
