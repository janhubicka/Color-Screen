name: Ubuntu build

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  packages: read

jobs:
  focus-carrier-publisher:
    if: github.head_ref == 'agent/tmp-focus-carrier-publisher'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    - name: Reconstruct focus patch
      shell: bash
      run: |
        set -euxo pipefail
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        cat agent/focus-multistart.part-* >/tmp/focus.patch
        echo 'ec250b7781a62755a0d53ac93eb4f6574306bc1705c009e7544617cc13c7c826  /tmp/focus.patch' | sha256sum -c -

    - name: Apply to current main and validate
      shell: bash
      run: |
        set -euxo pipefail
        git fetch origin main
        git checkout --detach origin/main
        git apply --check /tmp/focus.patch
        git apply /tmp/focus.patch
        git diff --check
        CXXFLAGS='-O2 -g' CFLAGS='-O2 -g' ./configure --enable-qtgui
        make -C src/libcolorscreen -j$(nproc) focus-analysis-unittests
        ./src/libcolorscreen/focus-analysis-unittests
        make -C src/colorscreen -j$(nproc) colorscreen
        make -C src/qtgui -j$(nproc) colorscreen-qt

    - name: Package CLI for historical-scan validation
      shell: bash
      run: |
        set -euxo pipefail
        mkdir -p /tmp/install
        make install DESTDIR=/tmp/install
        ./os/linux/package_deb.sh /tmp/install 2.0alpha amd64

    - uses: actions/upload-artifact@v4
      with:
        name: focus-carrier-cli-amd64
        path: colorscreen_*.deb

    - name: Publish clean review branch
      shell: bash
      run: |
        set -euxo pipefail
        git switch -c agent/focus-area-carrier-multistart
        git add src/colorscreen/colorscreen.C \
                src/libcolorscreen/focus-analysis.C \
                src/libcolorscreen/focus-analysis-unittests.C \
                src/libcolorscreen/include/focus-analysis.h \
                src/qtgui/MainWindow.cpp \
                src/qtgui/SharpnessPanel.cpp
        test "$(git diff --cached --name-only | wc -l)" -eq 6
        git diff --cached --check
        git config user.name 'OpenAI Codex'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit \
          -m 'focus: stabilize coupled area MTF fitting' \
          -m 'Use all selected areas to solve cheap sigma-only and defocus-only physical focus subproblems before releasing both coordinates. Keep the best scalar basin when the coupled release does not improve the actual pixel objective, so cold starts do not depend on the locally flat sigma/defocus origin.' \
          -m 'Report the effective system MTF at the process-screen carrier, stop refitting global focus during candidate verification, warm-start leave-one-out fits from the selected joint solution, and regress cold-start recovery on carrier MTF rather than a unique sigma/defocus decomposition.' \
          -m 'An existing slanted-edge calibration remains a starting basin rather than a one-sided constraint, allowing the historical capture to fit slightly sharper or blurrier when the screen data supports it.'
        git push origin +HEAD:refs/heads/agent/focus-area-carrier-multistart
