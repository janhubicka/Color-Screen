name: Ubuntu build

on:
  push:
    branches: [ "main", "v1-branch", "Kimrova-bachelorRelease" ]
  pull_request:
    branches: [ "main" ]

jobs:
  publish-bayer-guide:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/tmp-publish-bayer-guide'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: Checkout publisher payload
      uses: actions/checkout@v4
      with:
        path: publisher
    - name: Checkout review branch
      uses: actions/checkout@v4
      with:
        ref: agent/qtgui-monochrome-bayer-guide
        fetch-depth: 0
        path: target
    - name: Apply reviewed patches
      working-directory: target
      run: |
        set -eux
        test "$(git rev-parse HEAD)" = "b6c6ccc0ee97f42fd743f630d56fb52d3f61108a"
        git config user.name "OpenAI Agent"
        git config user.email "noreply@openai.com"

        cat ../publisher/.agent/payload.*.b64 | base64 -d > /tmp/bayer-publisher.tgz
        rm -rf /tmp/bayer-publisher
        mkdir /tmp/bayer-publisher
        tar -xzf /tmp/bayer-publisher.tgz -C /tmp/bayer-publisher

        git apply --check /tmp/bayer-publisher/mdi-fix.patch
        git apply /tmp/bayer-publisher/mdi-fix.patch
        git diff --check
        git add src/qtgui/WorkspaceWindow.cpp
        git commit -m "qtgui: keep tiled MDI windows stable on activation"           -m "Tabbed MDI children are maximized, and Qt may maximize a newly activated child when switching back to subwindow presentation. Enable DontMaximizeSubWindowOnActivation before entering tiled or cascaded mode so focus changes cannot move or swap the layout. Tabbed presentation continues to restore Qt's normal maximize-on-activation behavior."

        git apply --check /tmp/bayer-publisher/bayer-core.patch
        git apply /tmp/bayer-publisher/bayer-core.patch
        git apply --check /tmp/bayer-publisher/bayer-core-testfix.patch
        git apply /tmp/bayer-publisher/bayer-core-testfix.patch
        git diff --check
        git add src/libcolorscreen/imagedata.C src/libcolorscreen/include/imagedata.h src/libcolorscreen/unittests.C
        git commit -m "imagedata: detect monochrome Bayer captures"           -m "Record whether LibRaw reported a conventional 2x2 Bayer CFA, a special mosaic, or full-color data. Restrict Bayer response compensation to the conventional layout instead of applying 2x2 assumptions to X-Trans or full-color RAW files. Add a sparse affine-invariant RGB analysis that recognizes high-confidence monochrome Bayer candidates while rejecting flat, chromatic, and non-Bayer inputs, with synthetic unit coverage."

        git apply --check /tmp/bayer-publisher/bayer-gui.patch
        git apply /tmp/bayer-publisher/bayer-gui.patch
        python3 /tmp/bayer-publisher/update-qtgui-docs.py
        git diff --check
        git add NEWS .agents/qtgui.md src/qtgui/MainWindow.cpp src/qtgui/MainWindow.h
        git commit -m "qtgui: guide monochrome Bayer image setup"           -m "After a normal user open with no accepted parameter file, offer a conservative setup-guide recommendation when libcolorscreen identifies a likely monochrome capture made through a Bayer CFA. Keep the current decoding as the default action; only explicit consent switches to compensated monochrome loading and reloads the source plus reference scans. Suppress the guide for recovery and explicit reloads, preserve the document dirty marker across decoding reloads, and document the incremental guide boundary without yet importing EXIF capture parameters or proposing screen autodetection."

        git push origin HEAD:refs/heads/agent/qtgui-monochrome-bayer-guide

  build:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    
    runs-on: ${{ matrix.runner }}
    
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      PATH: /usr/lib/qt6/libexec:/usr/lib/x86_64-linux-gnu/qt6/libexec:/usr/lib/qt6/bin:/usr/lib/x86_64-linux-gnu/qt6/bin:/usr/lib64/qt6/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    
    steps:
    - uses: actions/checkout@v4
    - name: Update
      run: sudo apt-get update
    - name: Install dependencies
      run: sudo apt-get install -y libtiff-dev libturbojpeg0-dev libzip-dev libgsl-dev libraw-dev liblcms2-dev libgtk2.0-dev libfftw3-dev qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-translations-l10n libqt6svg6-dev libexiv2-dev build-essential libopenjp2-7-dev libpng-dev
    
    - name: configure
      run: CXXFLAGS="-Ofast -flto" CFLAGS="$CXXFLAGS" ./configure --enable-qtgui
    - name: make
      run: make -j$(nproc)
    - name: Qt multi-document smoke test
      run: |
        QT_QPA_PLATFORM=offscreen ./src/qtgui/colorscreen-qt \
          --smoke-test 10000 --smoke-test-expect-windows 2 \
          --smoke-test-tile-activation-stable --smoke-test-menu-order \
          --smoke-test-new-view --smoke-test-slanted-reference \
          "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif" \
          "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif"
    - name: make check
      run: make -j$(nproc) check
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: testsuite-${{ matrix.arch }}
        path: |
          testsuite/*.txt
          testsuite/*.log
          testsuite/*.par
    
    - name: Package DEB
      run: |
        mkdir -p /tmp/install
        make install DESTDIR=/tmp/install
        ./os/linux/package_deb.sh /tmp/install 2.0alpha ${{ matrix.arch }}
    - uses: actions/upload-artifact@v4
      with:
        name: colorscreen-deb-${{ matrix.arch }}
        path: colorscreen_*.deb

    - name: make distcheck
      if: matrix.arch == 'amd64'
      run: make -j$(nproc) distcheck
    - name: Upload Test Results (distcheck)
      if: matrix.arch == 'amd64' && always()
      uses: actions/upload-artifact@v4
      with:
        name: testsuite-distcheck-${{ matrix.arch }}
        path: |
          testsuite/*.txt
          testsuite/*.log
          testsuite/*.par
    
    - uses: actions/upload-artifact@v4
      if: matrix.arch == 'amd64'
      with:
        name: source-tarball
        path: colorscreen-*.tar.gz

    - name: make distclean
      if: matrix.arch == 'amd64'
      run: make -j$(nproc) distclean
    
    - name: configure with checking
      if: matrix.arch == 'amd64'
      run: CXXFLAGS="-Ofast  -march=native -fsanitize=address,undefined" CFLAGS="$CXXFLAGS" ./configure --enable-checking --disable-static-link --enable-gtkgui --enable-qtgui
    - name: make (checking enabled)
      if: matrix.arch == 'amd64'
      run: make -j$(nproc) 
    - name: make -j$(nproc) check (checking enabled)
      if: matrix.arch == 'amd64'
      run: make check
    - name: Upload Test Results (checking enabled)
      uses: actions/upload-artifact@v4
      if: matrix.arch == 'amd64' && always()
      with:
        name: testsuite-checking-${{ matrix.arch }}
        path: |
          testsuite/*.txt
          testsuite/*.log
          testsuite/*.par
