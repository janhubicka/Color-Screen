name: Build temporary focus CLI bundle

on:
  pull_request:
    branches:
      - agent/tmp-focus-cli-bundle-base

permissions:
  contents: read
  packages: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out temporary base
        uses: actions/checkout@v4
        with:
          ref: agent/tmp-focus-cli-bundle-base
          fetch-depth: 1
      - name: Apply focus CLI patch
        run: |
          git apply --check agent/focus-cli.patch
          git apply agent/focus-cli.patch
          grep -q 'analyze-focus-areas' src/colorscreen/colorscreen.C
      - name: Build CLI
        run: |
          CXXFLAGS='-O2 -g' CFLAGS='-O2 -g' ./configure
          make -j$(nproc) src/colorscreen/colorscreen
          ./src/colorscreen/colorscreen --help >/tmp/colorscreen-help.txt 2>&1 || true
          grep -q 'analyze-focus-areas' /tmp/colorscreen-help.txt
      - name: Bundle executable and shared libraries
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/focus-cli/lib
          cp src/colorscreen/colorscreen /tmp/focus-cli/colorscreen.bin
          ldd src/colorscreen/colorscreen | tee /tmp/focus-cli/ldd.txt
          ldd src/colorscreen/colorscreen | awk '/=> \/|^\// {for(i=1;i<=NF;i++) if ($i ~ /^\//) print $i}' | sort -u >/tmp/libs.txt
          while read -r lib; do
            base=$(basename "$lib")
            case "$base" in
              libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|ld-linux*.so.*) continue ;;
            esac
            cp -L "$lib" "/tmp/focus-cli/lib/$base"
          done </tmp/libs.txt
          cat >/tmp/focus-cli/colorscreen <<'EOF'
          #!/bin/sh
          here=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          LD_LIBRARY_PATH="$here/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" exec "$here/colorscreen.bin" "$@"
          EOF
          chmod +x /tmp/focus-cli/colorscreen
          tar -C /tmp -czf /tmp/colorscreen-focus-cli-bundle.tar.gz focus-cli
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: colorscreen-focus-cli-bundle
          path: /tmp/colorscreen-focus-cli-bundle.tar.gz
          retention-days: 1
