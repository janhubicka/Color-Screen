name: Agent toolbar layout publisher

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/tmp-toolbar-layout-publisher-20260905'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qtgui-toolbar-layout-ownership
          fetch-depth: 0

      - name: Finish detach status-bar ownership ordering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/qtgui/WorkspaceWindow.cpp')
          text = p.read_text()
          replacements = [
              (
                  '''  document->setParent(nullptr);\n  document->setWindowFlags(Qt::Window);\n}\n''',
                  '''  document->setParent(nullptr);\n  document->setWindowFlags(Qt::Window);\n  // Only after the document is top-level again may its private status bar be\n  // restored; embedded tabs deliberately share the workspace status bar.\n  document->setWorkspaceStatusBar(nullptr);\n}\n''',
                  'document detach status bar'),
              (
                  '''  view->setParent(nullptr);\n  view->setWindowFlags(Qt::Window);\n  view->setAttribute(Qt::WA_DeleteOnClose, true);\n}\n''',
                  '''  view->setParent(nullptr);\n  view->setWindowFlags(Qt::Window);\n  // Match document detach ordering: clear the shared status bar only after\n  // the view has left the MDI hierarchy.\n  view->setWorkspaceStatusBar(nullptr);\n  view->setAttribute(Qt::WA_DeleteOnClose, true);\n}\n''',
                  'view detach status bar'),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: anchor count {count} != 1')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY

          git diff --check
          test "$(git diff --name-only)" = 'src/qtgui/WorkspaceWindow.cpp'
          test "$(grep -c 'setWorkspaceStatusBar(nullptr);' src/qtgui/WorkspaceWindow.cpp)" -ge 2

      - name: Publish product branch
        shell: bash
        run: |
          git config user.name 'Jan Hubička'
          git config user.email '46065755+janhubicka@users.noreply.github.com'
          git add src/qtgui/WorkspaceWindow.cpp
          git commit -m 'qtgui: restore private status bars after detach'
          git push origin HEAD:agent/qtgui-toolbar-layout-ownership
