name: TEMP publish multiwindow smoke fix

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/publish-multiwindow-smoke-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish checked source patch
        shell: bash
        run: |
          set -euxo pipefail
          cp .agent/fix-multiwindow-smoke.patch /tmp/fix.patch
          git fetch origin main
          git checkout -B agent/fix-multiwindow-smoke origin/main
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
          git diff --check
          test "$(git diff --name-only)" = "src/qtgui/main.cpp"
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/qtgui/main.cpp
          git commit -m "qtgui: fix multiwindow smoke test isolation"
          git push --force origin HEAD:agent/fix-multiwindow-smoke
