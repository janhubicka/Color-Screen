name: Agent geometry sentinel test fix

on:
  push:
    branches: [agent/geometry-unconfigured-helper]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/geometry-unconfigured-sentinel
          fetch-depth: 0
      - name: Keep persistence helper on exported API
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('testsuite/unittests.test')
          text = path.read_text()
          old = '''  scr_to_img geometry_map;\n  if (geometry_map.set_parameters (default_geometry, geometry_image)\n      || !geometry_map.set_parameters_for_early_correction (\n          default_geometry, geometry_image.width, geometry_image.height))\n    {\n      std::fprintf (stderr,\n                    "Unconfigured geometry was accepted or early correction rejected\\n");\n      return 1;\n    }\n'''
          new = '''  scr_to_img geometry_map;\n  if (geometry_map.set_parameters (default_geometry, geometry_image))\n    {\n      std::fprintf (stderr, "Unconfigured geometry produced a full map\\n");\n      return 1;\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected persistence-helper geometry block')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add testsuite/unittests.test
          git commit -m "tests: keep geometry persistence helper on exported API" -m "The CSP round-trip helper is linked against the installed-style shared libcolorscreen interface, so it must not call the internal early-correction setup routine. Keep the zero/full-map assertions on the exported API; scan-only early-correction behavior remains covered end-to-end by render-original.test."
          git push origin HEAD:agent/geometry-unconfigured-sentinel
