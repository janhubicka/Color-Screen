name: Agent Stop-focus validation publisher

on:
  pull_request:
    branches: [ "agent/tmp-new-view-bugfix-validation-base-20260828" ]

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/tmp-new-view-bugfix-validation-trigger-20260828'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish exact Stop-focus validation branch
        shell: bash
        run: |
          set -euo pipefail
          cp .github/agent-new-view-second-delta.patch /tmp/stop.patch
          echo "faad85b9603a4a56e7461e423e9f387e90b13874f95db62a758ac8b8f5a2678e  /tmp/stop.patch" | sha256sum -c -
          git checkout --detach 96adf6ec8816033460d8aef8d4f8dc122e01d6c6
          git apply --check /tmp/stop.patch
          git apply /tmp/stop.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/sanitizers.yml')
          s = p.read_text()
          command = '''\n        ./src/qtgui/colorscreen-qt \\\n          --smoke-test 20000 --smoke-test-expect-windows 2 \\\n          --smoke-test-user-visible-progress \\\n          "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif" \\\n          "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif"\n'''
          mac_anchor = '    - name: Test sanitizer variant\n'
          win_anchor = '    - name: Test AddressSanitizer variant\n'
          assert s.count(mac_anchor) == 1
          assert s.count(win_anchor) == 1
          s = s.replace(mac_anchor, command + mac_anchor, 1)
          s = s.replace(win_anchor, command + win_anchor, 1)
          p.write_text(s)
          PY
          git diff --check
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git add .agents/qtgui.md src/qtgui/MainWindow.cpp src/qtgui/MainWindow.h src/qtgui/WorkspaceWindow.cpp src/qtgui/WorkspaceWindow.h src/qtgui/main.cpp .github/workflows/sanitizers.yml
          git commit -m "qtgui: keep task controls from changing active image"
          git push --force origin HEAD:refs/heads/agent/tmp-stop-focus-validation-product-20260828
