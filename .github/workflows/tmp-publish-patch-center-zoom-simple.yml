name: TEMP publish patch center zoom
on:
  push:
    branches: [agent/tmp-publish-patch-center-zoom-20260905]
    paths: [.github/workflows/tmp-publish-patch-center-zoom-simple.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git checkout agent/qtgui-patch-centers-scale-with-zoom
          perl -0pi -e 's/p\.setPen\(QPen\(QColor\(0, 0, 0, 170\), 4, Qt::SolidLine, Qt::RoundCap\)\);/const qreal markerScale = m_scale;\n  p.setPen(QPen(QColor(0, 0, 0, 170), 4 * markerScale, Qt::SolidLine, Qt::RoundCap));/' src/qtgui/ImageWidget.cpp
          perl -0pi -e 's/auto drawColor = \[&p\]\(const QList<QPointF> &points, const QColor &color\)/auto drawColor = [\&p, markerScale](const QList<QPointF> \&points, const QColor \&color)/' src/qtgui/ImageWidget.cpp
          perl -0pi -e 's/p\.setPen\(QPen\(color, 2, Qt::SolidLine, Qt::RoundCap\)\);/p.setPen(QPen(color, 2 * markerScale, Qt::SolidLine, Qt::RoundCap));/' src/qtgui/ImageWidget.cpp
          git diff --check
          test "$(git status --short | wc -l)" -eq 1
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/qtgui/ImageWidget.cpp
          git commit -m "qtgui: scale detected patch centers with zoom" -m "Keep detected patch-center marker size in scan-pixel units so the diagnostic grows naturally with magnification instead of remaining fixed in widget pixels."
          git push origin HEAD:agent/qtgui-patch-centers-scale-with-zoom
