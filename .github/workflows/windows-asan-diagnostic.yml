name: Windows ASan diagnostic

on:
  push:
    branches: [ "agent/qtgui-beta-readiness" ]

permissions:
  contents: read

concurrency:
  group: windows-asan-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-asan-diagnostic:
    name: Windows clang64 ASan diagnostic
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: msys2/setup-msys2@v2
      with:
        msystem: CLANG64
        update: false
        cache: true
        install: >
          make mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-gdb
          mingw-w64-clang-x86_64-libtiff mingw-w64-clang-x86_64-llvm-openmp
          mingw-w64-clang-x86_64-libjpeg-turbo git mingw-w64-clang-x86_64-libraw
          mingw-w64-clang-x86_64-lcms2 mingw-w64-clang-x86_64-libzip
          mingw-w64-clang-x86_64-gsl diffutils autoconf-archive
          mingw-w64-clang-x86_64-autotools mingw-w64-clang-x86_64-fftw
          mingw-w64-clang-x86_64-qt6-base mingw-w64-clang-x86_64-qt6-tools
          mingw-w64-clang-x86_64-adwaita-icon-theme mingw-w64-clang-x86_64-qt6-svg
          mingw-w64-clang-x86_64-imagemagick mingw-w64-clang-x86_64-exiv2
    - name: Verify generated build metadata
      shell: msys2 {0}
      run: sh build-aux/check-generated-build-metadata.sh
    - name: Update autotools
      shell: msys2 {0}
      run: autoreconf -fiv
    - name: Configure with AddressSanitizer
      shell: msys2 {0}
      run: |
        export PATH="/clang64/share/qt6/bin:$PATH"
        SANITIZER_FLAGS="-O1 -g -fno-omit-frame-pointer -fno-optimize-sibling-calls -fsanitize=address"
        CC=clang CXX=clang++ AR=llvm-ar NM=llvm-nm \
          STRIP=llvm-strip RANLIB=llvm-ranlib \
          CXXFLAGS="$SANITIZER_FLAGS" CFLAGS="$SANITIZER_FLAGS" \
          LDFLAGS="-Wl,--stack,16777216 -fsanitize=address -lomp -lpthread" \
          ./configure --enable-checking --disable-static-link --enable-qtgui
    - name: Generate Windows icon
      shell: msys2 {0}
      run: |
        magick images/icon.svg -background none -define icon:auto-resize=256,128,64,48,32,16 os/windows/icon.ico
        cp os/windows/icon.ico src/qtgui/icon.ico
    - name: Build AddressSanitizer variant
      shell: msys2 {0}
      run: |
        set -o pipefail
        make -j2 2>&1 | tee windows-asan-build.log
    - name: Create bounded ASan process runner
      shell: msys2 {0}
      run: |
        cat > windows-asan-watchdog.sh <<'EOF'
        #!/usr/bin/env bash
        set -uo pipefail

        if test "$#" -lt 3; then
          echo "usage: $0 LABEL TIMEOUT_SECONDS PROGRAM [ARGS ...]" >&2
          exit 2
        fi

        label=$1
        timeout_seconds=$2
        shift 2
        output_log="windows-asan-${label}.log"
        process_log="windows-asan-${label}-processes.log"
        backtrace_log="windows-asan-${label}-backtrace.log"
        runtime_prefix="windows-asan-runtime-${label}"

        echo "command: $*" > "$output_log"
        echo "timeout: ${timeout_seconds}s" >> "$output_log"
        ASAN_OPTIONS="${ASAN_OPTIONS:-halt_on_error=1}:abort_on_error=1:symbolize=1:log_path=${runtime_prefix}" \
        ASAN_SYMBOLIZER_PATH=/clang64/bin/llvm-symbolizer.exe \
          "$@" >> "$output_log" 2>&1 &
        shell_pid=$!
        deadline=$((SECONDS + timeout_seconds))

        while kill -0 "$shell_pid" 2>/dev/null; do
          if test "$SECONDS" -ge "$deadline"; then
            echo "watchdog timeout after ${timeout_seconds}s (MSYS pid ${shell_pid})" | tee -a "$output_log"
            {
              echo "===== ps -efW ====="
              ps -efW 2>&1 || ps -W 2>&1 || true
              echo "===== tasklist ====="
              tasklist.exe 2>&1 || true
            } > "$process_log"

            winpid=$(powershell.exe -NoProfile -Command \
              "(Get-Process -Name 'colorscreen-qt' -ErrorAction SilentlyContinue | Sort-Object StartTime -Descending | Select-Object -First 1).Id" \
              2>/dev/null | tr -d '\r\n ')
            if test -n "$winpid"; then
              echo "attaching GDB to Windows pid ${winpid}" | tee -a "$output_log"
              timeout 30s gdb --batch --nx \
                -ex "set pagination off" \
                -ex "set confirm off" \
                -ex "info threads" \
                -ex "thread apply all bt full" \
                -p "$winpid" > "$backtrace_log" 2>&1 || true
              taskkill.exe /PID "$winpid" /T /F >> "$process_log" 2>&1 || true
            else
              echo "could not locate colorscreen-qt.exe Windows pid" > "$backtrace_log"
            fi

            kill -KILL "$shell_pid" 2>/dev/null || true
            wait "$shell_pid" 2>/dev/null || true
            cat "$output_log"
            echo "===== process state ====="
            cat "$process_log" || true
            echo "===== debugger backtrace ====="
            cat "$backtrace_log" || true
            exit 124
          fi
          sleep 1
        done

        wait "$shell_pid"
        status=$?
        cat "$output_log"
        exit "$status"
        EOF
        chmod +x windows-asan-watchdog.sh
    - name: Probe repeated ASan process startup
      shell: msys2 {0}
      run: |
        set -uo pipefail
        : > windows-asan-status.log
        failed=0
        for i in $(seq 1 6); do
          echo "===== startup $i =====" | tee -a windows-asan-status.log
          set +e
          ./windows-asan-watchdog.sh "startup-${i}" 45 \
            ./src/qtgui/colorscreen-qt --version
          status=$?
          set -e
          echo "startup $i exit status: $status" | tee -a windows-asan-status.log
          if test "$status" -ne 0; then
            failed=1
          fi
        done
        echo "startup failures: $failed" | tee -a windows-asan-status.log
        if test "$failed" -ne 0; then
          touch windows-asan-startup-failed
        fi
    - name: Probe repeated window lifetime smoke
      shell: msys2 {0}
      run: |
        set -uo pipefail
        image="$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif"
        failed=0
        for i in $(seq 1 3); do
          echo "===== lifetime $i =====" | tee -a windows-asan-status.log
          set +e
          ./windows-asan-watchdog.sh "lifetime-${i}" 60 \
            ./src/qtgui/colorscreen-qt \
              --smoke-test 20000 --smoke-test-expect-windows 1 \
              --smoke-test-window-lifetime "$image"
          status=$?
          set -e
          echo "lifetime $i exit status: $status" | tee -a windows-asan-status.log
          if test "$status" -ne 0; then
            failed=1
          fi
        done
        echo "lifetime failures: $failed" | tee -a windows-asan-status.log
        if test "$failed" -ne 0; then
          touch windows-asan-lifetime-failed
        fi
    - name: Rerun failed lifetime smoke under GDB
      if: ${{ hashFiles('windows-asan-lifetime-failed') != '' }}
      shell: msys2 {0}
      env:
        ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:symbolize=1
        ASAN_SYMBOLIZER_PATH: /clang64/bin/llvm-symbolizer.exe
      run: |
        image="$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif"
        # Windows ASan intentionally raises access violations while reserving
        # and committing shadow memory. Pass those through compiler-rt until
        # main() is reached; only then trap SIGSEGV as an application crash.
        timeout 90s gdb --batch --nx \
          -ex "set pagination off" \
          -ex "set confirm off" \
          -ex "handle SIGSEGV nostop noprint pass" \
          -ex "tbreak main" \
          -ex run \
          -ex "handle SIGSEGV stop print pass" \
          -ex continue \
          -ex "thread apply all bt full" \
          --args ./src/qtgui/colorscreen-qt \
            --smoke-test 20000 --smoke-test-expect-windows 1 \
            --smoke-test-window-lifetime "$image" \
          > windows-asan-lifetime-gdb.log 2>&1 || true
        cat windows-asan-lifetime-gdb.log
    - name: Print ASan runtime diagnostics
      if: always()
      shell: msys2 {0}
      run: |
        cat windows-asan-status.log || true
        shopt -s nullglob
        for log in windows-asan-runtime-*; do
          echo "===== $log ====="
          cat "$log" || true
        done
    - name: Upload Windows ASan diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: windows-asan-crash-diagnostics
        if-no-files-found: warn
        path: |
          windows-asan-build.log
          windows-asan-status.log
          windows-asan-startup-*.log
          windows-asan-lifetime-*.log
          windows-asan-runtime-*
          config.log
          testsuite/*.log
          testsuite/*.txt
          testsuite/*.par
    - name: Fail on observed ASan diagnostic error
      if: always()
      shell: msys2 {0}
      run: |
        if test -e windows-asan-startup-failed || test -e windows-asan-lifetime-failed; then
          echo "Windows ASan diagnostic observed a failed or timed-out probe." >&2
          exit 1
        fi
