name: Agent publish multiview panels

on:
  pull_request:
    branches:
      - agent/multiview-panels-publish-base-20260822
    paths:
      - agent/multiview-panels.trigger

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: 15399e7ca10e3ff9abc9797364bbd3f8ca33482d
          fetch-depth: 0

      - name: Apply multiview inspector change
        shell: bash
        run: |
          set -euxo pipefail
          echo '' | base64 --decode | gzip -d > /tmp/modify-multiview.py
          python3 /tmp/modify-multiview.py
          git diff --check
          test "$(git diff --name-only | sort)" = $'.agents/qtgui.md\nNEWS\nsrc/qtgui/ImageViewWindow.cpp\nsrc/qtgui/ImageViewWindow.h\nsrc/qtgui/MainWindow.cpp\nsrc/qtgui/MainWindow.h\nsrc/qtgui/WorkspaceWindow.cpp\nsrc/qtgui/WorkspaceWindow.h\nsrc/qtgui/main.cpp'

      - name: Install Qt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libtiff-dev libturbojpeg0-dev libzip-dev libgsl-dev libraw-dev \
            liblcms2-dev libgtk2.0-dev libfftw3-dev qt6-base-dev qt6-tools-dev \
            qt6-tools-dev-tools qt6-translations-l10n libqt6svg6-dev \
            libexiv2-dev build-essential libopenjp2-7-dev libpng-dev

      - name: Build Qt GUI
        run: |
          CXXFLAGS="-O2 -g -Wall -Wextra" CFLAGS="$CXXFLAGS" \
            ./configure --enable-qtgui
          make -j"$(nproc)"

      - name: Run multiview smoke
        run: |
          QT_QPA_PLATFORM=offscreen ./src/qtgui/colorscreen-qt \
            --smoke-test 12000 --smoke-test-expect-windows 2 \
            --smoke-test-new-view --smoke-test-slanted-reference \
            "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif" \
            "$(pwd)/testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif"

      - name: Commit and push review branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git checkout -B agent/qtgui-multiview-panels
          git add -- .agents/qtgui.md NEWS \
            src/qtgui/ImageViewWindow.cpp src/qtgui/ImageViewWindow.h \
            src/qtgui/MainWindow.cpp src/qtgui/MainWindow.h \
            src/qtgui/WorkspaceWindow.cpp src/qtgui/WorkspaceWindow.h \
            src/qtgui/main.cpp
          git commit \
            -m 'qtgui: give ordinary views the full document inspector' \
            -m 'Make every ordinary New View present the same complete Navigation and parameter-panel inspector as the primary document view. Keep a single document-owned inspector so panel state, undo routing, detached diagnostic widgets, and recovery ownership are not duplicated; the active ordinary view only presents that inspector.' \
            -m 'Route navigation and panel-driven image interactions to the ordinary view currently presenting the inspector, including area selection, crop/measurement tools, registration interaction, geometry visualization controls, and profile display. Detached secondary views temporarily host the same inspector and return it when workspace or primary-window focus changes.' \
            -m 'Keep slanted-edge reference views intentionally specialized with their separate Navigation plus Sharpness-only inspector. Extend the New View smoke test to verify full panels in tabbed, detached, and reattached presentations while preserving view-local rendering state.' \
            -m 'Validation: Qt 6 build with -O2 -g -Wall -Wextra, git diff --check, and the combined New View/slanted-reference offscreen smoke test.'
          git push --force origin HEAD:refs/heads/agent/qtgui-multiview-panels
