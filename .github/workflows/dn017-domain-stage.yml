name: Validate DN017 noise domains

on:
  push:
    branches:
      - agent/dn017-domain-stage

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dn017-domain-stage
          fetch-depth: 0

      - name: Apply guarded DN017 patch
        shell: bash
        run: |
          set -euxo pipefail
          cat .dn017-core.part.* > /tmp/DN017-core.patch
          echo '361f3225364114ecc562473df7ee6438c142e6d6d32890ef46efc0ed2179f2f4  /tmp/DN017-core.patch' | sha256sum -c -
          git apply --3way /tmp/DN017-core.patch
          git diff --check

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtiff-dev libturbojpeg0-dev libzip-dev libgsl-dev libraw-dev liblcms2-dev libfftw3-dev libexiv2-dev libopenjp2-7-dev libpng-dev build-essential

      - name: O2 checking build and tests
        shell: bash
        run: |
          set -euxo pipefail
          mkdir build-o2
          cd build-o2
          CFLAGS='-O2 -g -Wall -Wextra' CXXFLAGS='-O2 -g -Wall -Wextra' ../configure --enable-checking --disable-shared --enable-static --disable-static-link
          make -j$(nproc)
          ./src/libcolorscreen/unittests denoising
          top_srcdir="$GITHUB_WORKSPACE" ./src/libcolorscreen/unittests
          make -j$(nproc) check

      - name: Build real-scan diagnostic probe
        shell: bash
        run: |
          set -euxo pipefail
          cat > /tmp/noise-domain-probe.C <<'CPP'
          #include "include/colorscreen.h"
          #include "render-interpolate.h"
          #include "denoise.h"
          #include "include/progress-info.h"
          #include <cstdio>
          using namespace colorscreen;
          static void print_three(const char *name, const denoise_noise_three_scale_estimate &e) {
            printf("  %-7s valid=%d obs=%zu r2=%g r3=%g floor=%g slope=%g fiterr=%g", name, e.valid_p(), e.paired_observations, (double)e.spacing2_variance_ratio, (double)e.spacing3_variance_ratio, (double)e.spacing1.variance_floor, (double)e.spacing1.variance_slope, (double)e.spacing1.relative_fit_error);
            if (e.scale_fit_valid_p()) printf(" p=%g invariant=%g", (double)e.scale_growth_exponent, (double)e.extrapolated_scale_invariant_fraction);
            printf("\n");
          }
          static void print_channel(const char *name, const denoise_noise_domain_comparison &c) {
            printf("%s\n", name); print_three("linear", c.linear); print_three("density", c.density); print_three("vst", c.variance_stabilized);
          }
          int main(int argc, char **argv) {
            if (argc != 3) return 2;
            const char *error=nullptr; scr_to_img_parameters param; scr_detect_parameters dparam; render_parameters rparam; solver_parameters solver;
            FILE *in=fopen(argv[2],"r"); if(!in) return 2; if(!load_csp(in,&param,&dparam,&rparam,&solver,&error)) return 2; fclose(in);
            file_progress_info progress(stdout,false,false); image_data scan; if(!scan.load(argv[1],false,&error,&progress,rparam.demosaic)) return 2;
            rparam.screen_denoise=denoise_parameters(); rparam.demosaiced_denoise=denoise_parameters(); rparam.screen_demosaic=render_parameters::nearest_demosaic;
            render_interpolate renderer(param,scan,rparam,65535); if(!renderer.precompute_all(&progress)) return 2;
            denoise_noise_domain_comparison r,g,b; if(!renderer.estimate_screen_noise_domain_models(&r,&g,&b)) return 2;
            print_channel("red separation",r); print_channel("green separation",g); print_channel("blue separation",b); return 0;
          }
          CPP
          g++ -std=gnu++17 -O2 -g -fopenmp -I$GITHUB_WORKSPACE/src/libcolorscreen -I$GITHUB_WORKSPACE/build-o2/src/libcolorscreen -I$GITHUB_WORKSPACE/src/libcolorscreen/include /tmp/noise-domain-probe.C $GITHUB_WORKSPACE/build-o2/src/libcolorscreen/.libs/libcolorscreen.a -lexiv2 -lopenjp2 -lpng16 -llcms2 -lzip -lraw -lturbojpeg -ltiff -lfftw3f -lfftw3 -lgsl -lgslcblas -lm -o /tmp/noise-domain-probe
      - uses: actions/upload-artifact@v4
        with:
          name: dn017-noise-domain-probe
          path: /tmp/noise-domain-probe

      - name: Ofast checking build and tests
        shell: bash
        run: |
          set -euxo pipefail
          mkdir build-ofast
          cd build-ofast
          CFLAGS='-Ofast -march=native -g -Wall' CXXFLAGS='-Ofast -march=native -g -Wall' ../configure --enable-checking --disable-shared --enable-static --disable-static-link
          make -j$(nproc)
          ./src/libcolorscreen/unittests denoising
          top_srcdir="$GITHUB_WORKSPACE" ./src/libcolorscreen/unittests

      - name: Commit exact validated source to staging branch
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git hash-object src/libcolorscreen/denoise.h)" = e84c77ec2b45a1d00d9d2c9334e94c9dabd21609
          test "$(git hash-object src/libcolorscreen/analyze-base.C)" = 64cbbff571ca1b7e679bc5f6b487639e026895b8
          test "$(git hash-object src/libcolorscreen/analyze-base.h)" = 7ade97479674ec6ef597c1f09321699b1bb8eb74
          rm .dn017-core.part.* .github/workflows/dn017-domain-stage.yml
          git add -- src/libcolorscreen/denoise.h src/libcolorscreen/analyze-base.C src/libcolorscreen/analyze-base.h src/libcolorscreen/render-interpolate.C src/libcolorscreen/render-interpolate.h src/libcolorscreen/unittests.C .dn017-core.part.00 .dn017-core.part.01 .dn017-core.part.02 .dn017-core.part.03 .github/workflows/dn017-domain-stage.yml
          git config user.name 'OpenAI review'
          git config user.email 'review@openai.invalid'
          git commit -m 'denoise: compare noise sample domains' -m 'Add read-only three-scale comparisons in linear intensity, optical-density and generalized square-root variance-stabilized domains. Reuse the existing support and physical-geometry filtering, reject invalid density samples instead of clipping them, and derive the stabilizer from the measured linear spacing-1 floor+slope variance model. Add synthetic regressions for multiplicative transmission noise and signal-dependent additive noise. No filtering, GUI or serialized parameter semantics change.'
          git push origin HEAD:agent/dn017-domain-stage
