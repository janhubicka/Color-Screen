name: Publish reviewed geometry patch

on:
  push:
    branches:
      - agent/geometry-transport-20260821

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[publish result]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record workflow run
        shell: bash
        run: |
          set -euxo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > .agent-geometry-publish/run-id
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- .agent-geometry-publish/run-id
          git commit -m 'ci: record geometry publish run [publish result] [skip ci]'
          git push origin HEAD:agent/geometry-transport-20260821

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euxo pipefail
          cat .agent-geometry-publish/patch.gz.b64.* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/scr-geometry.patch
          echo '80ef26b0663696c8eca43d54841c2feba178beb1fef51f7d33d0bff267a2182d  /tmp/scr-geometry.patch' \
            | sha256sum --check

      - name: Apply to current main and publish clean branch
        shell: bash
        run: |
          set -euxo pipefail
          branch=agent/scr-detect-geometry-cleanup
          git fetch origin main
          git checkout --detach origin/main
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git am /tmp/scr-geometry.patch
          git diff --check HEAD^ HEAD
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | sort | tr '\n' ' ')" = \
            'doc/scr-detect-geometry-tracking.md src/libcolorscreen/scr-detect-geometry.C '
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git diff --exit-code "origin/$branch^{tree}" HEAD^{tree}
          else
            git push origin "HEAD:refs/heads/$branch"
          fi
          git rev-parse HEAD | tee /tmp/FINAL_COMMIT
          git show --stat --oneline HEAD | tee /tmp/COMMIT_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: scr-geometry-publish-result
          path: |
            /tmp/FINAL_COMMIT
            /tmp/COMMIT_SUMMARY
          if-no-files-found: error
