name: Temporary PR252 promote verified mode-setter fix

on:
  push:
    branches:
      - agent/tmp-pr252-mode-setter-probe

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/render-dispatch-smoke
          fetch-depth: 0

      - name: Verify tested PR head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "54d715ccf489ea257a39307570dd50e385894428"

      - name: Apply verified mode-setter fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/qtgui/ImageViewWindow.cpp')
          text = path.read_text()
          old = '''/** Programmatically select TYPE in this view. */
          bool ImageViewWindow::setRenderType(colorscreen::render_type_t type) {
            const int index = m_modeComboBox->findData(static_cast<int>(type));
            if (index < 0)
              return false;
            m_modeComboBox->setCurrentIndex(index);
            return m_renderTypeParams.type == type;
          }
          '''
          new = '''/** Programmatically select TYPE in this view. */
          bool ImageViewWindow::setRenderType(colorscreen::render_type_t type) {
            const int index = m_modeComboBox->findData(static_cast<int>(type));
            if (index < 0)
              return false;

            // setCurrentIndex() emits no signal when INDEX is already current,
            // so update the private render snapshot explicitly as well.
            {
              const QSignalBlocker blocker(m_modeComboBox);
              m_modeComboBox->setCurrentIndex(index);
            }
            onModeChanged(index);
            return m_modeComboBox->currentIndex() == index &&
                   m_renderTypeParams.type == type;
          }
          '''
          if old not in text:
              raise SystemExit('expected setRenderType implementation not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/qtgui/ImageViewWindow.cpp

      - name: Commit and update PR branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/qtgui/ImageViewWindow.cpp
          git commit -m 'qt: keep New View render mode state synchronized'
          git push origin HEAD:agent/render-dispatch-smoke
