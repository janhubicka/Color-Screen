name: Agent MTF fit staging
on:
  push:
    branches: [agent/qtgui-mtf-fit-stage]
    paths:
      - .github/workflows/agent-mtf-fit-stage.yml
      - .agent-mtf-fit-correct.py
permissions:
  contents: write
concurrency:
  group: agent-mtf-fit-stage
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish reviewed measured-MTF change
        shell: bash
        run: |
          set -euo pipefail
          base=2ddd51b41fbb22944df0414189df425569315362
          staged=b9464c6a86ed120bcc4cbea86ceb8f94e084c23d
          target=agent/qtgui-mtf-fit-one-shot-v2
          test -z "$(git ls-remote --heads origin "refs/heads/$target")"
          cp .agent-mtf-fit-correct.py /tmp/mtf-fit-correct.py
          git checkout -b "$target" "$base"
          git cherry-pick --no-commit "$staged"
          python3 /tmp/mtf-fit-correct.py
          git diff HEAD --check
          sh build-aux/check-generated-build-metadata.sh
          git config user.name "Jan Hubička"
          git config user.email "46065755+janhubicka@users.noreply.github.com"
          git add .agents/qtgui.md doc/mtf-fitting-workflow.md doc/qtgui-internal-cleanup.md
          git add src/qtgui/ImageViewWindow.cpp src/qtgui/MainWindow.cpp src/qtgui/MainWindow.h
          git add src/qtgui/SharpnessPanel.cpp src/qtgui/SharpnessPanel.h src/qtgui/WorkspaceChurnSmoke.cpp
          git commit -m "qtgui: migrate measured MTF fitting to one-shot lifecycle"
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git diff --name-only "$base" HEAD | wc -l)" -eq 9
          git push origin "HEAD:refs/heads/$target"
          git log -1 --format=fuller
          git diff --stat "$base" HEAD
