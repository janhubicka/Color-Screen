name: Agent apply PR 243 follow-up

on:
  push:
    branches:
      - agent/source-transport-243

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: agent/qtgui-persistence-hardening
      TARGET_SHA: 856a4baaaaf4eae555a5139275152e2785c84ace
      BASE_SHA: 0abc8b14624e1e10e0ec9ab84ddfaf9c09ad5c27
    steps:
      - name: Check out transport payload
        uses: actions/checkout@v4
        with:
          ref: agent/source-transport-243
          path: transport
      - name: Check out guarded target revision
        uses: actions/checkout@v4
        with:
          ref: agent/qtgui-persistence-hardening
          fetch-depth: 0
          path: repo
      - name: Apply, validate, squash, and update target
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          actual=$(git rev-parse HEAD)
          test "$actual" = "$TARGET_SHA" || {
            echo "target moved: expected $TARGET_SHA, found $actual" >&2
            exit 1
          }

          git apply --check ../transport/.agents/pr243-followup.patch
          git apply ../transport/.agents/pr243-followup.patch
          git diff --check
          git add src/qtgui/MainWindow.cpp \
                  src/qtgui/MainWindow.h \
                  src/qtgui/ParameterState.h \
                  src/qtgui/WorkspaceChurnSmoke.cpp

          # Preserve the already-reviewed persistence tests from the existing
          # PR commit while replacing branch history with one final commit.
          git reset --soft "$BASE_SHA"
          git diff --cached --check
          expected=$(printf '%s\n' \
            src/qtgui/MainWindow.cpp \
            src/qtgui/MainWindow.h \
            src/qtgui/ParameterState.h \
            src/qtgui/WorkspaceChurnSmoke.cpp \
            testsuite/unittests.test | sort)
          actual_files=$(git diff --cached --name-only | sort)
          test "$actual_files" = "$expected" || {
            echo "unexpected final file set:" >&2
            printf '%s\n' "$actual_files" >&2
            exit 1
          }

          test -z "$(grep -nE '^#define (save_csp|load_csp)' src/qtgui/ParameterState.h || true)"
          test "$(grep -c 'save_csp_with_profile_spots' src/qtgui/MainWindow.cpp)" -eq 2
          test "$(grep -c 'load_csp_with_profile_spots' src/qtgui/MainWindow.cpp)" -eq 3

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'qtgui: harden parameter persistence'
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$TARGET_SHA" \
            origin HEAD:"$TARGET_BRANCH"
