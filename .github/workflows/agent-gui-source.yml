name: Agent GUI source transport
on:
  push:
    branches: [agent/transport-gui-color-sections-20260920]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: afc0873b2eb4371731998f0f28559cea760df118
      - name: Archive exact baseline
        run: |
          git rev-parse HEAD
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/colorscreen-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: colorscreen-gui-source-afc0873
          path: ${{ runner.temp }}/colorscreen-source.tar.gz
          retention-days: 2
