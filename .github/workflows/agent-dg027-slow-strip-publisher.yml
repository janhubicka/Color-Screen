name: Agent DG027 slow strip publisher

on:
  push:
    branches:
      - agent/dg027-slow-strip-publish-20260826

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    env:
      SCRIPT_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scr-detect-slow-strip-contrast
          fetch-depth: 0
      - name: Apply measured source and tracker update
        shell: bash
        run: |
          printf '%s' "$SCRIPT_B64" | base64 -d | gzip -d > /tmp/apply-dg027.py
          python3 /tmp/apply-dg027.py
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' doc/scr-detect-geometry-tracking.md src/libcolorscreen/scr-detect-geometry.C)"
          test "$changed" = "$expected"
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git add doc/scr-detect-geometry-tracking.md src/libcolorscreen/scr-detect-geometry.C
          git commit -m 'detect: enforce slow Dufay strip contrast' \
            -m 'Slow strip sampling stores neighboring-row dye fractions in bestouter_ud and folds left/right samples into the strip interior before zeroing bestouter_lr. The acceptance gate nevertheless compared against the zeroed left/right accumulator, so any positive strip passed min_patch_contrast. Select bestouter_ud for strip acceptance while retaining the historical bestouter_lr gate for non-strip patches. Sampling geometry, contrast thresholds, priorities, hard strips, DG-026 soft strips, and square-patch confirmation are unchanged.' \
            -m 'Full-resolution NGS00428 combined-mode coverage changes only marginally: Tile05 0/0 88.77% to 88.71%, Tile01 0/0 93.51% to 93.37%, and the historical 2/3 controls remain within 0.07 percentage point. Slow-only Tile05 becomes intentionally more selective, exposing how much weak strip evidence the old gate admitted. Both six-case real Dufay integration suites pass, including the Nikon slow-only coverage gate. Record the correction and measurements as DG-027.'
          git push origin HEAD:agent/scr-detect-slow-strip-contrast
