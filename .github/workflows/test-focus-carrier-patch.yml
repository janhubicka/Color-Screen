name: Test focus carrier patch

on:
  pull_request:
    branches:
      - agent/tmp-focus-carrier-publish-base

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out transport branch
        uses: actions/checkout@v4
        with:
          ref: agent/tmp-focus-carrier-publish-base
          fetch-depth: 0

      - name: Reconstruct patch
        shell: bash
        run: |
          set -euxo pipefail
          cat agent/focus-carrier-v2-*.b64 | tr -d '\n' | base64 -d >/tmp/focus-carrier.patch
          echo '6c20c4d435d8fae1d8d7711de9051d6479a241f025f3b66d1082a3fe27beb306  /tmp/focus-carrier.patch' | sha256sum -c -

      - name: Apply and test
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git checkout --detach 5b4e956d023dd42618ccbae9078f42f97300f6c5
          git apply --check /tmp/focus-carrier.patch
          git apply /tmp/focus-carrier.patch
          git diff --check
          CXXFLAGS='-O2 -g' CFLAGS='-O2 -g' ./configure
          make -C src/libcolorscreen -j$(nproc) focus-analysis-unittests
          ./src/libcolorscreen/focus-analysis-unittests
          make -C src/colorscreen -j$(nproc) colorscreen
          ./src/colorscreen/colorscreen --help >/tmp/help.txt 2>&1 || true
          grep -q -- '--sigma-and-defocus' /tmp/help.txt
          grep -q 'process-screen carrier MTF' /tmp/help.txt

      - name: Build portable CLI bundle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/focus-cli/bin /tmp/focus-cli/lib
          bin=src/colorscreen/.libs/colorscreen
          test -x "$bin" || bin=src/colorscreen/colorscreen
          cp -L "$bin" /tmp/focus-cli/bin/colorscreen
          objs=("$bin")
          if test -f src/libcolorscreen/.libs/libcolorscreen.so.2; then
            objs+=(src/libcolorscreen/.libs/libcolorscreen.so.2)
          fi
          for obj in "${objs[@]}"; do
            ldd "$obj" | awk '{for(i=1;i<=NF;i++) if ($i ~ /^\//) {print $i; break}}'
          done | sort -u >/tmp/libs.txt
          while read -r lib; do
            cp -L "$lib" "/tmp/focus-cli/lib/$(basename "$lib")"
          done </tmp/libs.txt
          if test -f src/libcolorscreen/.libs/libcolorscreen.so.2; then
            cp -L src/libcolorscreen/.libs/libcolorscreen.so.2 /tmp/focus-cli/lib/libcolorscreen.so.2
          fi
          cat >/tmp/focus-cli/colorscreen <<'EOF'
          #!/bin/sh
          here=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          export LD_LIBRARY_PATH="$here/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$here/bin/colorscreen" "$@"
          EOF
          chmod +x /tmp/focus-cli/colorscreen
          /tmp/focus-cli/colorscreen --help >/tmp/bundle-help.txt 2>&1 || true
          grep -q -- '--sigma-and-defocus' /tmp/bundle-help.txt

      - name: Upload portable CLI
        uses: actions/upload-artifact@v4
        with:
          name: focus-carrier-cli-arm
          path: /tmp/focus-cli
          retention-days: 3
