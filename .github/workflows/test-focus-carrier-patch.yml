name: Test focus carrier patch

on:
  pull_request:
    branches:
      - agent/tmp-focus-carrier-publish-base

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out transport branch
        uses: actions/checkout@v4
        with:
          ref: agent/tmp-focus-carrier-publish-base
          fetch-depth: 0
      - name: Reconstruct patch
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            '00 0e5154b465a5c4ca68e65d72f2f46fb2b80e400f' \
            '01 0d65721a074723e452d87a73176d1f65cfd9393d' \
            '03 edbfe075b283891dd6be71bf9da9addd493dfa5a' \
            '04 4a956ddb9fbd609ae2feb9d90b069eaf3c4c5911' \
            '05 d3c0e4012db11d06448d98d8339b4c0b1ddf9e8d' \
            '06a d2c137459ea0ef35de4eb9a336922f90410699ac' \
            '06b deb191a0e14bf867342e16ed5e3ff79ccef96b22'; do
            set -- $spec
            test "$(git hash-object agent/focus-carrier-v2-$1.b64)" = "$2"
            cp "agent/focus-carrier-v2-$1.b64" "/tmp/c$1"
          done
          head -c 7800 agent/focus-carrier-v2-02.b64 >/tmp/c02a
          tail -c 7800 agent/focus-carrier-v2-02.b64 >/tmp/c02b
          if test "$(git hash-object /tmp/c02a)" = 58b19fd66748455363105fa37311d5a42dbad4cf; then cp /tmp/c02a /tmp/c02;
          elif test "$(git hash-object /tmp/c02b)" = 58b19fd66748455363105fa37311d5a42dbad4cf; then cp /tmp/c02b /tmp/c02;
          else echo 'chunk 02 mismatch'; exit 1; fi
          cat /tmp/c06a /tmp/c06b >/tmp/c06
          test "$(git hash-object /tmp/c06)" = 5c85bd61ee75392c3587b0fff72376223a92579d
          cat /tmp/c00 /tmp/c01 /tmp/c02 /tmp/c03 /tmp/c04 /tmp/c05 /tmp/c06 | base64 -d >/tmp/focus-carrier.patch
          echo '6c20c4d435d8fae1d8d7711de9051d6479a241f025f3b66d1082a3fe27beb306  /tmp/focus-carrier.patch' | sha256sum -c -
      - name: Apply and diagnose
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git checkout --detach 5b4e956d023dd42618ccbae9078f42f97300f6c5
          git apply --check /tmp/focus-carrier.patch
          git apply /tmp/focus-carrier.patch
          git diff --check
          if ! CXXFLAGS='-O2 -g' CFLAGS='-O2 -g' ./configure >/tmp/config.log 2>&1; then
            echo '=== CONFIGURE FAILURE ==='; tail -100 /tmp/config.log; exit 1
          fi
          if ! make -C src/libcolorscreen -j$(nproc) focus-analysis-unittests >/tmp/build.log 2>&1; then
            echo '=== BUILD FAILURE ==='
            grep -E -C3 'error:|undefined reference|collect2:|make.*Error' /tmp/build.log || true
            tail -120 /tmp/build.log
            exit 1
          fi
          if ! ./src/libcolorscreen/focus-analysis-unittests >/tmp/test.log 2>&1; then
            echo '=== UNIT TEST FAILURE ==='; cat /tmp/test.log; exit 1
          fi
          if ! make -C src/colorscreen -j$(nproc) colorscreen >/tmp/cli-build.log 2>&1; then
            echo '=== CLI BUILD FAILURE ==='
            grep -E -C3 'error:|undefined reference|collect2:|make.*Error' /tmp/cli-build.log || true
            tail -120 /tmp/cli-build.log
            exit 1
          fi
          ./src/colorscreen/colorscreen --help >/tmp/help.txt 2>&1 || true
          grep -q -- '--sigma-and-defocus' /tmp/help.txt
          grep -q 'process-screen carrier MTF' /tmp/help.txt
          echo 'FOCUS CARRIER PATCH VALIDATION PASS'
