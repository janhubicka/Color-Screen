name: Agent rebase flat-field patch

on:
  push:
    branches:
      - agent/qtgui-flat-field-rebase-stage

permissions:
  contents: write

jobs:
  replay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qtgui-flat-field-rebase-stage
          fetch-depth: 0
      - name: Replay reviewed flat-field diff
        run: |
          git fetch origin agent/qtgui-flat-field-one-shot
          git diff ac8b0e0e401cff2a90b927fd822ec44c33f1ad4a..origin/agent/qtgui-flat-field-one-shot -- \
            .agents/qtgui.md \
            doc/qtgui-internal-cleanup.md \
            src/qtgui/FlatFieldWorker.cpp \
            src/qtgui/FlatFieldWorker.h \
            src/qtgui/MainWindow.cpp \
            src/qtgui/MainWindow.h \
            src/qtgui/Makefile.am \
            src/qtgui/Makefile.in \
            src/qtgui/main.cpp > /tmp/flat-field.patch
          git apply --3way /tmp/flat-field.patch
      - name: Check diff
        run: git diff --check
      - name: Check generated build metadata
        run: sh build-aux/check-generated-build-metadata.sh
      - name: Commit replay
        run: |
          rm .github/workflows/agent-rebase-flat-field.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "qtgui: replay flat field on latest main"
          git push origin HEAD:agent/qtgui-flat-field-rebase-stage
