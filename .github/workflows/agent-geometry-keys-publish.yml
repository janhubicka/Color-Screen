name: Agent geometry keys publisher
on:
  push:
    branches: [agent/qtgui-geometry-keys-stage]
    paths: [.github/workflows/agent-geometry-keys-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish exact reviewed geometry-key migration
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 8bcfd47abc8e6b9aa535622348b48a15edf95071
          printf '%s' '' | base64 -d | gzip -d > /tmp/geometry-keys.patch
          test "$(sha256sum /tmp/geometry-keys.patch | cut -d' ' -f1)" = 7d2a2ddbcbd0186438680a168a3610061b8e3cc22ed7025a00252297698df908
          git apply /tmp/geometry-keys.patch
          git diff --check
          sh build-aux/check-generated-build-metadata.sh
          test "$(git hash-object .agents/qtgui.md)" = aba1fef45e3f837be3ef7f0a86f11bd5aae415df
          test "$(git hash-object doc/qtgui-internal-cleanup.md)" = 63fcabae125193169bbf8dc05b8a479807fd14f2
          test "$(git hash-object src/qtgui/GeometryPanel.cpp)" = 3801eb3b46c6017b4a9155248713c1e79ed5ba4f
          test "$(git hash-object src/qtgui/WorkspaceChurnSmoke.cpp)" = 2ada84104e3737bd375d04cf62e53fe7058b32ae
          git config user.name "Jan Hubička"
          git config user.email "46065755+janhubicka@users.noreply.github.com"
          git add .agents/qtgui.md doc/qtgui-internal-cleanup.md src/qtgui/GeometryPanel.cpp src/qtgui/WorkspaceChurnSmoke.cpp
          git commit -m "qtgui: give Geometry controls stable parameter keys"
          test "$(git rev-list --count 8bcfd47abc8e6b9aa535622348b48a15edf95071..HEAD)" = 1
          git push --force origin HEAD:refs/heads/agent/qtgui-geometry-parameter-keys
