name: Publish current release

on:
  workflow_run:
    workflows: ["MacOS build", "Windows build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release-current.yml
      - .github/workflows/build-macos.yml
      - .github/workflows/build-windows.yml
      - .github/scripts/*current*release*
      - .github/CURRENT-RELEASE.md

permissions:
  contents: read

jobs:
  test:
    name: Test release publisher
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test gating, packaging and publication
        run: python3 -m unittest discover -s .github/scripts -p 'test_current_release.py' -v

  publish:
    name: Publish tested main packages
    needs: test
    if: >-
      github.repository == 'janhubicka/Color-Screen' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    # Both platform completion events share one publisher lock. Never cancel
    # a publisher halfway through replacing the rolling release's assets.
    concurrency:
      group: colorscreen-current-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Publisher code is always trusted main, never PR/artifact content.
          ref: main
          persist-credentials: false
      - name: Publish matching successful builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python3 .github/scripts/publish-current-release.py
