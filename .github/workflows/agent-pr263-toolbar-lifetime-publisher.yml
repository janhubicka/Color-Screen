name: Agent PR263 toolbar lifetime publisher

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/tmp-pr263-toolbar-lifetime-20260904'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch PR263 toolbar ownership invariant
        shell: python
        run: |
          import pathlib, subprocess

          target = 'agent/qtgui-workflow-profile-area-selection'
          subprocess.run(['git', 'fetch', 'origin', target], check=True)
          subprocess.run(['git', 'checkout', '-B', 'target', f'origin/{target}'], check=True)

          def replace_exact(path, old, new):
              p = pathlib.Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one guarded match, got {count}')
              p.write_text(text.replace(old, new))

          old = "  takeWorkspaceInspector();\n  if (m_toolbar)\n    m_toolbar->hide();\n  if (menuBar())\n"
          new = (
              "  takeWorkspaceInspector();\n"
              "  // Once this QMainWindow becomes an MDI child its own toolbar-area\n"
              "  // layout must not retain bookkeeping for a toolbar that the workspace\n"
              "  // may reparent. Showing the embedded child after reparenting can\n"
              "  // otherwise make Qt walk a stale QToolBarAreaLayout entry.\n"
              "  if (m_toolbar) {\n"
              "    m_toolbar->hide();\n"
              "    removeToolBar(m_toolbar);\n"
              "  }\n"
              "  if (menuBar())\n"
          )
          replace_exact('src/qtgui/MainWindow.cpp', old, new)

          old = "  if (m_toolbar)\n    m_toolbar->hide();\n  if (menuBar())\n"
          new = (
              "  // Keep the embedded QMainWindow's toolbar-area layout free of\n"
              "  // toolbar entries while WorkspaceWindow owns the presentation.\n"
              "  if (m_toolbar) {\n"
              "    m_toolbar->hide();\n"
              "    removeToolBar(m_toolbar);\n"
              "  }\n"
              "  if (menuBar())\n"
          )
          replace_exact('src/qtgui/ImageViewWindow.cpp', old, new)

          old = (
              "  if (QToolBar *toolbar = document->workspaceToolBar()) {\n"
              "    if (toolbar->parentWidget() == this)\n"
              "      removeToolBar(toolbar);\n"
              "    if (toolbar->parentWidget() != document)\n"
              "      toolbar->setParent(document);\n"
              "    document->addToolBar(Qt::TopToolBarArea, toolbar);\n"
              "    toolbar->setVisible(showInWindow);\n"
              "  }\n"
          )
          new = (
              "  if (QToolBar *toolbar = document->workspaceToolBar()) {\n"
              "    if (toolbar->parentWidget() == this)\n"
              "      removeToolBar(toolbar);\n"
              "    toolbar->hide();\n"
              "    // Do not put an inactive embedded document's toolbar back into its\n"
              "    // private QMainWindowLayout. Re-register it there only when the\n"
              "    // document genuinely becomes a standalone window again.\n"
              "    if (showInWindow) {\n"
              "      if (toolbar->parentWidget() != document)\n"
              "        toolbar->setParent(document);\n"
              "      document->addToolBar(Qt::TopToolBarArea, toolbar);\n"
              "      toolbar->show();\n"
              "    }\n"
              "  }\n"
          )
          replace_exact('src/qtgui/WorkspaceWindow.cpp', old, new)

          old = (
              "  if (QToolBar *toolbar = view->workspaceToolBar()) {\n"
              "    if (auto *owner = qobject_cast<QMainWindow *>(toolbar->parentWidget()))\n"
              "      owner->removeToolBar(toolbar);\n"
              "    view->addToolBar(Qt::TopToolBarArea, toolbar);\n"
              "    toolbar->setVisible(showInWindow);\n"
              "  }\n"
          )
          new = (
              "  if (QToolBar *toolbar = view->workspaceToolBar()) {\n"
              "    if (auto *owner = qobject_cast<QMainWindow *>(toolbar->parentWidget()))\n"
              "      owner->removeToolBar(toolbar);\n"
              "    toolbar->hide();\n"
              "    // Inactive embedded views follow the same toolbar-layout invariant.\n"
              "    if (showInWindow) {\n"
              "      if (toolbar->parentWidget() != view)\n"
              "        toolbar->setParent(view);\n"
              "      view->addToolBar(Qt::TopToolBarArea, toolbar);\n"
              "      toolbar->show();\n"
              "    }\n"
              "  }\n"
          )
          replace_exact('src/qtgui/WorkspaceWindow.cpp', old, new)

          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', 'src/qtgui/MainWindow.cpp', 'src/qtgui/ImageViewWindow.cpp', 'src/qtgui/WorkspaceWindow.cpp'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'OpenAI Agent'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'qtgui: keep embedded toolbars out of child layouts'], check=True)
          subprocess.run(['git', 'push', '--force', 'origin', f'HEAD:{target}'], check=True)
