name: Build Ubuntu CI image

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/ci/ubuntu.Dockerfile"
      - ".github/workflows/build-ubuntu-ci-image.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/ci/ubuntu.Dockerfile"
      - ".github/workflows/build-ubuntu-ci-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build CI image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: .github/ci/ubuntu.Dockerfile
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ghcr.io/${{ github.repository_owner }}/color-screen-ci:ubuntu-24.04
          ghcr.io/${{ github.repository_owner }}/color-screen-ci:ubuntu-24.04-${{ github.sha }}
        cache-from: type=gha,scope=ubuntu-ci-image
        cache-to: type=gha,mode=max,scope=ubuntu-ci-image
