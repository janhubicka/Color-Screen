name: TEMP coupled focus performance

on:
  push:
    branches:
      - agent/tmp-focus-coupled-performance-20260828

permissions:
  contents: read
  packages: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare focused benchmark harness
        shell: bash
        run: |
          set -euxo pipefail
          cp src/libcolorscreen/focus-analysis-unittests.C /tmp/focus-analysis-unittests.C.orig
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/libcolorscreen/focus-analysis-unittests.C')
          s = p.read_text()
          old = '''int
          main ()
          {
            if (!test_joint_focus_analysis ()
                || !test_sky_candidate_budget ()
                || !test_bw_selection_uses_primary_intensities ()
                || !test_bw_multitile_focus ()
                || !test_coupled_physical_focus_recovers_screen_mtf ()
                || !test_grayscale_image_search ())
              return 1;
            printf ("focus-analysis-unittests: PASS\\n");
            return 0;
          }'''
          new = '''int
          main ()
          {
            if (!test_coupled_physical_focus_recovers_screen_mtf ())
              return 1;
            printf ("focus-analysis-coupled-benchmark: PASS\\n");
            return 0;
          }'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY

      - name: Build baseline
        shell: bash
        run: |
          set -euxo pipefail
          CXXFLAGS='-Ofast -march=native -g' CFLAGS="$CXXFLAGS" ./configure
          make -C src/libcolorscreen -j$(nproc) focus-analysis-unittests

      - name: Benchmark baseline slow path
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import subprocess, time
          for i in range(1, 3):
              start = time.perf_counter()
              subprocess.run(['./src/libcolorscreen/focus-analysis-unittests'], check=True)
              print(f'BASELINE_{i} real={time.perf_counter() - start:.6f}', flush=True)
          PY

      - name: Use one direct analytical periodic MTF model
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/libcolorscreen/finetune.C')
          s = p.read_text()
          old = '''    return optimize_scanner_mtf_defocus && !optimize_scanner_mtf_sigma
                     && !optimize_scanner_mtf_channel_defocus && !optimize_strips
                     && focus_screen_cache_eligible_p ()'''
          new = '''    return (optimize_scanner_mtf_defocus || optimize_scanner_mtf_sigma)
                     && !optimize_scanner_mtf_channel_defocus && !optimize_strips
                     && focus_screen_cache_eligible_p ()'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))

          p = Path('src/libcolorscreen/screen.C')
          s = p.read_text()
          old = 'false, profile, &mode))'
          new = 'true, profile, &mode))'
          # One ordinary periodic-screen overload still uses the support/wrap
          # path; the prepared-source overloads already request direct transfer.
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          make -C src/libcolorscreen -j$(nproc) focus-analysis-unittests

      - name: Benchmark unified direct path
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import subprocess, time
          for i in range(1, 4):
              start = time.perf_counter()
              subprocess.run(['./src/libcolorscreen/focus-analysis-unittests'], check=True)
              print(f'DIRECT_{i} real={time.perf_counter() - start:.6f}', flush=True)
          PY

      - name: Run complete focus-analysis regression unchanged
        shell: bash
        run: |
          set -euxo pipefail
          cp /tmp/focus-analysis-unittests.C.orig src/libcolorscreen/focus-analysis-unittests.C
          make -C src/libcolorscreen -j$(nproc) focus-analysis-unittests
          ./src/libcolorscreen/focus-analysis-unittests

      - name: Verify prepared physical transfer with nonzero sigma
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/libcolorscreen/unittests.C')
          s = p.read_text()
          old = ('      physical[c].scanner_mtf.pixel_pitch = 3.76;\n'
                 '      physical[c].scanner_mtf.sensor_fill_factor = 1;\n'
                 '      physical[c].scanner_mtf_scale = (luminosity_t)0.12;')
          new = ('      physical[c].scanner_mtf.pixel_pitch = 3.76;\n'
                 '      physical[c].scanner_mtf.sensor_fill_factor = 1;\n'
                 '      physical[c].scanner_mtf.sigma = (luminosity_t)0.70;\n'
                 '      physical[c].scanner_mtf_scale = (luminosity_t)0.12;')
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          make -C src/libcolorscreen -j$(nproc) unittests
          ./src/libcolorscreen/unittests
