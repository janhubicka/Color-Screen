name: TEMP Paget seed-gate experiment

on:
  push:
    branches:
      - agent/tmp-paget-seed-gate-20260829

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scr-detect-primary-separation
          fetch-depth: 0

      - name: Configure optimized detector build
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          CFLAGS='-O2 -g' CXXFLAGS='-O2 -g' ./configure --disable-gtkgui --disable-qtgui --disable-static-link
          make -C src/libcolorscreen -j2 unittests
          make -C src/colorscreen -j2 colorscreen

      - name: Apply seed-gated lazy Paget map
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/libcolorscreen/scr-detect-geometry.C')
          s = p.read_text()
          old = '''        /* In Paget/Finlay screens, blue patches touch at their corners.\n           The separately materialized class map was intended to enforce\n           boundaries between them, but small blue patches may disappear.\n           Keep both this map and the renderer's original map as candidates.  */\n        if (try_paget_finlay) {\n          detection_stats::time_point stage_start = stats.start_timer();\n          stats.classmap_builds++;\n          std::unique_ptr<color_class_map> new_cmap(new color_class_map);\n          cmap = std::move(new_cmap);\n          cmap->allocate(img.width, img.height);\n          if (progress)\n            progress->set_task("pruning screen", img.height);\n#pragma omp parallel for default(none) shared(progress, img, cmap, render)\n          for (int y = 0; y < img.height; y++) {\n            if (!progress || !progress->cancel_requested())\n              for (int x = 0; x < img.width; x++)\n                cmap->set_class(x, y, render->classify_pixel({x, y}));\n            if (progress)\n              progress->inc_progress();\n          }\n          stats.add_time(&stats.classmap_ms, stage_start);\n          if (progress && progress->cancel_requested()) {\n            stats.result = "cancelled";\n            if (progress)\n              progress->pop();\n            return ret;\n          }\n        }\n'''
          new = '''        /* The Paget/Finlay boundary-pruned map only changes base classes to\n           unknown.  Materialize it only if a seed remains green after the same\n           local pruning rule; otherwise its Paget attempt would fail at the\n           initial patch and the original-map fallback can be tried directly.  */\n        auto ensure_paget_cmap = [&]() -> bool {\n          if (cmap)\n            return true;\n          detection_stats::time_point stage_start = stats.start_timer();\n          stats.classmap_builds++;\n          cmap = std::make_unique<color_class_map>();\n          cmap->allocate(img.width, img.height);\n          if (progress)\n            progress->set_task("pruning screen", img.height);\n#pragma omp parallel for default(none) shared(progress, img, cmap, render)\n          for (int y = 0; y < img.height; y++) {\n            if (!progress || !progress->cancel_requested())\n              for (int x = 0; x < img.width; x++)\n                cmap->set_class(x, y, render->classify_pixel({x, y}));\n            if (progress)\n              progress->inc_progress();\n          }\n          stats.add_time(&stats.classmap_ms, stage_start);\n          if (progress && progress->cancel_requested()) {\n            cmap.reset();\n            stats.result = "cancelled";\n            return false;\n          }\n          return true;\n        };\n'''
          if s.count(old) != 1:
              raise SystemExit(f'map block count {s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''              } else if (try_paget_finlay &&\n                         try_guess_paget_screen(\n                             report_file,\n                             cmap ? *cmap : *render->get_color_class_map(),\n                             sparam, x, y, &visited_paget)) {\n                current_type = type == Finlay ? Finlay : Paget;\n                this_cmap = cmap ? cmap.get() : render->get_color_class_map();\n              } else if (try_paget_finlay && cmap &&\n                         try_guess_paget_screen(\n                             report_file, *render->get_color_class_map(),\n                             sparam, x, y, &visited_paget2)) {\n                current_type = type == Finlay ? Finlay : Paget;\n                this_cmap = render->get_color_class_map();\n              }\n'''
          new = '''              } else if (try_paget_finlay &&\n                         render->get_color_class_map()->get_class(x, y) ==\n                             scr_detect::green) {\n                const bool pruned_seed_green =\n                    render->classify_pixel({x, y}) == scr_detect::green;\n                if (pruned_seed_green && ensure_paget_cmap() &&\n                    try_guess_paget_screen(report_file, *cmap, sparam, x, y,\n                                           &visited_paget)) {\n                  current_type = type == Finlay ? Finlay : Paget;\n                  this_cmap = cmap.get();\n                } else if ((!progress || !progress->cancel_requested()) &&\n                           try_guess_paget_screen(\n                               report_file, *render->get_color_class_map(),\n                               sparam, x, y, &visited_paget2)) {\n                  current_type = type == Finlay ? Finlay : Paget;\n                  this_cmap = render->get_color_class_map();\n                }\n              }\n'''
          if s.count(old) != 1:
              raise SystemExit(f'candidate block count {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          make -C src/libcolorscreen -j2 unittests
          make -C src/colorscreen -j2 colorscreen
          ./src/libcolorscreen/unittests discovery

      - name: Probe real Dufay class-map demand
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/paget-seed-gate
          python3 testsuite/benchmark-screen-detection.py \
            --colorscreen ./src/colorscreen/colorscreen --threads 4 \
            --screen-type Dufay --scanner-type fixed-lens --gamma 1 \
            --mode legacy-2-3,2,3,both --mode unsharpened-0-0,0,0,both \
            --csv /tmp/paget-seed-gate/result.csv \
            --output-dir /tmp/paget-seed-gate/output \
            testsuite/dufaycolor_nikon_coolsan9000ED_4000DPI_raw.tif
          cat /tmp/paget-seed-gate/result.csv
          python3 - <<'PY'
          import csv
          rows = list(csv.DictReader(open('/tmp/paget-seed-gate/result.csv', newline='')))
          for row in rows:
              print(row['mode'], 'classmap_builds=', row['classmap_builds'],
                    'classmap_ms=', row['classmap_ms'],
                    'total_ms=', row['detector_total_ms'])
              if row['success'] != '1' or row['type'] != 'Dufay':
                  raise SystemExit('real Dufay detection behavior changed')
          PY
