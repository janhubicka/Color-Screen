name: TEMP validate and publish coupled MTF fast path

on:
  push:
    branches:
      - agent/tmp-coupled-mtf-fastpath-publisher-20260829

permissions:
  contents: write
  packages: read

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      PATH: /usr/lib/qt6/libexec:/usr/lib/x86_64-linux-gnu/qt6/libexec:/usr/lib/qt6/bin:/usr/lib/x86_64-linux-gnu/qt6/bin:/usr/lib64/qt6/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      CC: "ccache gcc"
      CXX: "ccache g++"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stage patch scripts and select exact main
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cp agent/apply-coupled-mtf-fastpath.py /tmp/apply-fast.py
          cp agent/try-raw-coupled-seeds.py /tmp/apply-seeds.py
          cp agent/apply-effective-screen-mtf.py /tmp/apply-effective.py
          git fetch origin main
          git checkout --detach origin/main
          VALIDATION_BASE="$(git rev-parse HEAD)"
          echo "VALIDATION_BASE=$VALIDATION_BASE" | tee -a "$GITHUB_ENV"
      - name: Configure optimized build
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          export CXXFLAGS="-Ofast -flto=auto"
          export CFLAGS="$CXXFLAGS"
          ./configure --enable-qtgui
      - name: Build and time baseline focus regression
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          make -C src/libcolorscreen -j"$(nproc)" focus-analysis-unittests
          python3 - <<'PY'
          import subprocess, sys, time
          t=time.perf_counter()
          r=subprocess.run(["./src/libcolorscreen/focus-analysis-unittests"])
          print(f"BASELINE_SECONDS={time.perf_counter()-t:.6f}", flush=True)
          sys.exit(r.returncode)
          PY
      - name: Apply production patch
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 /tmp/apply-fast.py
          python3 /tmp/apply-seeds.py
          python3 /tmp/apply-effective.py
          git diff --check
          git diff --stat
      - name: Build patched tree
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          make -j"$(nproc)"
      - name: Run focused and low-level regressions
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import subprocess, sys, time
          t=time.perf_counter()
          r=subprocess.run(["./src/libcolorscreen/focus-analysis-unittests"])
          print(f"OPTIMIZED_SECONDS={time.perf_counter()-t:.6f}", flush=True)
          sys.exit(r.returncode)
          PY
          ./src/libcolorscreen/unittests
          ./src/colorscreen/colorscreen analyze-focus-areas --help | grep -q -- '--sigma-defocus'
      - name: Publish exact validated source tree
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard "$VALIDATION_BASE"
          git clean -fdx
          git checkout -B agent/focus-coupled-mtf-fastpath "$VALIDATION_BASE"
          python3 /tmp/apply-fast.py
          python3 /tmp/apply-seeds.py
          python3 /tmp/apply-effective.py
          git diff --check
          expected="$(cat <<'EOF' | sort
          src/colorscreen/colorscreen.C
          src/libcolorscreen/finetune-int.h
          src/libcolorscreen/finetune.C
          src/libcolorscreen/focus-analysis-unittests.C
          src/libcolorscreen/focus-analysis.C
          src/libcolorscreen/include/focus-analysis.h
          src/libcolorscreen/mtf.C
          src/libcolorscreen/mtf.h
          src/libcolorscreen/screen.C
          src/libcolorscreen/unittests.C
          src/qtgui/MainWindow.cpp
          src/qtgui/SharpnessPanel.cpp
          EOF
          )"
          actual="$(git diff --name-only | sort)"
          printf 'Expected changed files:\n%s\nActual changed files:\n%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          git add $actual
          git commit -m "finetune: reuse physical transfer for coupled MTF fits" \
            -m "Factor residual Gaussian sigma out of the prepared physical-transfer cache so fixed-source sigma and sigma+defocus fits reuse source spectra and the direct signed periodic OTF path instead of rebuilding PSFs and kernel FFTs at simplex vertices. Preserve nonzero cold physical-defocus starts in direct coupled competition before one-dimensional staging can collapse them back to the boundary. Keep the shared pixel objective authoritative. Report Paget/Finlay effective process-screen transfer as the ideal-screen-power-weighted RMS over both dominant diagonal and axial carrier families, while retaining the nominal carrier frequency for orientation. Extend the synthetic physical regression and transfer-cache profiling checks without weakening the cold/warm tolerance."
          git push --force-with-lease origin HEAD:agent/focus-coupled-mtf-fastpath
