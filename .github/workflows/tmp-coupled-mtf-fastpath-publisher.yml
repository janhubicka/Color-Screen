name: TEMP coupled MTF fast-path publisher

on:
  push:
    branches:
      - agent/tmp-coupled-mtf-fastpath-publisher-20260829

permissions:
  contents: write
  packages: read

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      PATH: /usr/lib/qt6/libexec:/usr/lib/x86_64-linux-gnu/qt6/libexec:/usr/lib/qt6/bin:/usr/lib/x86_64-linux-gnu/qt6/bin:/usr/lib64/qt6/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      CC: "ccache gcc"
      CXX: "ccache g++"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure optimized build
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          export CXXFLAGS="-Ofast -flto=auto"
          export CFLAGS="$CXXFLAGS"
          ./configure --enable-qtgui
      - name: Build baseline focus test
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          make -C src/libcolorscreen -j"$(nproc)" focus-analysis-unittests
      - name: Benchmark baseline coupled focus regression
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import subprocess
          import sys
          import time
          start = time.perf_counter()
          result = subprocess.run(["./src/libcolorscreen/focus-analysis-unittests"])
          elapsed = time.perf_counter() - start
          print(f"BASELINE_SECONDS={elapsed:.6f}", flush=True)
          sys.exit(result.returncode)
          PY
      - name: Apply exact coupled fast path
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          cp agent/apply-coupled-mtf-fastpath.py /tmp/apply-coupled-mtf-fastpath.py
          git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel
          python3 /tmp/apply-coupled-mtf-fastpath.py
          pwd
          ls -ld "$GITHUB_WORKSPACE/.git"
          git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel
          git -C "$GITHUB_WORKSPACE" diff --check
          git -C "$GITHUB_WORKSPACE" diff --stat
      - name: Build optimized code
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          make -C src/libcolorscreen -j"$(nproc)" focus-analysis-unittests unittests
      - name: Benchmark optimized coupled focus regression
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import subprocess
          import sys
          import time
          start = time.perf_counter()
          result = subprocess.run(["./src/libcolorscreen/focus-analysis-unittests"])
          elapsed = time.perf_counter() - start
          print(f"OPTIMIZED_SECONDS={elapsed:.6f}", flush=True)
          sys.exit(result.returncode)
          PY
      - name: Run low-level transfer regressions
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          ./src/libcolorscreen/unittests
      - name: Publish clean source branch
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "OpenAI Agent"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" fetch origin main
          git -C "$GITHUB_WORKSPACE" checkout -B agent/focus-coupled-mtf-fastpath origin/main
          python3 /tmp/apply-coupled-mtf-fastpath.py
          git -C "$GITHUB_WORKSPACE" diff --check
          expected="$(cat <<'EOF' | sort
          src/libcolorscreen/finetune.C
          src/libcolorscreen/focus-analysis-unittests.C
          src/libcolorscreen/mtf.C
          src/libcolorscreen/mtf.h
          src/libcolorscreen/screen.C
          src/libcolorscreen/unittests.C
          EOF
          )"
          actual="$(git -C "$GITHUB_WORKSPACE" diff --name-only | sort)"
          printf 'Expected changed files:\n%s\nActual changed files:\n%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          git -C "$GITHUB_WORKSPACE" add \
            src/libcolorscreen/finetune.C \
            src/libcolorscreen/focus-analysis-unittests.C \
            src/libcolorscreen/mtf.C \
            src/libcolorscreen/mtf.h \
            src/libcolorscreen/screen.C \
            src/libcolorscreen/unittests.C
          git -C "$GITHUB_WORKSPACE" commit -m "finetune: reuse physical transfer for coupled MTF fits" \
            -m "Factor residual Gaussian sigma out of the prepared physical-transfer cache so fixed-source sigma and sigma+defocus fits can reuse the source spectra and direct periodic OTF path. Preserve the exact signed physical model and broad-halo semantics while avoiding repeated PSF construction and kernel FFTs at simplex vertices. Extend transfer-equivalence and coupled-focus profiling regressions."
          git -C "$GITHUB_WORKSPACE" push --force-with-lease origin HEAD:agent/focus-coupled-mtf-fastpath
