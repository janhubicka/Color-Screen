name: TEMP coupled MTF fast-path publisher

on:
  push:
    branches:
      - agent/tmp-coupled-mtf-fastpath-publisher-20260829

permissions:
  packages: read

jobs:
  report-paget-spectrum:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      PATH: /usr/lib/qt6/libexec:/usr/lib/x86_64-linux-gnu/qt6/libexec:/usr/lib/qt6/bin:/usr/lib/x86_64-linux-gnu/qt6/bin:/usr/lib64/qt6/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      CC: "ccache gcc"
      CXX: "ccache g++"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply spectrum diagnostic to current main
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cp agent/report-paget-spectrum.py /tmp/report.py
          git fetch origin main
          git checkout --detach origin/main
          python3 /tmp/report.py
          git diff --check
      - name: Configure
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          export CXXFLAGS="-Ofast -flto=auto"
          export CFLAGS="$CXXFLAGS"
          ./configure --enable-qtgui
      - name: Build and report
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          make -C src/libcolorscreen -j"$(nproc)" focus-analysis-unittests
          ./src/libcolorscreen/focus-analysis-unittests || true
