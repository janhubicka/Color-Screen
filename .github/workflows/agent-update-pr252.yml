name: Agent update PR252

on:
  push:
    branches:
      - agent/render-dispatch-smoke

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/render-dispatch-smoke
          fetch-depth: 0

      - name: Apply focused PR252 follow-up
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/qtgui/main.cpp",
              "// monochrome checkerboard is a plain positive capture used only for\n"
              "        // modes that remain applicable without RGB screen detection.",
              "// monochrome checkerboard is an ordinary no-screen image used only for\n"
              "        // modes that remain applicable without RGB screen detection.")
          replace_once(
              "src/qtgui/main.cpp",
              ": colorscreen::render_parameters::capture_transparency;",
              ": colorscreen::render_parameters::capture_plain_image;")

          replace_once(
              ".github/workflows/sanitizers.yml",
              "        # The renderer sweep now covers every GUI mode for RGB and monochrome\n"
              "        # images in both coordinate spaces. Give the sanitized Windows build\n"
              "        # enough time for that real work while keeping the watchdog bounded.\n"
              "        run_asan_smoke detached-views 360 \\",
              "        # The renderer sweep performs synchronous renderer precomputation for\n"
              "        # every GUI mode in both coordinate spaces. Windows clang64 ASan can\n"
              "        # spend well over six minutes doing that real work, so keep both the\n"
              "        # application and process watchdogs bounded but give them a realistic\n"
              "        # budget.\n"
              "        run_asan_smoke detached-views 900 \\")
          replace_once(
              ".github/workflows/sanitizers.yml",
              "            --smoke-test 150000 --smoke-test-expect-windows 2 \\\n"
              "            --smoke-test-new-view --smoke-test-slanted-reference \\",
              "            --smoke-test 720000 --smoke-test-expect-windows 2 \\\n"
              "            --smoke-test-new-view --smoke-test-slanted-reference \\")
          PY

          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' .github/workflows/sanitizers.yml src/qtgui/main.cpp | sort)"
          if test "$changed" != "$expected"; then
            echo "Unexpected changed files:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          git diff -- .github/workflows/sanitizers.yml src/qtgui/main.cpp

      - name: Commit focused follow-up
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/sanitizers.yml src/qtgui/main.cpp
          git commit -m "qtgui: align smoke semantics and Windows ASan budget"
          echo "PRODUCT_SHA=$(git rev-parse HEAD)"
          git push origin HEAD:agent/render-dispatch-smoke
