name: Agent update PR252 readiness

on:
  push:
    branches:
      - agent/render-dispatch-smoke

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/render-dispatch-smoke
          fetch-depth: 0

      - name: Make New View smoke wait for loaded fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/qtgui/main.cpp",
              "  if (parser.isSet(newViewOption)) {\n"
              "    QTimer::singleShot(300, &app,\n"
              "                       [&app, newViewSmokeDone, maybeFinishStructuredSmoke]() {\n",
              "  if (parser.isSet(newViewOption)) {\n"
              "    auto startNewViewSmoke = std::make_shared<std::function<void(int)>>();\n"
              "    const std::weak_ptr<std::function<void(int)>> weakStartNewViewSmoke =\n"
              "        startNewViewSmoke;\n"
              "    *startNewViewSmoke =\n"
              "        [&app, newViewSmokeDone, maybeFinishStructuredSmoke,\n"
              "         weakStartNewViewSmoke](int attemptsLeft) {\n")

          replace_once(
              "src/qtgui/main.cpp",
              "      if (documents.size() < 2) {\n"
              "        qCritical() << \"New View render-mode smoke requires RGB and monochrome \"\n"
              "                       \"documents\";\n"
              "        app.exit(14);\n"
              "        return;\n"
              "      }\n\n",
              "")

          replace_once(
              "src/qtgui/main.cpp",
              "      if (!source || !monochromeSource) {\n"
              "        qCritical() << \"New View render-mode smoke did not receive both RGB \"\n"
              "                       \"and monochrome scans\";\n"
              "        app.exit(14);\n"
              "        return;\n"
              "      }\n",
              "      if (!source || !monochromeSource) {\n"
              "        if (attemptsLeft > 0) {\n"
              "          if (auto retry = weakStartNewViewSmoke.lock()) {\n"
              "            QTimer::singleShot(100, &app, [retry, attemptsLeft]() {\n"
              "              (*retry)(attemptsLeft - 1);\n"
              "            });\n"
              "            return;\n"
              "          }\n"
              "        }\n"
              "        qCritical() << \"New View render-mode smoke timed out waiting for both \"\n"
              "                       \"RGB and monochrome scans to finish loading\";\n"
              "        app.exit(14);\n"
              "        return;\n"
              "      }\n")

          replace_once(
              "src/qtgui/main.cpp",
              "      QTimer::singleShot(0, &app, [checkFinalPeerClose]() {\n"
              "        (*checkFinalPeerClose)(40);\n"
              "      });\n"
              "    });\n"
              "  }\n\n"
              "  if (parser.isSet(workspaceChurnOption)) {\n",
              "      QTimer::singleShot(0, &app, [checkFinalPeerClose]() {\n"
              "        (*checkFinalPeerClose)(40);\n"
              "      });\n"
              "    };\n"
              "    QTimer::singleShot(0, &app, [startNewViewSmoke]() {\n"
              "      (*startNewViewSmoke)(300);\n"
              "    });\n"
              "  }\n\n"
              "  if (parser.isSet(workspaceChurnOption)) {\n")
          PY

          rm .github/workflows/agent-update-pr252.yml
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' .github/workflows/agent-update-pr252.yml src/qtgui/main.cpp | sort)"
          if test "$changed" != "$expected"; then
            echo "Unexpected changed files:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          git diff -- src/qtgui/main.cpp

      - name: Commit readiness fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "qtgui: wait for render smoke fixtures to load"
          git push origin HEAD:agent/render-dispatch-smoke
