name: TEMP publish QtGUI patch centers

on:
  push:
    branches:
      - agent/tmp-publish-qtgui-patch-centers-20260905
    paths:
      - .github/workflows/tmp-publish-qtgui-patch-centers.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve reviewed patches
        run: |
          cp .tmp/ImageWidget.cpp.patch /tmp/ImageWidget.cpp.patch
          cp .tmp/ImageWidget.h.patch /tmp/ImageWidget.h.patch
          cp .tmp/MainWindow.cpp.patch /tmp/MainWindow.cpp.patch
          cp .tmp/MainWindow.h.patch /tmp/MainWindow.h.patch
          cp .tmp/main.cpp.patch /tmp/main.cpp.patch
      - name: Apply reviewed patches to clean feature branch
        run: |
          git fetch origin agent/qtgui-detected-patch-centers
          git checkout agent/qtgui-detected-patch-centers
          for patch in \
            /tmp/ImageWidget.cpp.patch \
            /tmp/ImageWidget.h.patch \
            /tmp/MainWindow.cpp.patch \
            /tmp/MainWindow.h.patch \
            /tmp/main.cpp.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          git diff --check
          test "$(git status --short | wc -l)" -eq 5
      - name: Commit and push
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/qtgui/ImageWidget.cpp src/qtgui/ImageWidget.h \
                  src/qtgui/MainWindow.cpp src/qtgui/MainWindow.h src/qtgui/main.cpp
          git commit -m "qtgui: show auto-detected patch centers" -m "Retain the screen_map returned by basic-screen autodetection and expose the old GTK diagnostic in Qt's Registration menu. Draw color-coded centers of detected connected components at 100% zoom and above, limiting traversal to the visible map neighborhood. Keep the overlay synchronized across ordinary views and clean up discarded detector maps. Extend the New View smoke check for the shared menu action."
          git push origin HEAD:agent/qtgui-detected-patch-centers
