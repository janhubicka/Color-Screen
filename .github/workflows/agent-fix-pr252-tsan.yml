name: Agent fix PR252 TSan race

on:
  push:
    branches:
      - agent/render-dispatch-smoke

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/render-dispatch-smoke
          fetch-depth: 0

      - name: Remove cross-thread Renderer parameter mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub(path, pattern, replacement, count=1, flags=0):
              p = Path(path)
              text = p.read_text()
              new, n = re.subn(pattern, replacement, text, count=count, flags=flags)
              if n != count:
                  raise SystemExit(f"{path}: pattern matched {n}, expected {count}: {pattern}")
              p.write_text(new)

          # Renderer owns only immutable queued request snapshots. The GUI must
          # never mutate QObject members while the renderer thread may destroy it.
          sub("src/qtgui/Renderer.h",
              r'''    explicit Renderer\(std::shared_ptr<colorscreen::image_data> scan,\n(?:                      .*\n){4}''',
              '''    explicit Renderer(std::shared_ptr<colorscreen::image_data> scan);\n''')
          sub("src/qtgui/Renderer.h",
              r'''    bool enqueueRender\(int reqId, double xOffset, double yOffset, double scale,\n                       int width, int height, int coordinateSpace,\n                       const colorscreen::render_parameters &frameParams,\n                       std::shared_ptr<colorscreen::progress_info> progress,\n                       const char \*taskName = nullptr\);''',
              '''    bool enqueueRender(int reqId, double xOffset, double yOffset, double scale,\n                       int width, int height, int coordinateSpace,\n                       const colorscreen::render_parameters &frameParams,\n                       const colorscreen::scr_to_img_parameters &scrToImg,\n                       const colorscreen::scr_detect_parameters &scrDetect,\n                       const colorscreen::render_type_parameters &renderType,\n                       std::shared_ptr<colorscreen::progress_info> progress,\n                       const char *taskName = nullptr);''')
          sub("src/qtgui/Renderer.h",
              r'''\n    /\*\* Thread-safe update of the renderer's cached parameter snapshot\. \*/\n    void updateParameters\(const colorscreen::render_parameters &rparams,\n                          const colorscreen::scr_to_img_parameters &scrToImg,\n                          const colorscreen::scr_detect_parameters &scrDetect,\n                          const colorscreen::render_type_parameters &renderType\);\n''',
              '\n')
          sub("src/qtgui/Renderer.h",
              r'''    // Protect both cached renderer state and the cross-thread request handoff\.\n    mutable std::mutex m_mutex;\n    colorscreen::render_parameters m_rparams;\n    colorscreen::scr_to_img_parameters m_scrToImg;\n    colorscreen::scr_detect_parameters m_scrDetect;\n    colorscreen::render_type_parameters m_renderType;\n    std::unordered_map<int, RenderRequest> m_pendingRenders;''',
              '''    // Protect the cross-thread request handoff. Parameter snapshots become\n    // immutable once inserted, so the GUI thread never mutates Renderer state.\n    mutable std::mutex m_mutex;\n    std::unordered_map<int, RenderRequest> m_pendingRenders;''')

          sub("src/qtgui/Renderer.cpp",
              r'''Renderer::Renderer\(std::shared_ptr<colorscreen::image_data> scan,\n                   const colorscreen::render_parameters &rparams,\n                   const colorscreen::scr_to_img_parameters &scrToImg,\n                   const colorscreen::scr_detect_parameters &scrDetect,\n                   const colorscreen::render_type_parameters &renderType\)\n    : m_scan\(scan\), m_rparams\(rparams\), m_scrToImg\(scrToImg\),\n      m_scrDetect\(scrDetect\), m_renderType\(renderType\)''',
              '''Renderer::Renderer(std::shared_ptr<colorscreen::image_data> scan)\n    : m_scan(std::move(scan))''')
          sub("src/qtgui/Renderer.cpp",
              r'''    int height, int coordinateSpace,\n    const colorscreen::render_parameters &frameParams,\n    std::shared_ptr<colorscreen::progress_info> progress, const char \*taskName\)''',
              '''    int height, int coordinateSpace,\n    const colorscreen::render_parameters &frameParams,\n    const colorscreen::scr_to_img_parameters &scrToImg,\n    const colorscreen::scr_detect_parameters &scrDetect,\n    const colorscreen::render_type_parameters &renderType,\n    std::shared_ptr<colorscreen::progress_info> progress, const char *taskName)''')
          sub("src/qtgui/Renderer.cpp",
              r'''    request\.coordinateSpace = coordinateSpace;\n    request\.frameParams = frameParams;\n    request\.progress = std::move\(progress\);''',
              '''    request.coordinateSpace = coordinateSpace;\n    request.frameParams = frameParams;\n    request.scrToImg = scrToImg;\n    request.scrDetect = scrDetect;\n    request.renderType = renderType;\n    request.progress = std::move(progress);''')
          sub("src/qtgui/Renderer.cpp",
              r'''        // Snapshot the cached renderer state together with the request\.  A\n        // later GUI update must not overtake an already-enqueued frame and mix\n        // parameter generations before the renderer thread consumes its id\.\n        request\.scrToImg = m_scrToImg;\n        request\.scrDetect = m_scrDetect;\n        request\.renderType = m_renderType;\n''',
              '')
          sub("src/qtgui/Renderer.cpp",
              r'''void\nRenderer::updateParameters\(.*?\n\}\n\nvoid Renderer::finishRenderTask\(\)''',
              '''void Renderer::finishRenderTask()''', flags=re.S)

          sub("src/qtgui/ImageWidget.h",
              r'''  struct RenderRequestData \{\n    double xOffset;\n    double yOffset;\n    double scale;\n    int w;\n    int h;\n    colorscreen::render_parameters params;\n  \};''',
              '''  struct RenderRequestData {\n    double xOffset;\n    double yOffset;\n    double scale;\n    int w;\n    int h;\n    int coordinateSpace;\n    colorscreen::render_parameters params;\n    colorscreen::scr_to_img_parameters scrToImg;\n    colorscreen::scr_detect_parameters scrDetect;\n    colorscreen::render_type_parameters renderType;\n  };''')
          sub("src/qtgui/ImageWidget.cpp",
              r'''    m_renderThread = new QThread\(this\);\n    static colorscreen::scr_to_img_parameters defaultScrToImg;\n    static colorscreen::scr_detect_parameters defaultScrDetect;\n    static colorscreen::render_type_parameters defaultRenderType;\n\n    m_renderer = new Renderer\(m_scan, \*m_rparams,\n                              m_scrToImg \? \*m_scrToImg : defaultScrToImg,\n                              m_scrDetect \? \*m_scrDetect : defaultScrDetect,\n                              m_renderType \? \*m_renderType : defaultRenderType\);''',
              '''    m_renderThread = new QThread(this);\n    m_renderer = new Renderer(m_scan);''')
          sub("src/qtgui/ImageWidget.cpp",
              r'''\n  // Update renderer's cached parameters if it exists\n  if \(m_renderer\) \{\n    m_renderer->updateParameters\(.*?\n  \}\n''',
              '\n', flags=re.S)
          sub("src/qtgui/ImageWidget.cpp",
              r'''    data\.h = reqH;\n    data\.params = \*m_rparams;''',
              '''    data.h = reqH;\n    data.coordinateSpace = (int)m_coordinateSpace;\n    data.params = *m_rparams;\n    data.scrToImg = m_scrToImg ? *m_scrToImg\n                               : colorscreen::scr_to_img_parameters();\n    data.scrDetect = m_scrDetect ? *m_scrDetect\n                                 : colorscreen::scr_detect_parameters();\n    data.renderType = m_renderType ? *m_renderType\n                                   : colorscreen::render_type_parameters();''')
          sub("src/qtgui/ImageWidget.cpp",
              r'''        reqId, data\.xOffset, data\.yOffset, data\.scale, data\.w, data\.h,\n        \(int\)m_coordinateSpace, data\.params, progress, "Rendering image"\);''',
              '''        reqId, data.xOffset, data.yOffset, data.scale, data.w, data.h,\n        data.coordinateSpace, data.params, data.scrToImg, data.scrDetect,\n        data.renderType, progress, "Rendering image");''')

          sub("src/qtgui/NavigationView.h",
              r'''    struct RenderRequestData \{\n      int width;\n      int height;\n      colorscreen::render_parameters params;\n    \};''',
              '''    struct RenderRequestData {\n      int width;\n      int height;\n      int coordinateSpace;\n      colorscreen::render_parameters params;\n      colorscreen::scr_to_img_parameters scrToImg;\n      colorscreen::scr_detect_parameters scrDetect;\n      colorscreen::render_type_parameters renderType;\n    };''')
          sub("src/qtgui/NavigationView.cpp",
              r'''    m_renderThread = new QThread\(this\);\n    static colorscreen::scr_to_img_parameters defaultScrToImg;\n    static colorscreen::scr_detect_parameters defaultScrDetect;\n\n    m_renderer = new Renderer\(\n        m_scan, \*m_rparams, m_scrToImg \? \*m_scrToImg : defaultScrToImg,\n        m_scrDetect \? \*m_scrDetect : defaultScrDetect, m_renderType\);''',
              '''    m_renderThread = new QThread(this);\n    m_renderer = new Renderer(m_scan);''')
          sub("src/qtgui/NavigationView.cpp",
              r'''\n  if \(m_renderer\) \{\n    m_renderer->updateParameters\(.*?\n  \}\n''',
              '\n', flags=re.S)

          p = Path("src/qtgui/NavigationView.cpp")
          text = p.read_text()
          def expand(match):
              indent, expr = match.group(1), match.group(2)
              return (f"{indent}data.params = {expr};\n"
                      f"{indent}data.scrToImg = m_scrToImg ? *m_scrToImg\n"
                      f"{indent}                           : colorscreen::scr_to_img_parameters();\n"
                      f"{indent}data.scrDetect = m_scrDetect ? *m_scrDetect\n"
                      f"{indent}                             : colorscreen::scr_detect_parameters();\n"
                      f"{indent}data.renderType = m_renderType;\n"
                      f"{indent}data.coordinateSpace = (int)m_coordinateSpace;")
          text, n = re.subn(r'^(\s*)data\.params = (\*m_rparams|m_rparams \? \*m_rparams : colorscreen::render_parameters\(\));$', expand, text, flags=re.M)
          if n != 4:
              raise SystemExit(f"NavigationView.cpp: expanded {n} request snapshots, expected 4")
          p.write_text(text)

          sub("src/qtgui/NavigationView.cpp",
              r'''    CoordinateTransformer transformer\(m_scan\.get\(\), data\.params, m_scrToImg, m_coordinateSpace\);''',
              '''    CoordinateTransformer transformer(\n        m_scan.get(), data.params, &data.scrToImg,\n        static_cast<colorscreen::render_coordinate_space>(data.coordinateSpace));''')
          sub("src/qtgui/NavigationView.cpp",
              r'''        reqId, 0\.0, 0\.0, scale, targetW, targetH, \(int\)m_coordinateSpace,\n        data\.params, progress, "Rendering navigation"\);''',
              '''        reqId, 0.0, 0.0, scale, targetW, targetH, data.coordinateSpace,\n        data.params, data.scrToImg, data.scrDetect, data.renderType, progress,\n        "Rendering navigation");''')

          # Transport helper must disappear from the product commit.
          Path(".github/workflows/agent-fix-pr252-tsan.yml").unlink()
          PY

          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/agent-fix-pr252-tsan.yml \
            src/qtgui/ImageWidget.cpp src/qtgui/ImageWidget.h \
            src/qtgui/NavigationView.cpp src/qtgui/NavigationView.h \
            src/qtgui/Renderer.cpp src/qtgui/Renderer.h | sort)"
          test "$changed" = "$expected" || { echo "$changed"; exit 1; }

          ! grep -R "m_renderer->updateParameters" -n src/qtgui
          ! grep -R "Renderer::updateParameters" -n src/qtgui
          test "$(grep -R "new Renderer(m_scan)" -n src/qtgui | wc -l)" -eq 2
          test "$(grep -R "data.scrToImg" -n src/qtgui/ImageWidget.cpp src/qtgui/NavigationView.cpp | wc -l)" -ge 7

      - name: Commit renderer handoff fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "qtgui: snapshot renderer parameters per request"
          git push origin HEAD:agent/render-dispatch-smoke
