name: Agent apply parameter applicability

on:
  push:
    branches:
      - agent/apply-parameter-applicability

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: agent/qtgui-parameter-applicability
          path: target
          fetch-depth: 0
      - name: Checkout helper patch
        uses: actions/checkout@v4
        with:
          ref: agent/apply-parameter-applicability
          path: helper
          fetch-depth: 1
      - name: Apply and publish reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat helper/agent/chunks/00 \
              helper/agent/chunks/01 \
              helper/agent/chunks/02 \
              helper/agent/chunks/03 \
              helper/agent/chunks/04 \
              helper/agent/chunks/05 \
              helper/agent/chunks/06 > /tmp/parameter-applicability.patch.b64
          base64 -d /tmp/parameter-applicability.patch.b64 > /tmp/parameter-applicability.patch
          actual_sha="$(sha256sum /tmp/parameter-applicability.patch | cut -d' ' -f1)"
          test "$actual_sha" = "5b5d2e4d7b91f33bbe3b20a4d9a6b40bf4b52f5c421d421f32554bc2679354e2"
          cd target
          git apply --check /tmp/parameter-applicability.patch
          git apply /tmp/parameter-applicability.patch
          git diff --check
          git config user.name "Jan Hubička"
          git config user.email "46065755+janhubicka@users.noreply.github.com"
          git add doc/qtgui-internal-cleanup.md \
                  src/qtgui/ParameterPanel.cpp \
                  src/qtgui/ParameterPanel.h \
                  src/qtgui/ScreenPanel.cpp \
                  src/qtgui/SharpnessPanel.cpp \
                  src/qtgui/WorkspaceChurnSmoke.cpp
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          git commit -m "qtgui: separate applicability from enablement" -m "Introduce ParameterPanel::setParameterApplicability() so panels can hide rows whose concepts do not apply without overloading enabled/prerequisite predicates. Compose row applicability with collapsible-section state so expanding a section cannot resurrect logically unavailable controls.\n\nMigrate Screen pattern preview/strip rows away from their panel-specific visibility workaround and migrate Sharpness measured-MTF controls so measurement existence determines applicability while fit-running/document prerequisites determine enablement. Add stable object names and extend the workspace churn smoke test to exercise collapse/expand with applicability metadata.\n\nUpdate the beta cleanup tracker to record the new framework seam. No rendering, parameter serialization, or workflow-summary behavior changes."
          git push origin HEAD:agent/qtgui-parameter-applicability
