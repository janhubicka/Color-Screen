name: Agent apply parameter applicability

on:
  push:
    branches:
      - agent/apply-parameter-applicability

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: agent/qtgui-parameter-applicability
          path: target
          fetch-depth: 0
      - name: Restore direct QFormLayout include
        shell: bash
        run: |
          set -euo pipefail
          cd target
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/qtgui/ScreenPanel.cpp")
          text = path.read_text()
          include = "#include <QFormLayout>\n"
          if include not in text:
              marker = "#include <QComboBox>\n"
              if marker not in text:
                  raise SystemExit("ScreenPanel include insertion point not found")
              text = text.replace(marker, marker + include, 1)
              path.write_text(text)
          PY
          git diff --check
          git config user.name "Jan Hubička"
          git config user.email "46065755+janhubicka@users.noreply.github.com"
          git add src/qtgui/ScreenPanel.cpp
          if git diff --cached --quiet; then
            echo "QFormLayout include already present"
            exit 0
          fi
          git commit -m "qtgui: restore ScreenPanel QFormLayout include" -m "The applicability migration removed ScreenPanel's direct QFormLayout include while the file still calls QFormLayout::addRow through m_currentGroupForm and m_form. Both focused Ubuntu architectures consequently failed at compile time with an incomplete-type error. Restore the required include; no GUI or processing behavior changes."
          git push origin HEAD:agent/qtgui-parameter-applicability
