name: Publish verified DN-017 domain diagnostic

on:
  push:
    branches:
      - review/dn-017-domains-stage

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/dn-017-domains-stage
          fetch-depth: 0
      - name: Apply exact locally-tested DN-017 patch
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git hash-object .dn017-domains.part.00)" = 0a925cb0e3956f290cf3a5df61c437054bcf8ea8
          test "$(git hash-object .dn017-domains.part.01)" = 502cee7b1ddcf509e762bcca1f4b6f387edaa562
          test "$(git hash-object .dn017-domains.part.02)" = ab09818c2135cd48f4aa2e906c7f2f4b314fe029
          test "$(git hash-object .dn017-domains.part.03)" = 2ad18a74edb5580a3cf40a4d0d58a061180fefcc
          test "$(git hash-object .dn017-tracker.md)" = f052653b4d4517e30124636cd3ab4f67d89b137f
          cat .dn017-domains.part.* > /tmp/DN017-domains.patch
          echo 'cf915f72c78cc4070487674395e00fa7ca7890cd8d234b7ae712b5f2b0805fff  /tmp/DN017-domains.patch' | sha256sum -c -
          git apply --check /tmp/DN017-domains.patch
          git apply /tmp/DN017-domains.patch
          mkdir -p doc
          cp .dn017-tracker.md doc/denoise-tracking.md
          git diff --check
          test "$(git hash-object src/libcolorscreen/analyze-base.C)" = 0568aefd86847af9a16db3693d5cd82d587c18dd
          test "$(git hash-object src/libcolorscreen/analyze-base.h)" = 8efebf13a215830cc0b0b7a9ac3d43e90f13b364
          test "$(git hash-object src/libcolorscreen/denoise.h)" = dd7dc16492e22af925a8f07fc29532ffb1236b60
          test "$(git hash-object src/libcolorscreen/render-interpolate.C)" = 27a1dd9d553a6af041f08d17c8839fed066903f8
          test "$(git hash-object src/libcolorscreen/render-interpolate.h)" = fc17b3926f314c4c700b93e02d03c62b1ce69052
          test "$(git hash-object src/libcolorscreen/unittests.C)" = 9393f3160b236c1a179b227e0d58038bd06d05cd
          test "$(git hash-object doc/denoise-tracking.md)" = f052653b4d4517e30124636cd3ab4f67d89b137f
          rm .dn017-domains.part.* .dn017-tracker.md .github/workflows/dn017-domains-stage.yml
          git add -A
          git config user.name 'OpenAI review'
          git config user.email 'review@openai.invalid'
          git commit -m 'denoise: compare noise domains on collected samples' -m 'Add a read-only DN-017 diagnostic that reuses the three-scale geometry/support estimator in linear intensity, density/log, and a generalized variance-stabilized domain derived from the linear floor+slope model. Add scalar, precise-RGB, Paget and synthetic domain regressions. Real Hurley/Paget measurements improve in density space while Dufay degrades; keep linear intensity as the filtering default and transformed domains diagnostic-only.'
          git push origin HEAD:review/dn-017-domains-stage
