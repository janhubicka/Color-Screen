name: TEMP fast publish coordinate optimize 2x2
on:
  pull_request:
    branches:
      - agent/tmp-coordinate-optimize-2x2-base
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eb66eab20b432a75d9a00dce6b7acedf43a4f068
          fetch-depth: 0
      - name: Apply checksum-pinned patch and publish clean branch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, pathlib
          pathlib.Path('/tmp/fix.patch').write_bytes(base64.b64decode(''))
          PY
          echo "62c46f134a7b6c3ca6b65e48d28785294b3cfbe335e8b810f21d815ca713dc29  /tmp/fix.patch" | sha256sum -c -
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' src/libcolorscreen/finetune.C src/libcolorscreen/include/finetune.h src/qtgui/CoordinateOptimizationWorker.cpp | sort)"
          git config user.name 'OpenAI Agent'
          git config user.email 'openai-agent@users.noreply.github.com'
          git add src/libcolorscreen/include/finetune.h src/libcolorscreen/finetune.C src/qtgui/CoordinateOptimizationWorker.cpp
          git commit -m 'qtgui: limit coordinate optimization to 2x2 screen periods' -m 'Limit the Geometry panel coordinate refinement to an exact 2x2 screen-period neighbourhood. Add an opt-in fixed_range finetune contract so the GUI can suppress strip-screen and minimum-pixel ROI enlargement while preserving historical adaptive sizing for every existing caller.'
          git branch -f agent/coordinate-optimize-2x2 HEAD
          git push --force origin agent/coordinate-optimize-2x2
