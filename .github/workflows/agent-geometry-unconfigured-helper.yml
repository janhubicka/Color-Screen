name: Agent geometry sentinel helper

on:
  push:
    branches: [agent/geometry-unconfigured-helper]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/geometry-unconfigured-sentinel
          fetch-depth: 0
      - name: Apply geometry sentinel refactor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changed = set()

          def edit(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {found}: {old[:100]!r}")
              text = text.replace(old, new, count)
              p.write_text(text)
              changed.add(path)

          # A default scr_to_img_parameters object now means geometry is not
          # configured.  Keep screen-type classification separate from the
          # actual existence of a usable mapping.
          edit('src/libcolorscreen/include/scr-to-img-parameters.h',
               '  point_t coordinate1 = { (coord_t)1, (coord_t)0 };\n',
               '  point_t coordinate1 = { (coord_t)0, (coord_t)0 };\n')
          edit('src/libcolorscreen/include/scr-to-img-parameters.h',
               '  point_t coordinate2 = { (coord_t)0, (coord_t)1 };\n',
               '  point_t coordinate2 = { (coord_t)0, (coord_t)0 };\n')
          edit('src/libcolorscreen/include/scr-to-img-parameters.h',
               '  lens_warp_correction_parameters lens_correction;\n\n  bool\n  operator==',
               '''  lens_warp_correction_parameters lens_correction;\n\n  /* Return true if a full screen-to-image mapping has been configured.\n     Zero coordinate vectors are the explicit unconfigured sentinel.  A mesh\n     is itself a complete mapping; otherwise require a finite, non-singular\n     two-dimensional basis.  This deliberately does not inspect TYPE: screen\n     process identity and mapping availability are separate state.  */\n  pure_attr bool\n  geometry_configured_p () const\n  {\n    if (mesh_trans)\n      return true;\n    const coord_t det = coordinate1.x * coordinate2.y\n                        - coordinate1.y * coordinate2.x;\n    return std::isfinite ((double)coordinate1.x)\n           && std::isfinite ((double)coordinate1.y)\n           && std::isfinite ((double)coordinate2.x)\n           && std::isfinite ((double)coordinate2.y)\n           && std::isfinite ((double)det) && det != 0;\n  }\n\n  bool\n  operator==''')
          edit('src/libcolorscreen/include/scr-to-img-parameters.h',
               '  DLL_PUBLIC void alternate_colors (solver_parameters &params);\n};\n} // namespace colorscreen\n',
               '''  DLL_PUBLIC void alternate_colors (solver_parameters &params);\n};\n\n/* Return true if PARAM describes a regular screen and carries a configured\n   mapping for that screen.  Use this for reconstruction/final-coordinate\n   operations; screen_has_regular_geometry_p() only classifies screen type.  */\ninline bool\nscreen_geometry_configured_p (const scr_to_img_parameters &param)\n{\n  return screen_has_regular_geometry_p (param.type)\n         && param.geometry_configured_p ();\n}\n} // namespace colorscreen\n''')

          # Full mapping setup must fail before matrix inversion/range work when
          # geometry is absent. Early optical correction remains independent.
          edit('src/libcolorscreen/scr-to-img.C',
               '''{\n  m_rotation_adjustment = rotation_adjustment;\n  if (!scr_to_img::set_parameters_for_early_correction (param, width, height))\n    return false;\n''',
               '''{\n  m_rotation_adjustment = rotation_adjustment;\n  if (!param.geometry_configured_p ())\n    return false;\n  if (!scr_to_img::set_parameters_for_early_correction (param, width, height))\n    return false;\n''')
          edit('src/libcolorscreen/scr-to-img.C',
               '''void\nscr_to_img::update_linear_parameters (scr_to_img_parameters &param)\n{\n  m_param = param;\n  initialize ();\n}\n''',
               '''void\nscr_to_img::update_linear_parameters (scr_to_img_parameters &param)\n{\n  assert (param.geometry_configured_p ());\n  if (!param.geometry_configured_p ())\n    return;\n  m_param = param;\n  initialize ();\n}\n''')

          # The stitching bootstrap wants an identity coordinate transform for
          # its common canvas; make that provisional geometry explicit instead
          # of inheriting it from global defaults.
          edit('src/libcolorscreen/stitch-project.C',
               '''  scr_param.type = NoScreen;\n  data.width=1000;\n''',
               '''  scr_param.type = NoScreen;\n  scr_param.coordinate1 = { (coord_t)1, (coord_t)0 };\n  scr_param.coordinate2 = { (coord_t)0, (coord_t)1 };\n  data.width=1000;\n''')

          # Core reconstruction gates: screen type alone is not enough.
          edit('src/libcolorscreen/render-tile.C',
               '  if (!screen_has_regular_geometry_p (param.type)\n      && (render_type_properties[(int)rtparam.type].flags\n',
               '  if (!screen_geometry_configured_p (param)\n      && (render_type_properties[(int)rtparam.type].flags\n')
          edit('src/libcolorscreen/render-interpolate.C',
               '  if (!screen_has_regular_geometry_p (m_scr_to_img_param.type))\n    return false;\n',
               '  if (!screen_geometry_configured_p (m_scr_to_img_param))\n    return false;\n')
          edit('src/libcolorscreen/finetune.C',
               '  if (area.empty_p () || !screen_has_regular_geometry_p (param.type))\n',
               '  if (area.empty_p () || !screen_geometry_configured_p (param))\n')
          edit('src/libcolorscreen/focus-analysis.C',
               '  if (!screen_has_regular_geometry_p (param.type) || parameters.max_analysis_dimension < 32\n',
               '  if (!screen_geometry_configured_p (param) || parameters.max_analysis_dimension < 32\n')

          # File rendering must reject screen geometry before constructing a
          # renderer and computing a potentially enormous final range.
          edit('src/libcolorscreen/render-to-file.C',
               '''      if (!stitch)\n\t{\n\t  render_img render (*param, *scan, rparam, 65535);\n''',
               '''      if (!stitch)\n\t{\n\t  if (!param || !scan || !screen_geometry_configured_p (*param))\n\t    return false;\n\t  render_img render (*param, *scan, rparam, 65535);\n''')

          # GUI/final-coordinate consumers use actual configured geometry.
          replacements = {
            'src/qtgui/CoordinateTransformer.cpp': [
              ('scrToImg && colorscreen::screen_has_regular_geometry_p(\n                              scrToImg->type)',
               'scrToImg && colorscreen::screen_geometry_configured_p(*scrToImg)')],
            'src/qtgui/NavigationView.cpp': [
              ('m_scrToImg && colorscreen::screen_has_regular_geometry_p(\n                         m_scrToImg->type)',
               'm_scrToImg && colorscreen::screen_geometry_configured_p(*m_scrToImg)')],
            'src/qtgui/CapturePanel.cpp': [
              ('colorscreen::screen_has_regular_geometry_p(state.scrToImg.type)',
               'colorscreen::screen_geometry_configured_p(state.scrToImg)')],
            'src/qtgui/ColorPanel.cpp': [
              ('colorscreen::screen_has_regular_geometry_p(state.scrToImg.type)',
               'colorscreen::screen_geometry_configured_p(state.scrToImg)')],
            'src/qtgui/SharpnessPanel.cpp': [
              ('colorscreen::screen_has_regular_geometry_p(\n                 state.scrToImg.type)',
               'colorscreen::screen_geometry_configured_p(state.scrToImg)')],
            'src/qtgui/RenderDialog.cpp': [
              ('!screen_has_regular_geometry_p(scrParams.type)',
               '!screen_geometry_configured_p(scrParams)'),
              ('if (colorscreen::screen_has_regular_geometry_p(scrParams.type)) {',
               'if (colorscreen::screen_geometry_configured_p(scrParams)) {')],
            'src/qtgui/ImageViewWindow.cpp': [
              ('!screen_has_regular_geometry_p(m_scrToImgParams.type)',
               '!screen_geometry_configured_p(m_scrToImgParams)'),
              ('m_scan && colorscreen::screen_has_regular_geometry_p(\n                       m_scrToImgParams.type)',
               'm_scan && colorscreen::screen_geometry_configured_p(\n                       m_scrToImgParams)')],
            'src/qtgui/MainWindow.cpp': [
              ('!colorscreen::screen_has_regular_geometry_p(\n                                  m_scrToImgParams.type)',
               '!colorscreen::screen_geometry_configured_p(m_scrToImgParams)'),
              ('m_scan && colorscreen::screen_has_regular_geometry_p(\n                     m_scrToImgParams.type)',
               'm_scan && colorscreen::screen_geometry_configured_p(\n                     m_scrToImgParams)'),
              ('m_scan && colorscreen::screen_has_regular_geometry_p(\n                                     m_scrToImgParams.type)',
               'm_scan && colorscreen::screen_geometry_configured_p(\n                                     m_scrToImgParams)')],
          }
          for path, reps in replacements.items():
              for old, new in reps:
                  p = Path(path)
                  text = p.read_text()
                  n = text.count(old)
                  if n < 1:
                      raise SystemExit(f"{path}: expected at least one occurrence: {old!r}")
                  text = text.replace(old, new)
                  p.write_text(text)
                  changed.add(path)

          # Geometry-panel discovery stays available with zero geometry, while
          # correction/refinement/final presentation waits for a real mapping.
          edit('src/qtgui/GeometryPanel.cpp',
               '''  addButtonParameter("Correction", "Swap screen colors", [this]() {\n      emit alternateColorsRequested();\n  }, nullptr, "Swap the symmetric screen-color assignment if the reconstructed colors are implausible.");\n''',
               '''  addButtonParameter("Correction", "Swap screen colors", [this]() {\n      emit alternateColorsRequested();\n  }, [](const ParameterState &s) {\n      return colorscreen::screen_geometry_configured_p(s.scrToImg);\n  }, "Swap the symmetric screen-color assignment if the reconstructed colors are implausible.");\n''')
          edit('src/qtgui/GeometryPanel.cpp',
               '''  addButtonParameter("Step 2", "Optimize coordinates", [this]() {\n      emit optimizeCoordinatesRequested();\n  }, nullptr, "Refine the detected screen coordinate system using the image data.");\n''',
               '''  addButtonParameter("Step 2", "Optimize coordinates", [this]() {\n      emit optimizeCoordinatesRequested();\n  }, [](const ParameterState &s) {\n      return colorscreen::screen_geometry_configured_p(s.scrToImg);\n  }, "Refine the detected screen coordinate system using the image data.");\n''')
          edit('src/qtgui/GeometryPanel.cpp',
               '''  addButtonParameter("Step 3", "Add registration points", [this]() {\n      emit automaticallyAddPointsRequested(m_finetuneAreaParams);\n  }, nullptr, "Automatically identify and add registration points within the current crop area.");\n''',
               '''  addButtonParameter("Step 3", "Add registration points", [this]() {\n      emit automaticallyAddPointsRequested(m_finetuneAreaParams);\n  }, [](const ParameterState &s) {\n      return colorscreen::screen_geometry_configured_p(s.scrToImg);\n  }, "Automatically identify and add registration points within the current crop area.");\n''')
          edit('src/qtgui/GeometryPanel.cpp',
               '''  addButtonParameter("", "Add points in selected area", [this]() {\n      emit automaticallyAddPointsInAreaRequested(m_finetuneAreaParams);\n  }, nullptr, "Select an area and automatically identify and add registration points within it.");\n''',
               '''  addButtonParameter("", "Add points in selected area", [this]() {\n      emit automaticallyAddPointsInAreaRequested(m_finetuneAreaParams);\n  }, [](const ParameterState &s) {\n      return colorscreen::screen_geometry_configured_p(s.scrToImg);\n  }, "Select an area and automatically identify and add registration points within it.");\n''')
          edit('src/qtgui/GeometryPanel.cpp',
               '      return colorscreen::screen_has_regular_geometry_p(s.scrToImg.type);\n',
               '      return colorscreen::screen_geometry_configured_p(s.scrToImg);\n')
          edit('src/qtgui/GeometryPanel.cpp',
               '''  bool showLens = hasScan && !state.scrToImg.lens_correction.is_noop();\n  bool showPerspective = hasScan && (std::abs(state.scrToImg.tilt_x) > 1e-6 || std::abs(state.scrToImg.tilt_y) > 1e-6);\n  bool showNonlinear = hasScan && (state.scrToImg.mesh_trans != nullptr);\n  bool showFinal = hasScan && colorscreen::screen_has_regular_geometry_p(\n                                  state.scrToImg.type);\n''',
               '''  const bool hasGeometry =\n      hasScan && colorscreen::screen_geometry_configured_p(state.scrToImg);\n  bool showLens = hasGeometry && !state.scrToImg.lens_correction.is_noop();\n  bool showPerspective = hasGeometry && (std::abs(state.scrToImg.tilt_x) > 1e-6 || std::abs(state.scrToImg.tilt_y) > 1e-6);\n  bool showNonlinear = hasGeometry && (state.scrToImg.mesh_trans != nullptr);\n  bool showFinal = hasGeometry;\n''')

          # Preserve detection semantics: a selected regular process is enough
          # to START coordinate discovery.  Do not change ScreenPanel's type
          # classification checks.

          # Regression coverage for the sentinel and full-map rejection.
          edit('testsuite/unittests.test',
               '#include "ParameterState.h"\n\n#include <cstdio>\n',
               '#include "ParameterState.h"\n#include "scr-to-img.h"\n\n#include <cstdio>\n')
          edit('testsuite/unittests.test',
               '''  if (render_parameters::capture_has_screen_p (\n''',
               '''  scr_to_img_parameters unset_geometry;\n  unset_geometry.type = Paget;\n  if (unset_geometry.coordinate1.x != 0 || unset_geometry.coordinate1.y != 0\n      || unset_geometry.coordinate2.x != 0 || unset_geometry.coordinate2.y != 0\n      || unset_geometry.geometry_configured_p ()\n      || screen_geometry_configured_p (unset_geometry))\n    {\n      std::fprintf (stderr, "Default screen geometry is not the zero sentinel\\n");\n      return 1;\n    }\n  image_data geometry_scan;\n  if (!geometry_scan.set_dimensions (8, 8, true, false))\n    return 1;\n  scr_to_img unset_map;\n  if (unset_map.set_parameters (unset_geometry, geometry_scan))\n    {\n      std::fprintf (stderr, "Unconfigured geometry produced a full map\\n");\n      return 1;\n    }\n  unset_geometry.coordinate1 = { 8, 0 };\n  unset_geometry.coordinate2 = { 0, 8 };\n  if (!unset_geometry.geometry_configured_p ()\n      || !screen_geometry_configured_p (unset_geometry)\n      || !unset_map.set_parameters (unset_geometry, geometry_scan))\n    {\n      std::fprintf (stderr, "Configured regular geometry was rejected\\n");\n      return 1;\n    }\n\n  if (render_parameters::capture_has_screen_p (\n''')

          expected = {
            'src/libcolorscreen/include/scr-to-img-parameters.h',
            'src/libcolorscreen/scr-to-img.C',
            'src/libcolorscreen/stitch-project.C',
            'src/libcolorscreen/render-tile.C',
            'src/libcolorscreen/render-interpolate.C',
            'src/libcolorscreen/finetune.C',
            'src/libcolorscreen/focus-analysis.C',
            'src/libcolorscreen/render-to-file.C',
            'src/qtgui/CoordinateTransformer.cpp',
            'src/qtgui/NavigationView.cpp',
            'src/qtgui/CapturePanel.cpp',
            'src/qtgui/ColorPanel.cpp',
            'src/qtgui/SharpnessPanel.cpp',
            'src/qtgui/RenderDialog.cpp',
            'src/qtgui/ImageViewWindow.cpp',
            'src/qtgui/MainWindow.cpp',
            'src/qtgui/GeometryPanel.cpp',
            'testsuite/unittests.test',
          }
          if changed != expected:
              raise SystemExit(f"changed-file guard mismatch: got {sorted(changed)}, expected {sorted(expected)}")
          PY

          git diff --check
          git status --short
          test "$(git status --short | wc -l)" -eq 18

          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/libcolorscreen src/qtgui testsuite/unittests.test
          git commit -F - <<'EOF'
          geometry: represent unconfigured mapping explicitly

          Make zero coordinate vectors the default scr_to_img state and distinguish
          screen types that can have regular geometry from parameters that actually
          contain a usable mapping.

          Reject full screen-to-image setup and screen-coordinate rendering before
          inverse/range computation when geometry is absent. Keep early optical
          correction and coordinate discovery available without an existing map,
          and give stitching its intentional identity bootstrap explicitly.

          Gate Qt final-coordinate/reconstruction consumers on configured geometry,
          while leaving the coordinate-detection entry point available for a chosen
          regular screen. Add persistence/unit coverage proving the zero sentinel is
          preserved and cannot construct a full mapping.
          EOF
          git push origin HEAD:agent/geometry-unconfigured-sentinel
