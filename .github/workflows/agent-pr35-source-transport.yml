name: Agent PR35 apply fix

on:
  push:
    branches:
      - agent/pr35-source-transport-20260821

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: transport
      - uses: actions/checkout@v4
        with:
          ref: agent/scr-detect-measurement
          fetch-depth: 0
          path: target
      - name: Apply inspected follow-up
        shell: bash
        run: |
          cd target
          if git apply --check ../transport/.github/pr35-followup.patch; then
            git apply ../transport/.github/pr35-followup.patch
          elif git apply --reverse --check ../transport/.github/pr35-followup.patch; then
            echo "Patch already applied"
            exit 0
          else
            echo "Patch does not apply cleanly"
            exit 1
          fi
          git diff --check
          git diff --stat
      - name: Commit fix to PR branch
        shell: bash
        run: |
          cd target
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add doc/scr-detect-geometry-tracking.md \
                  src/libcolorscreen/include/scr-detect-parameters.h \
                  src/libcolorscreen/scr-detect-geometry.C \
                  src/libcolorscreen/unittests.C
          git commit -m "detect: restore compatibility sharpening default" \
            -m "Restore the historical radius 2 / amount 3 pre-classification mask after the real Dufay integration fixtures demonstrated that zeroing the default still breaks autodetection. Keep explicit zero values available for the fast-only experiment. Count RGB precomputation accurately when the compatibility mask causes precompute_all to materialize adjusted pixels, and make the synthetic statistics check cover both the default and explicitly unsharpened paths. Record the Batch 08 EIP corpus and the compatibility dependency in the geometry tracking register."
          git push origin HEAD:agent/scr-detect-measurement
