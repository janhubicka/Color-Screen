name: TEMP focus multistart push build

on:
  push:
    branches:
      - agent/tmp-focus-multistart-build-trigger-20260827

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/janhubicka/color-screen-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: agent/tmp-focus-multistart-build-base-20260827
          fetch-depth: 0

      - name: Apply byte-verified patch
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cat agent/focus-multistart.patch.part-* >/tmp/focus.patch
          cp agent/focus-multistart-fix.patch /tmp/focus-fix.patch
          echo '51d28c73086610228990902ef8ab0a0df3280fb372f265d1aa2c0d92c944a4ce  /tmp/focus.patch' | sha256sum -c -
          echo '3a8958b03078e0f27ead2c2643a1119520fd3f39972acc5830b68c2db06e3380  /tmp/focus-fix.patch' | sha256sum -c -
          git checkout --detach a86ac611846419ace3934ac8f46752b5e8abb4a8
          git apply --check /tmp/focus.patch
          git apply /tmp/focus.patch
          git apply --check /tmp/focus-fix.patch
          git apply /tmp/focus-fix.patch
          git diff --check

      - name: Build and test
        shell: bash
        run: |
          set -euxo pipefail
          CXXFLAGS='-O2 -g' CFLAGS='-O2 -g' ./configure
          make -C src/libcolorscreen -j$(nproc) focus-analysis-unittests
          ./src/libcolorscreen/focus-analysis-unittests
          make -C src/colorscreen -j$(nproc) colorscreen
          ./src/colorscreen/colorscreen analyze-focus-areas --help >/tmp/help.txt 2>&1 || true
          grep -q -- '--both' /tmp/help.txt

      - name: Package portable CLI
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p focus-cli/lib
          bin=src/colorscreen/colorscreen
          if ! file "$bin" | grep -q ELF; then
            bin=src/colorscreen/.libs/colorscreen
          fi
          cp "$bin" focus-cli/colorscreen.bin
          ldd "$bin" >focus-cli/ldd.txt
          awk '/=> \/[^ ]+/ { print $3 }' focus-cli/ldd.txt | sort -u | while read -r lib; do
            base=$(basename "$lib")
            case "$base" in
              libc.so.*|libm.so.*|ld-linux*|libpthread.so.*|libdl.so.*|librt.so.*) continue ;;
            esac
            cp -L "$lib" focus-cli/lib/ || true
          done
          printf '%s\n' '#!/bin/sh' 'here=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)' 'LD_LIBRARY_PATH="$here/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" exec "$here/colorscreen.bin" "$@"' >focus-cli/colorscreen
          chmod +x focus-cli/colorscreen
          tar czf colorscreen-focus-multistart-cli.tar.gz focus-cli

      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: focus-multistart-cli
          path: colorscreen-focus-multistart-cli.tar.gz
          retention-days: 2
