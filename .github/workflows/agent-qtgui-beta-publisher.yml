name: Agent Qt GUI beta patch publisher

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/tmp-qtgui-beta-readiness-publisher-20260830'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and validate patch
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/qtgui-beta-patch/part* > /tmp/qtgui-beta.patch.b64
          echo "f11288e21bcfcaadcee758ab9cf6e39a9d101fd4718570f921247d4aa623eade  /tmp/qtgui-beta.patch.b64" | sha256sum -c -
          base64 -d /tmp/qtgui-beta.patch.b64 > /tmp/qtgui-beta.patch
          echo "703b0773dd3adbd9731d3a4b1c1ad52b809d0f5a2e31b3740c1f7c7da1568ace  /tmp/qtgui-beta.patch" | sha256sum -c -

      - name: Create clean review branch
        shell: bash
        env:
          BRANCH: agent/qtgui-beta-readiness
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B "$BRANCH" origin/main
          git apply --check /tmp/qtgui-beta.patch
          git apply --index /tmp/qtgui-beta.patch
          git diff --cached --check
          sh -n build-aux/check-generated-build-metadata.sh
          sh build-aux/check-generated-build-metadata.sh
          git diff --cached --stat

          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          cat > /tmp/commit-message <<'EOF'
          qtgui: harden beta workflow and document UX direction

          Prepare the Qt GUI for use by non-authors without destabilizing the
          recently hardened multi-document architecture. Fix several small but
          user-visible correctness and robustness issues and document a staged
          path toward RAW-editor-style workflow conventions appropriate for
          historical color reconstruction.

          Keep unrelated controls as separate undo steps while preserving slider
          drag coalescing. Make wrapped inspector tabs use explicit logical
          visibility rather than ancestor visibility. Prevent Profile auto color
          optimization from retriggering on its own result or unrelated parameter
          refreshes.

          Complete Qt GUI source distributions by adding all local headers and
          resources.qrc to EXTRA_DIST, keep the checked-in Makefile.in synchronized,
          and extend the fast metadata guard to cover distribution inputs in both
          Automake source and generated output.

          Add an internal beta-readiness/robustness audit and an operator-facing
          workflow roadmap for advanced museum digitization users. Keep the
          existing nine-panel order stable for beta, while defining capture,
          historical-process, registration/reconstruction, appearance and output
          stages for later UI consolidation. Correct README single-tab behavior and
          link the roadmap from user/developer documentation.

          Local validation:
          - git diff --check
          - sh -n build-aux/check-generated-build-metadata.sh
          - positive metadata guard: 57 sources, 73 distributed inputs
          - negative guard tests for missing Makefile.am and stale Makefile.in
          - Makefile.am/Makefile.in EXTRA_DIST set equality

          Full Qt compilation is left to repository CI because the audit container
          does not provide Qt6 development packages. Automake regeneration was
          also unavailable locally because the container has Automake 1.17 while
          the checked-in files were generated by 1.18.1; the generated EXTRA_DIST
          set was updated and verified directly instead.
          EOF
          sed -i 's/^          //' /tmp/commit-message
          git commit -F /tmp/commit-message
          git push origin "HEAD:refs/heads/$BRANCH"
