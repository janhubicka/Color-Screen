name: Publish exact DN-013 three-scale tree

on:
  push:
    branches:
      - review/dn-013-three-scale-publish

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/dn-013-three-scale-publish
          fetch-depth: 0
      - name: Reconstruct exact locally-tested source tree
        shell: bash
        run: |
          set -euxo pipefail
          python3 .dn013-three-scale.py
          python3 .dn013-three-scale-fix.py
          cp .dn013-three-scale-tracker.md doc/denoise-tracking.md
          git diff --check

          test "$(git hash-object src/libcolorscreen/denoise.h)" = bb45c5df0d4bc71f8d6a7c9865e5ba1b994ef9d7
          test "$(git hash-object src/libcolorscreen/analyze-base.C)" = f3eb9c923d994692dd3cdcc94c3c263eeca8d9b9
          test "$(git hash-object src/libcolorscreen/analyze-base.h)" = cdced79efcf96c46931b5cab7de32098a868ed0f
          test "$(git hash-object src/libcolorscreen/render-interpolate.C)" = 687edc6b242db62785f9f88f58a02f287bd199bd
          test "$(git hash-object src/libcolorscreen/render-interpolate.h)" = 01e1d052b6a232752a8746c5d0554b20d9189812
          test "$(git hash-object src/libcolorscreen/unittests.C)" = 6c5de4add6b33d03dcded1d40a7bd1742a2279dc
          test "$(git hash-object doc/denoise-tracking.md)" = cc1e7ded08332db1b81a1c61261b126116cc4d79

          rm .dn013-three-scale.py .dn013-three-scale-fix.py \
             .dn013-three-scale-tracker.md \
             .github/workflows/dn013-three-scale-stage.yml \
             .github/workflows/dn013-three-scale-publish.yml
          git add -A
          git config user.name 'OpenAI review'
          git config user.email 'review@openai.invalid'
          git commit -m 'denoise: add empirical three-scale noise diagnostic' \
            -m 'Compare identical support-qualified screen samples at physical spacings 1, 2 and 3. Report robust scale ratios and, only when scale-dependent excess is strong and monotone, fit an empirical V(h)=N+A*h^p law with free exponent p. Keep the result diagnostic-only. Record real Hurley/Paget and Dufay measurements showing that the spatial decomposition is not stable across colour separations, so automatic variance calibration remains deferred.'
          git push origin HEAD:review/dn-013-three-scale-publish
