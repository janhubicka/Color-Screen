name: Agent primary-view tool handoff fix

on:
  pull_request:
    branches: [ "agent/tmp-new-view-source-base-20260828" ]

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/tmp-new-view-source-trigger-20260828'
    runs-on: ubuntu-24.04
    steps:
      - name: Let all base publishers settle
        run: sleep 150
      - uses: actions/checkout@v4
        with:
          repository: janhubicka/Color-Screen
          ref: agent/new-view-parity
          fetch-depth: 0
      - name: Cover the primary-widget early return
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def bounds(text, needle):
              start = text.find(needle)
              if start < 0: raise RuntimeError(f'missing {needle}')
              brace = text.find('{', start)
              depth = 0
              for pos in range(brace, len(text)):
                  if text[pos] == '{': depth += 1
                  elif text[pos] == '}':
                      depth -= 1
                      if depth == 0: return start, brace, pos
              raise RuntimeError(f'unterminated {needle}')

          path = Path('src/qtgui/MainWindow.cpp')
          text = path.read_text()
          _, b, e = bounds(text, 'void MainWindow::setInspectorImageWidget(')
          body = text[b + 1:e]
          marker = 'transferInteractionMode && target == m_imageWidget'
          if marker not in body:
              primary = body.find('if (target == m_imageWidget)')
              if primary < 0:
                  raise RuntimeError('primary ImageWidget early-return branch missing')
              line = body.rfind('\n', 0, primary) + 1
              indent = body[line:primary]
              handoff = (indent + 'if (transferInteractionMode && target == m_imageWidget) {\n' +
                         indent + '  previousTarget->setInteractionMode(ImageWidget::PanMode);\n' +
                         indent + '  target->setInteractionMode(requestedMode);\n' +
                         indent + '  return;\n' +
                         indent + '}\n')
              body = body[:line] + handoff + body[line:]
          text = text[:b + 1] + body + text[e:]
          path.write_text(text)
          PY
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git add src/qtgui/MainWindow.cpp
          git commit -m "qtgui: preserve tools when returning to the primary canvas" -m "Handle MainWindow's primary-ImageWidget early return explicitly so a pending or persistent interaction mode is transferred in both directions between an ordinary New View and the original canvas."
          git push --force-with-lease origin HEAD:agent/new-view-parity
