name: Publish focus-area Qt follow-up

on:
  pull_request:
    branches:
      - agent/focus-uniform-bw-publish-base-20260821

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/focus-uniform-bw-publisher-20260821'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact publisher payload
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: transport

      - name: Check out PR 99 branch
        uses: actions/checkout@v4
        with:
          ref: agent/qt-focus-area-analysis
          fetch-depth: 0
          path: repo

      - name: Apply and publish Qt monochrome fix
        shell: bash
        run: |
          set -euxo pipefail
          cd repo
          expected=ecdcf51cdfee1e42a18a937092c8c67680b7c8ab
          test "$(git rev-parse HEAD)" = "$expected"
          cat ../transport/agent/focus-area-followup.patch.* > /tmp/focus-area-followup.patch
          git apply --check /tmp/focus-area-followup.patch
          git apply /tmp/focus-area-followup.patch
          git diff --check
          test "$(git diff --name-only)" = 'src/qtgui/MainWindow.cpp'
          grep -q 'focusAnalysisUsesMonochromeInput' src/qtgui/MainWindow.cpp
          grep -q 'local.flags |= colorscreen::finetune_bw' src/qtgui/MainWindow.cpp
          grep -q 'analysisParameters.held_out = !useMonochrome' src/qtgui/MainWindow.cpp
          ! grep -q 'Automatic focus-area discovery requires RGB input' src/qtgui/MainWindow.cpp
          git add -- src/qtgui/MainWindow.cpp
          git diff --cached --check
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git commit -F - <<'EOF'
          qtgui: route monochrome focus areas through BW model

          Remove the stale GUI-only RGB requirement from automatic focus-area
          discovery now that the library reconstructs the image layer from
          grayscale/IR scans.

          Route genuine monochrome input through finetune_bw for both the
          individual verification fits and the joint multi-area fit.  Detect
          RGB files that only contain one gain-scaled monochrome scanner signal
          by their nearly constant raw-pixel chromaticity, so storing a BW scan
          as RGB does not accidentally select the ill-conditioned RGB model.

          The BW path uses the per-area primary-intensity model added by the
          previous follow-up and keeps leave-one-out stability validation.  Real
          RGB scans retain the uniform-image-layer model and frozen held-out
          validation unchanged.
          EOF
          git push origin HEAD:refs/heads/agent/qt-focus-area-analysis
          printf 'Published %s on %s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^)"
